<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1c3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="도형 방어선">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>도형 방어선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 설계도 콘셉트: 짙은 청색 도면 위에 선으로 그린 도형. 세로 4단(상태, 전장, 무기 5칸, 인벤토리) */
  color-scheme: dark;
  --bg: #0e1c3a;
  --panel: #13264d;
  --panel-2: #1a3263;
  --line: rgba(150, 190, 255, .18);
  --ink: #e9f0ff;
  --dim: #93a8cf;
  --accent: #ffd166;
  --danger: #ff5d5d;
  --ok: #7af0c1;
  --g0: #aab6cc;
  --g1: #5cb8ff;
  --g2: #c48bff;
  --g3: #ffa63d;
  --font-display: 'Do Hyeon', 'IBM Plex Sans KR', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --slot-h: 76px;
  --cell-h: 40px;
}
@media (min-height: 760px) { :root { --slot-h: 88px; --cell-h: 48px; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: #081226; color: var(--ink);
  font: 400 13px/1.35 var(--font-body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
b { font-weight: 600; }
.g0 { color: var(--g0); } .g1 { color: var(--g1); } .g2 { color: var(--g2); } .g3 { color: var(--g3); }

#app {
  position: relative; height: 100%; max-width: 480px; margin: 0 auto;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
  background: var(--bg);
}

/* 상태 표시 */
#hud {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.hp { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
.hp-bar { flex: 1; height: 10px; border: 1px solid var(--line); background: rgba(0, 0, 0, .25); border-radius: 2px; overflow: hidden; }
.hp-bar i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .15s; }
.hp-bar i.low { background: var(--danger); }
#hpTxt { font: 16px var(--font-display); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; }
.stat small { font-size: 10px; color: var(--dim); }
.stat b { font: 16px var(--font-display); font-variant-numeric: tabular-nums; }
.stat.gold b { color: var(--accent); }
#pauseBtn, #speedBtn { width: 38px; height: 34px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; color: var(--dim); }
#speedBtn.on { color: #1c1503; background: var(--accent); border-color: var(--accent); font-weight: 600; }

/* 전장 */
#fieldWrap { position: relative; min-height: 0; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* 무기 5칸: 전장의 5개 레인과 세로로 정렬 */
#weapons {
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--panel); border-top: 2px solid var(--line); border-bottom: 1px solid var(--line);
}
.slot {
  position: relative; height: var(--slot-h); margin: 4px 3px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 1.5px solid var(--line); border-radius: 6px; background: rgba(0, 0, 0, .18);
}
.slot.empty { border-style: dashed; }
.slot .plus { font: 22px var(--font-display); color: var(--dim); opacity: .5; }
.slot .lv { font: 15px var(--font-display); line-height: 1; }
.slot.sel { border-color: var(--accent); background: rgba(255, 209, 102, .1); }
.slot.tg { border-color: var(--ok); border-style: dashed; animation: blink .8s linear infinite; }
@keyframes blink { 50% { background: rgba(122, 240, 193, .16); } }
.pips { display: flex; gap: 3px; height: 6px; }
.pips i { width: 8px; height: 6px; border: 1px solid rgba(150, 190, 255, .35); }
.pips i.pa { width: 6px; border-radius: 50%; }
.slot .pop {
  position: absolute; left: 50%; top: -4px; transform: translate(-50%, 0); white-space: nowrap; pointer-events: none;
  font: 15px var(--font-display); animation: rise .7s ease-out forwards; z-index: 2;
  text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, .8);
}
.slot .pop.ok { color: var(--ok); } .slot .pop.no { color: var(--danger); }
@keyframes rise { to { transform: translate(-50%, -26px); opacity: 0; } }
.slot.flash-ok { border-color: var(--ok); } .slot.flash-no { border-color: var(--danger); }

/* 하단: 인벤토리 또는 무기 상세 */
#bottom { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.info { height: 34px; font-size: 12px; line-height: 17px; color: var(--dim); overflow: hidden; }
.info b { color: var(--ink); }
.info .g0 { color: var(--g0); } .info .g1 { color: var(--g1); } .info .g2 { color: var(--g2); } .info .g3 { color: var(--g3); }
.info.warn { color: var(--accent); }
.inv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.cell {
  position: relative; height: var(--cell-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  border: 1.5px solid var(--line); border-radius: 5px; background: var(--panel); line-height: 1.05;
}
.cell.empty { background: rgba(0, 0, 0, .15); border-style: dashed; }
.cell b { font: 13px var(--font-display); font-variant-numeric: tabular-nums; }
.cell small { font-size: 9px; color: var(--dim); }
.cell .ab { font: 15px var(--font-display); }
.cell svg { flex: none; }
.cell.kp.g0 { border-color: var(--g0); color: var(--g0); }
.cell.kp.g1 { border-color: var(--g1); color: var(--g1); background: rgba(92, 184, 255, .1); }
.cell.kp.g2 { border-color: var(--g2); color: var(--g2); background: rgba(196, 139, 255, .12); }
.cell.kp.g3 { border-color: var(--g3); color: var(--g3); background: rgba(255, 166, 61, .14); }
.cell.ks b { color: var(--accent); }
.cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.new { animation: got .5s ease-out; }
@keyframes got { from { transform: scale(1.18); box-shadow: 0 0 0 3px rgba(255, 209, 102, .5); } }

.acts { display: grid; grid-template-columns: 1fr; gap: 6px; }
.acts.two { grid-template-columns: 1.5fr 1fr; }
.slot, .cell { touch-action: none; -webkit-touch-callout: none; }
.ghost {
  position: fixed; z-index: 20; pointer-events: none; transform: translate(-50%, -85%) scale(1.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.05;
  border: 2px solid var(--accent); border-radius: 6px; background: var(--panel-2); box-shadow: 0 8px 20px rgba(0, 0, 0, .55);
}
.ghost b { font: 14px var(--font-display); } .ghost small { font-size: 9px; } .ghost .ab { font: 16px var(--font-display); }
.ghost .pips, .ghost .pop { display: none; }
#app.dragging .slot, #app.dragging .cell { border-style: dashed; }
#app.dragging .over { border-color: var(--accent); border-style: solid; background: rgba(255, 209, 102, .2); }
.dragsrc { opacity: .3; }
.btn {
  height: 42px; border-radius: 5px; border: 1.5px solid var(--line); background: var(--panel-2);
  font: 600 14px var(--font-body); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px;
}
.btn small { font-weight: 400; font-size: 11px; color: var(--dim); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1c1503; }
.btn.primary small { color: #5c4a12; }
.btn.primary b { font: 16px var(--font-display); }
.btn.off { opacity: .42; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:active { transform: translateY(1px); }

/* 무기 창 */
.d-acts { display: grid; grid-template-columns: 1.7fr 1fr; gap: 6px; }
.wm { gap: 8px; }
.wm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.wm-head .nm { display: block; font: 24px/1.1 var(--font-display); }
.wm-head .st { font-size: 11.5px; color: var(--dim); }
.wm-head .x { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; color: var(--ink); flex: none; }
.schem {
  position: relative; height: 178px; flex: none; border: 1px solid var(--line); border-radius: 6px;
  background-color: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 18px 18px; background-position: -1px -1px;
}
.schem .lab { position: absolute; left: 8px; top: 6px; font-size: 11px; color: var(--dim); }
.schem .wires { position: absolute; inset: 0; width: 100%; height: 100%; }
.schem .core {
  position: absolute; left: 50%; top: 54%; width: 86px; height: 86px; transform: translate(-50%, -50%);
  border: 2px solid; border-radius: 50%; background: var(--panel);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.schem .core b { font: 15px var(--font-display); }
.schem .pop {
  position: absolute; left: calc(100% + 44px); top: 30px; transform: translate(-50%, 0); white-space: nowrap; pointer-events: none;
  font: 26px var(--font-display); animation: rise .7s ease-out forwards; text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, .8);
}
.schem .pop.ok { color: var(--ok); } .schem .pop.no { color: var(--danger); }
.pt {
  position: absolute; width: 94px; height: 48px; transform: translateX(-50%); gap: 1px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
  border: 1.5px solid var(--line); border-radius: 5px; background: var(--panel);
}
.pt b { font: 17px var(--font-display); }
.pt small { font-size: 10.5px; white-space: nowrap; }
.pt svg { flex: none; }
.pt.p0 { left: 50%; top: 5px; } .pt.p1 { left: 17%; bottom: 7px; } .pt.p2 { left: 83%; bottom: 7px; }
.pt.empty { border-style: dashed; color: var(--dim); font-size: 11px; background: var(--bg); }
.pt.g0 { border-color: var(--g0); color: var(--g0); }
.pt.g1 { border-color: var(--g1); color: var(--g1); background: #142c55; }
.pt.g2 { border-color: var(--g2); color: var(--g2); background: #23285a; }
.pt.g3 { border-color: var(--g3); color: var(--g3); background: #2e2a3c; }
.pt.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.wm-info { min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 17px; color: var(--dim); }
.wm-info b { color: var(--ink); }
.wm-info .g0 { color: var(--g0); } .wm-info .g1 { color: var(--g1); } .wm-info .g2 { color: var(--g2); } .wm-info .g3 { color: var(--g3); }
.wm-info .warn { color: var(--accent); }
.btn.sm { height: 32px; padding: 0 14px; font-size: 13px; flex: none; }
.wm-sec { font-size: 11px; color: var(--dim); margin-bottom: -4px; }
.wm-augs { display: flex; flex-direction: column; gap: 5px; }
.arow {
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; align-items: center;
  padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--panel-2);
}
.arow .chip { font-size: 10.5px; font-weight: 600; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; }
.arow b { font: 16px var(--font-display); color: var(--ink); }
.arow .ds { grid-column: 1 / -1; font-size: 12px; color: var(--ink); }
.arow.empty { display: block; border-style: dashed; background: none; color: var(--dim); font-size: 11.5px; padding: 5px 14px; }
.arow.g0 { border-color: var(--g0); } .arow.g1 { border-color: var(--g1); } .arow.g2 { border-color: var(--g2); } .arow.g3 { border-color: var(--g3); }
@media (max-height: 640px) { .schem { height: 156px; } .schem .core { width: 72px; height: 72px; } .pt { height: 42px; } .modal.wm { padding: 12px; gap: 6px; } }

/* 겹침 창 */
#overlay {
  position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(6, 13, 30, .82);
}
#overlay[hidden] { display: none; }
.modal {
  width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto;
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.modal h1 { margin: 0; font: 40px/1 var(--font-display); letter-spacing: 1px; text-wrap: balance; }
.modal h1 span { color: var(--accent); }
.modal h2 { margin: 0; font: 24px/1.1 var(--font-display); }
.modal p { margin: 0; color: var(--dim); }
.modal ol { margin: 0; padding-left: 18px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.rec { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.rec div { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
.rec small { display: block; font-size: 10px; color: var(--dim); }
.rec b { font: 20px var(--font-display); font-variant-numeric: tabular-nums; }
.newrec { color: var(--accent); font-weight: 600; }
.aug {
  text-align: left; width: 100%; padding: 10px 12px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--panel-2);
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 3px; align-items: center;
}
.aug .chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.aug .nm { font: 18px var(--font-display); }
.aug .ds { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink); }
.aug .tag { grid-column: 1 / -1; font-size: 11px; color: var(--ok); }
.aug.g0 { border-color: var(--g0); } .aug.g1 { border-color: var(--g1); } .aug.g2 { border-color: var(--g2); } .aug.g3 { border-color: var(--g3); }
.aug.g3 { background: rgba(255, 166, 61, .12); } .aug.g2 { background: rgba(196, 139, 255, .1); }
.cur { font-size: 11.5px; color: var(--dim); }

@media (prefers-reduced-motion: reduce) {
  .slot.tg, .cell.new, .slot .pop { animation: none; }
  .slot .pop { opacity: 0; }
}

/* 파츠 그림과 목록 */
.cell.kp svg { display: block; }
.ghost.g0 { color: var(--g0); } .ghost.g1 { color: var(--g1); } .ghost.g2 { color: var(--g2); } .ghost.g3 { color: var(--g3); }
.prow {
  text-align: left; width: 100%; padding: 8px 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--panel-2);
  display: grid; grid-template-columns: auto auto 1fr; column-gap: 8px; row-gap: 2px; align-items: center;
}
.pic { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; border: 1.5px solid currentColor; border-radius: 6px; background: var(--bg); }
.prow .pic { grid-row: 1 / span 2; }
.prow .chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.prow .nm { font: 17px var(--font-display); color: var(--ink); }
.prow .ds { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink); }
.prow.g0 { border-color: var(--g0); } .prow.g1 { border-color: var(--g1); } .prow.g2 { border-color: var(--g2); } .prow.g3 { border-color: var(--g3); }
.curpart { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; }
.curpart.g0 { border-color: var(--g0); } .curpart.g1 { border-color: var(--g1); } .curpart.g2 { border-color: var(--g2); } .curpart.g3 { border-color: var(--g3); }
.curpart .tx { font-size: 12.5px; color: var(--ink); }
.plist { display: flex; flex-direction: column; gap: 6px; }
.modal p.warn { color: var(--accent); }

/* 증강: 두 번 눌러 확정 */
.aug.armed { outline: 3px solid var(--accent); outline-offset: 2px; }
.aug .tag.go { color: var(--accent); font-weight: 600; }

/* 강화 모드 표시 */
#weapons.upmode { background: linear-gradient(0deg, rgba(255, 209, 102, .2), rgba(255, 209, 102, 0) 75%), var(--panel); border-top-color: var(--accent); }
#weapons.upmode .slot:not(.empty) { border-color: var(--accent); animation: upglow 1s ease-in-out infinite; }
.cell.ks.sel { animation: upglow 1s ease-in-out infinite; }
@keyframes upglow { 50% { box-shadow: 0 0 0 2px rgba(255, 209, 102, .4), inset 0 0 14px rgba(255, 209, 102, .3); } }
.upcue { position: absolute; right: 6px; top: 4px; width: 12px; height: 20px; pointer-events: none; }
.upcue i {
  position: absolute; left: 0; top: 12px; width: 0; height: 0; opacity: 0;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 7px solid var(--accent);
  animation: upcue .9s linear infinite;
}
.upcue i:nth-child(2) { animation-delay: .45s; }
@keyframes upcue { 0% { top: 13px; opacity: 0; } 30% { opacity: 1; } 100% { top: -3px; opacity: 0; } }

/* 강화 결과 연출 */
#fxLayer { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
.upfx { position: absolute; --tx: -50%; }
.upfx .glow { position: absolute; inset: 0; border-radius: 6px; animation: upfade .9s ease-out forwards; }
.upfx.ok .glow { background: rgba(122, 240, 193, .5); box-shadow: 0 0 26px 8px rgba(122, 240, 193, .75); }
.upfx.no .glow { background: rgba(255, 93, 93, .45); box-shadow: 0 0 18px 4px rgba(255, 93, 93, .6); animation: upshake .45s linear, upfade .9s ease-out forwards; }
.upfx .ring { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; border: 3px solid var(--ok); animation: upring .7s ease-out forwards; }
.upfx.no .ring { display: none; }
.upfx b {
  position: absolute; left: 50%; bottom: calc(100% - 4px); white-space: nowrap; font: 28px var(--font-display);
  text-shadow: 0 2px 0 #000, 0 0 10px rgba(0, 0, 0, .9); animation: uptext 1.05s cubic-bezier(.2, 1.4, .4, 1) forwards;
}
.upfx.ok b { color: var(--ok); } .upfx.no b { color: var(--danger); font-size: 23px; }
.upfx.edge-l b { left: 2px; --tx: 0%; } .upfx.edge-r b { left: auto; right: 2px; --tx: 0%; }
.upfx s { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--accent); animation: upspark .7s ease-out forwards; }
@keyframes upfade { to { opacity: 0; } }
@keyframes upring { from { transform: scale(.4); opacity: 1; } to { transform: scale(3.4); opacity: 0; } }
@keyframes uptext {
  0% { transform: translate(var(--tx), 12px) scale(.3); opacity: 0; }
  22% { transform: translate(var(--tx), -6px) scale(1.3); opacity: 1; }
  40% { transform: translate(var(--tx), -8px) scale(1); }
  80% { opacity: 1; }
  100% { transform: translate(var(--tx), -30px) scale(1); opacity: 0; }
}
@keyframes upspark { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
@keyframes upshake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.schem .core.up-ok { animation: coreok .75s ease-out; }
.schem .core.up-no { animation: coreno .45s linear; box-shadow: 0 0 0 3px rgba(255, 93, 93, .7), 0 0 24px rgba(255, 93, 93, .7); }
@keyframes coreok {
  0% { box-shadow: 0 0 0 0 rgba(122, 240, 193, .95); transform: translate(-50%, -50%) scale(1); }
  30% { transform: translate(-50%, -50%) scale(1.2); }
  100% { box-shadow: 0 0 0 50px rgba(122, 240, 193, 0); transform: translate(-50%, -50%) scale(1); }
}
@keyframes coreno {
  0%, 100% { transform: translate(-50%, -50%); } 20% { transform: translate(calc(-50% - 6px), -50%); } 40% { transform: translate(calc(-50% + 6px), -50%); }

<body>
<div id="app">
  <header id="hud">
    <div class="hp" aria-label="방어선 체력">
      <div class="hp-bar"><i id="hpFill"></i></div>
      <span id="hpTxt">100</span>
    </div>
    <div class="stat"><small>시간</small><b id="tTxt">0:00</b></div>
    <div class="stat"><small>처치</small><b id="kTxt">0</b></div>
    <div class="stat gold"><small>재화</small><b id="gTxt">0</b></div>
    <button id="speedBtn" type="button" aria-label="게임 속도">1배</button>
    <button id="pauseBtn" type="button" aria-label="일시정지">II</button>

  <div id="fieldWrap"><canvas id="field"></canvas></div>
  <div id="weapons"></div>
  <div id="bottom"></div>
  <div id="overlay" hidden></div>
</div>
<script>
/* 도형 방어선: 게임 로직 (화면과 분리되어 있어 단독 실행 가능) */
(function (root) {
'use strict';

const LANES = 5, LW = 100, W = LANES * LW;
let H = 520;
const GRADES = ['일반', '희귀', '영웅', '전설'];
const CFG = {
  invSize: 15,        // 인벤토리 칸 수 (답답하면 여기만 바꾸면 됨)
  shardStack: 1000,   // 강화 조각 한 칸 최대
  maxLv: 100,
  baseHp: 100,
  startGold: 80,
  bossEvery: 60,
  augEvery: 5,
  extraShotMul: 0.6,
  meltPts: [2, 5, 12, 30],   // 용해로: 등급별로 파츠를 녹여 얻는 게이지
  craftCost: 10,             // 제조 1회에 드는 게이지
  craftW: [0, 62, 30, 8],    // 제조한 파츠의 등급 비율 (희귀 이상만)
};

const rnd = Math.random;
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function wpick(ws) {
  let t = 0; for (const w of ws) t += w;
  let r = rnd() * t;
  for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; }
  return ws.length - 1;
}

/* ---------- 밸런스 수치 ---------- */
const BAL = {
  // L강에 도전할 때의 성공률 (1강 100% → 100강 10%, 초반에 더 빨리 감소)
  success(L) {
    if (L <= 1) return 1;
    const x = (L - 1) / 99;
    return 0.10 + 0.90 * Math.pow(1 - x, 1.1);
  },
  lvMul(L) { return Math.pow(1.05, L); },
  hpMul(t) { // 처음 2분은 완만, 15분까지 빠르게, 25분 이후 다시 가속
    let ln;
    if (t <= 120) ln = 0.0025 * t;
    else if (t <= 900) ln = 0.3 + 0.0041 * (t - 120);
    else ln = 3.498 + 0.0033 * (t - 900);
    if (t > 1500) ln += 6e-6 * (t - 1500) * (t - 1500);
    return Math.exp(ln);
  },
  bossMul(n) { return Math.min(1, 0.4 + 0.12 * n); }, // 초반 보스는 약하게
  spawnRate(t) { return Math.min(6, 0.5 + t / 85); },
  // 처음 3분에 걸쳐 서서히 30% 줄어든다 (초반 무기 확보 속도는 유지)
  goldMul(t) { return (1 + t / 80) * (1 - 0.3 * Math.min(1, t / 180)); },
  genCost(n) { return Math.round(10 * Math.pow(1 + 0.2 * n, 1.25)); },
  // 강화 조각 수는 낸 비용을 따라가되 비용보다 느리게 늘어난다 (비용이 10배면 조각은 약 8배)
  bundleExp: 0.9,
  bundle(cost) { return Math.max(3, Math.round((0.75 + rnd() * 0.5) * 4.5 * Math.pow(cost / 10, BAL.bundleExp))); },
};

/* ---------- 무기 ---------- */
const WEAPONS = {
  blaster: { name: '블래스터', dmg: 10, cd: 0.45, range: 0.75, lanes: 0, color: '#6ee7ff',
    desc: '정면 1레인의 가장 가까운 적에게 탄환 발사' },
  shotgun: { name: '산탄포', dmg: 7, cd: 0.8, range: 0.45, lanes: 1, color: '#ffc857',
    desc: '정면과 양옆 3레인에 산탄 발사. 사거리가 짧음' },
  laser: { name: '레이저', dmg: 15, cd: 1.25, range: 0.9, lanes: 0, color: '#ff7ad9',
    desc: '정면 1레인의 모든 적을 한 번에 관통' },
  pulse: { name: '펄스', dmg: 10, cd: 0.9, range: 0, lanes: 0, radius: 150, color: '#7af0c1',
    desc: '무기 주변 원형 범위의 모든 적 타격' },
  mortar: { name: '박격포', dmg: 20, cd: 2.2, range: 1, lanes: 5, blast: 62, color: '#ff9f5a',
    desc: '모든 레인 대상. 방어선에 가장 가까운 적에게 폭발탄' },
  tesla: { name: '전격기', dmg: 8, cd: 0.7, range: 0.55, lanes: 1, chain: 2, color: '#b9a2ff',
    desc: '3레인 안의 가까운 적을 공격하고 주변 2명에게 연쇄' },
};
const WEAPON_IDS = Object.keys(WEAPONS);

/* ---------- 파츠 (어느 무기에나 장착, 수치 보정) ---------- */
const pct = (k) => (s, v) => { s[k] += v / 100; };
const add = (k) => (s, v) => { s[k] += v; };
const mx = (k) => (s, v) => { s[k] = Math.max(s[k], v / 100); };
const PARTS = {
  dmg:   { name: '강화 탄두',   abbr: '공격', min: 0, v: [15, 30, 50, 80],    ap: pct('dmgPct'),   d: v => `공격력 +${v}%` },
  rate:  { name: '가속 장치',   abbr: '속도', min: 0, v: [10, 20, 32, 48],    ap: pct('ratePct'),  d: v => `공격 속도 +${v}%` },
  crit:  { name: '조준경',      abbr: '치확', min: 0, v: [6, 12, 18, 26],     ap: pct('crit'),     d: v => `치명타 확률 +${v}%` },
  critd: { name: '예리한 날',   abbr: '치피', min: 0, v: [30, 60, 100, 150],  ap: pct('critDmg'),  d: v => `치명타 피해 +${v}%` },
  range: { name: '확장 모듈',   abbr: '범위', min: 0, v: [10, 18, 28, 40],    ap: pct('rangePct'), d: v => `사거리와 공격 범위 +${v}%` },
  boss:  { name: '약점 분석기', abbr: '보스', min: 0, v: [20, 40, 65, 100],   ap: pct('bossPct'),  d: v => `보스에게 주는 피해 +${v}%` },
  gold:  { name: '채굴 칩',     abbr: '재화', min: 0, v: [10, 20, 35, 55],    ap: pct('goldPct'),  d: v => `이 무기로 처치 시 재화 +${v}%` },
  exec:  { name: '처형 모듈',   abbr: '처형', min: 0, v: [25, 50, 80, 120],   ap: pct('execPct'),  d: v => `체력 30% 이하인 적에게 피해 +${v}%` },
  first: { name: '선제 타격기', abbr: '선제', min: 0, v: [25, 50, 80, 120],   ap: pct('firstPct'), d: v => `체력 80% 이상인 적에게 피해 +${v}%` },
  heal:  { name: '수리 장치',   abbr: '수리', min: 1, v: [0, 2, 3, 5],        ap: pct('heal'),     d: v => `이 무기로 처치 시 ${v}% 확률로 방어선 체력 1 회복` },
  luck:  { name: '행운 부적',   abbr: '행운', min: 1, v: [0, 3, 6, 10],       ap: pct('luck'),     d: v => `이 무기의 강화 성공률 +${v}%p` },
  save:  { name: '절약 회로',   abbr: '절약', min: 1, v: [0, 12, 22, 35],     ap: pct('save'),     d: v => `강화 시 ${v}% 확률로 조각을 소모하지 않음` },
  dbl:   { name: '이중 장전기', abbr: '연사', min: 2, v: [0, 0, 25, 45],      ap: pct('dbl'),      d: v => `공격 시 ${v}% 확률로 즉시 한 번 더 공격` },
  core:  { name: '코어 증폭기', abbr: '코어', min: 3, v: [0, 0, 0, 60],
    ap: (s) => { s.dmgPct += 0.6; s.ratePct += 0.3; }, d: () => '공격력 +60%, 공격 속도 +30%' },
  // 여러 수치를 함께 바꾸거나 독특한 효과가 있는 파츠
  heavy:  { name: '중화기 개조',     min: 0, v: [35, 60, 90, 130], ap: (s, v) => { s.dmgPct += v / 100; s.ratePct -= 0.15; }, d: v => `공격력 +${v}%, 공격 속도 -15%` },
  light:  { name: '경량 프레임',     min: 0, v: [25, 40, 60, 85],  ap: (s, v) => { s.ratePct += v / 100; s.dmgPct -= 0.10; }, d: v => `공격 속도 +${v}%, 공격력 -10%` },
  sniper: { name: '저격 조준기',     min: 0, v: [30, 55, 85, 130], ap: pct('farPct'), d: v => `전장 위쪽 절반에 있는 적에게 피해 +${v}%` },
  chill:  { name: '냉각수 탱크',     min: 0, v: [8, 12, 18, 25],   ap: mx('slow'),    d: v => `적중한 적을 1.5초간 ${v}% 둔화` },
  glass:  { name: '유리 대포',       min: 1, v: [0, 45, 75, 115],  ap: (s, v) => { s.dmgPct += v / 100; s.rangePct -= 0.15; }, d: v => `공격력 +${v}%, 사거리와 범위 -15%` },
  big:    { name: '대구경 포신',     min: 1, v: [0, 20, 35, 50],   ap: (s, v) => { s.rangePct += v / 100; s.dmgPct += v / 200; }, d: v => `사거리와 범위 +${v}%, 공격력 +${v / 2}%` },
  ember:  { name: '발화 장치',       min: 1, v: [0, 10, 18, 28],   ap: mx('burn'),    d: v => `적중한 적에게 3초간 초당 공격력의 ${v}% 화상 피해` },
  gamble: { name: '도박사의 주사위', min: 1, v: [0, 200, 270, 350], ap: mx('gamble'), d: v => `공격할 때마다 피해가 50%~${v}% 사이에서 무작위로 결정` },
  shield: { name: '방패 발생기',     min: 1, v: [0, 10, 16, 25],   ap: pct('shield'), d: v => `방어선이 받는 피해 -${v}% (여러 개면 합산, 최대 60%)` },
  magnet: { name: '자석 코어',       min: 1, v: [0, 3, 5, 8],      ap: pct('magnet'), d: v => `이 무기로 처치 시 ${v}% 확률로 강화 조각 획득` },
  ramp:   { name: '과열 엔진',       min: 2, v: [0, 0, 40, 70],    ap: mx('ramp'),    d: v => `쉬지 않고 공격하면 공격 속도가 점점 올라 최대 +${v}%` },
};
const PART_IDS = Object.keys(PARTS);

/* ---------- 증강 (무기 고유, 5강마다 3택) ---------- */
const laneText = (n) => n >= 4 ? '모든 레인의 적을 조준' : `조준 범위가 양옆 ${n}레인으로 확대`;
const AUGS = {
  // 공용 수치형
  a_dmg:  { name: '고출력',   abbr: '출력', min: 0, for: 'all', v: [20, 40, 70, 110], ap: pct('dmgPct'),  d: v => `공격력 +${v}%` },
  a_rate: { name: '속사',     abbr: '속사', min: 0, for: 'all', v: [15, 28, 45, 70],  ap: pct('ratePct'), d: v => `공격 속도 +${v}%` },
  a_crit: { name: '정밀 타격', abbr: '정밀', min: 0, for: 'all', v: [8, 15, 24, 35],   ap: pct('crit'),    d: v => `치명타 확률 +${v}%` },
  // 블래스터
  b_pierce: { name: '관통탄', abbr: '관통', min: 0, for: 'blaster', v: [1, 2, 3, 5], ap: add('pierce'), d: v => `탄환이 적 ${v}명을 추가로 관통` },
  b_multi:  { name: '연발',   abbr: '연발', min: 1, for: 'blaster', v: [0, 1, 2, 3], ap: add('shots'),  d: v => `탄환 ${v}발 추가 발사 (추가 탄 피해 60%)` },
  b_boom:   { name: '폭발탄', abbr: '폭발', min: 2, for: 'blaster', v: [0, 0, 40, 75], ap: pct('splash'), d: v => `적중 시 주변 적에게 피해의 ${v}% 폭발` },
  b_seek:   { name: '유도탄', abbr: '유도', min: 0, for: 'blaster', v: [1, 1, 2, 4], ap: add('lanes'),  d: v => laneText(v) },
  b_frost:  { name: '냉각탄', abbr: '냉각', min: 0, for: 'blaster', v: [20, 30, 40, 55], ap: mx('slow'), d: v => `적중한 적을 1.5초간 ${v}% 둔화` },
  // 산탄포
  s_wide:   { name: '광각 산탄', abbr: '광각', min: 2, for: 'shotgun', v: [0, 0, 1, 3], ap: add('lanes'), d: v => v >= 3 ? '모든 레인에 산탄 발사' : '양옆 2레인까지 산탄 발사' },
  s_pellet: { name: '추가 산탄', abbr: '산탄', min: 1, for: 'shotgun', v: [0, 1, 2, 3], ap: add('shots'), d: v => `레인마다 산탄 ${v}발 추가 (추가 탄 피해 60%)` },
  s_knock:  { name: '충격탄',   abbr: '충격', min: 0, for: 'shotgun', v: [8, 13, 19, 28], ap: add('knock'), d: v => `적중한 적을 뒤로 밀어냄 (세기 ${v}, 보스 제외)` },
  s_close:  { name: '근접 사격', abbr: '근접', min: 0, for: 'shotgun', v: [30, 60, 100, 150], ap: pct('closePct'), d: v => `방어선 가까이 온 적에게 피해 +${v}%` },
  s_pierce: { name: '철갑 산탄', abbr: '철갑', min: 1, for: 'shotgun', v: [0, 1, 2, 4], ap: add('pierce'), d: v => `산탄이 적 ${v}명을 추가로 관통` },
  // 레이저
  l_burn:   { name: '잔열',     abbr: '잔열', min: 0, for: 'laser', v: [12, 22, 35, 55], ap: mx('burn'), d: v => `적중한 적에게 3초간 초당 공격력의 ${v}% 화상 피해` },
  l_wide:   { name: '광폭 빔',  abbr: '광폭', min: 2, for: 'laser', v: [0, 0, 50, 85], ap: pct('sideBeam'), d: v => `양옆 레인의 적에게도 ${v}% 피해` },
  l_charge: { name: '과충전',   abbr: '충전', min: 0, for: 'laser', v: [50, 100, 160, 250], ap: pct('third'), d: v => `3번째 발사마다 피해 +${v}%` },
  l_exec:   { name: '소멸 광선', abbr: '소멸', min: 2, for: 'laser', v: [0, 0, 12, 20], ap: mx('instakill'), d: v => `체력이 ${v}% 이하로 떨어진 일반 적을 즉시 처치` },

  p_knock:  { name: '충격파',   abbr: '충격', min: 0, for: 'pulse', v: [10, 16, 24, 34], ap: add('knock'), d: v => `범위 안의 적을 뒤로 밀어냄 (세기 ${v}, 보스 제외)` },
  p_frost:  { name: '빙결장',   abbr: '빙결', min: 0, for: 'pulse', v: [15, 25, 35, 50], ap: mx('slow'), d: v => `범위 안의 적을 1.5초간 ${v}% 둔화` },
  p_echo:   { name: '이중 파동', abbr: '이중', min: 2, for: 'pulse', v: [0, 0, 35, 60], ap: pct('echo'), d: v => `${v}% 확률로 파동이 한 번 더 발생` },
  // 박격포
  m_big:     { name: '대형 포탄', abbr: '대형', min: 0, for: 'mortar', v: [20, 35, 55, 80], ap: pct('areaPct'), d: v => `폭발 범위 +${v}%` },

  m_boss:    { name: '정밀 포격', abbr: '포격', min: 0, for: 'mortar', v: [30, 60, 100, 160], ap: pct('bossPct'), d: v => `보스에게 주는 피해 +${v}%` },
  // 전격기
  t_chain: { name: '연쇄 증폭', abbr: '연쇄', min: 0, for: 'tesla', v: [1, 2, 3, 5], ap: add('chain'), d: v => `연쇄 횟수 +${v}` },
  t_stun:  { name: '감전',     abbr: '감전', min: 0, for: 'tesla', v: [8, 13, 19, 27], ap: mx('stun'), d: v => `적중 시 ${v}% 확률로 0.8초 기절 (보스 제외)` },
  t_grow:  { name: '과부하',   abbr: '과부', min: 2, for: 'tesla', v: [0, 0, 15, 30], ap: mx('chainGrow'), d: v => `연쇄할 때마다 피해가 줄지 않고 ${v}%씩 증가` },

/* ---------- 적 ---------- */
const ENEMIES = {

/* ---------- 상태 ---------- */
let S = null;

function newWeapon(type) {

}

function newGame(h) {
  if (h) H = h;

    v: 1, t: 0, hp: CFG.baseHp, maxHp: CFG.baseHp, gold: CFG.startGold, kills: 0, dealt: 0, bossKills: 0, gen: 0,
    slots: [null, null, null, null, null],
    inv: new Array(CFG.invSize).fill(null),

    spawnAcc: 0, nextBoss: CFG.bossEvery, bossN: 0,

}
function setState(s) { S = s; while (S.inv.length < CFG.invSize) S.inv.push(null); if (!S.snd) S.snd = []; if (!S.beams) S.beams = []; if (!S.melt) S.melt = 0; }

/* ---------- 능력치 계산 ---------- */
function stats(w) {
  if (w._s) return w._s;
  const d = WEAPONS[w.type];
  const s = {
    dmgPct: 0, ratePct: 0, crit: 0.05, critDmg: 0, rangePct: 0, areaPct: 0, bossPct: 0, goldPct: 0,
    execPct: 0, firstPct: 0, heal: 0, luck: 0, save: 0, dbl: 0,
    pierce: 0, shots: 0, splash: 0, slow: 0, burn: 0, knock: 0, stun: 0, lanes: d.lanes,
    chain: d.chain || 0, chainGrow: 0, closePct: 0, third: 0, instakill: 0, cluster: 0, pool: 0, echo: 0, sideBeam: 0,
    farPct: 0, gamble: 0, shield: 0, magnet: 0, ramp: 0, deathBoom: 0,
    rico: 0, split: 0, giant: 0, again: 0, slug: 0, freeze: 0, orbit: 0, hold: 0, orbs: 0, nova: 0,
    shrap: 0, barrage: 0, nuke: 0, multi: 0, storm: 0,
  };
  for (const p of w.parts) if (p) PARTS[p.id].ap(s, PARTS[p.id].v[p.g]);
  for (const a of w.augs) if (a) AUGS[a.id].ap(s, AUGS[a.id].v[a.g]);
  const rg = Math.max(0.4, 1 + s.rangePct);
  s.dmg = d.dmg * BAL.lvMul(w.lv) * Math.max(0.2, 1 + s.dmgPct);
  s.cd = d.cd / Math.max(0.4, 1 + s.ratePct);
  s.range = Math.min(1, d.range * rg);
  s.lanes = Math.min(5, s.lanes);
  s.radius = (d.radius || 0) * (rg + s.areaPct);
  s.blast = (d.blast || 0) * (rg + s.areaPct);
  s.jump = 140 * rg;
  s.crit = Math.min(1, s.crit);
  s.color = d.color;
  s.type = w.type;
  s.w = w;
  Object.defineProperty(w, '_s', { value: s, writable: true, configurable: true, enumerable: false });
  return s;
}
function dirty(w) { if (w) w._s = null; }

/* ---------- 인벤토리 ---------- */
function freeSlot() { return S.inv.indexOf(null); }
function shardCount() { let n = 0; for (const it of S.inv) if (it && it.kind === 's') n += it.n; return n; }
function addShards(n) {
  for (const it of S.inv) {
    if (n <= 0) break;
    if (it && it.kind === 's' && it.n < CFG.shardStack) { const a = Math.min(n, CFG.shardStack - it.n); it.n += a; n -= a; }
  }
  while (n > 0) {
    const i = freeSlot(); if (i < 0) break;
    const a = Math.min(n, CFG.shardStack); S.inv[i] = { kind: 's', n: a }; n -= a;
  }
  return n; // 담지 못한 수량
}
function takeShards(n) {
  const stacks = S.inv.map((it, i) => ({ it, i })).filter(o => o.it && o.it.kind === 's').sort((a, b) => a.it.n - b.it.n);
  for (const o of stacks) {
    if (n <= 0) break;
    const a = Math.min(n, o.it.n); o.it.n -= a; n -= a;
    if (o.it.n <= 0) S.inv[o.i] = null;
  }
}
function addItem(item) {
  if (item.kind === 's') { const before = item.n; return addShards(item.n) < before ? 0 : -1; }
  const i = freeSlot(); if (i < 0) return -1;
  S.inv[i] = item; return i;
}
function weaponCount() {
  let n = 0;
  for (const w of S.slots) if (w) n++;
  for (const it of S.inv) if (it && it.kind === 'w') n++;
  return n;
}
function ownedTypes() {
  const o = {};
  for (const w of S.slots) if (w) o[w.type] = 1;
  for (const it of S.inv) if (it && it.kind === 'w') o[it.type] = 1;
  return o;
}

/* ---------- 생성 ---------- */
function genCost() { return BAL.genCost(S.gen); }
function rollPartGrade(boost) {
  const f = Math.min(1, S.t / 1200);   // 20분에 걸쳐 천천히 좋아진다
  const ws = [80 - 28 * f, 17 + 13 * f, 2.7 + 11.3 * f, 0.3 + 3.7 * f];
  let g = wpick(ws);
  if (boost) g = Math.max(1, g, wpick(ws));
  return g;
}
function newPart(boost) {
  const g = rollPartGrade(boost);
  const ids = PART_IDS.filter(id => PARTS[id].min <= g);
  return { kind: 'p', id: pick(ids), g };
}
function randomWeapon(preferNew) {
  let ids = WEAPON_IDS;
  if (preferNew) { const o = ownedTypes(); const f = ids.filter(id => !o[id]); if (f.length) ids = f; }
  return newWeapon(pick(ids));
}
function generate() {
  if (!S || S.over || S.pendingAug) return { ok: false, reason: 'busy' };
  const c = genCost();
  if (S.gold < c) return { ok: false, reason: 'gold' };
  if (freeSlot() < 0) return { ok: false, reason: 'full' };
  S.gold -= c; S.gen++;
  const nW = weaponCount();
  const pw = S.gen <= 2 ? 1 : nW < 3 ? 0.45 : nW < 5 ? 0.28 : 0.06;
  const r = rnd();
  let item;
  if (r < pw) item = randomWeapon(nW < 4);
  else if (r < pw + (1 - pw) * 0.15) item = newPart(false);
  else item = { kind: 's', n: BAL.bundle(c) };
  const got = item.kind === 's' ? { kind: 's', n: item.n } : item;
  addItem(item);
  return { ok: true, item: got };
}
function bossDrop() {
  const nW = weaponCount();
  if (rnd() < (nW < 5 ? 0.6 : 0.12)) return randomWeapon(true);
  return newPart(true);
}

/* ---------- 장착과 해제 ---------- */
function discard(i) { if (S.inv[i]) { S.inv[i] = null; return true; } return false; }
function moveInv(a, b) { // 인벤토리 안에서 자리 바꾸기. 강화 조각끼리는 합친다
  if (a === b) return false;
  const x = S.inv[a], y = S.inv[b]; if (!x) return false;
  if (y && x.kind === 's' && y.kind === 's') {
    const m = Math.min(x.n, CFG.shardStack - y.n);
    y.n += m; x.n -= m; if (x.n <= 0) S.inv[a] = null;
    return true;
  }
  S.inv[a] = y; S.inv[b] = x; return true;
}
function equipWeapon(invIdx, slot) {
  const it = S.inv[invIdx];
  if (!it || it.kind !== 'w') return false;
  const old = S.slots[slot];
  S.slots[slot] = it; it.cd = 0.2;
  S.inv[invIdx] = old || null;
  return true;
}
function unequipWeapon(slot, idx) {
  const w = S.slots[slot]; if (!w) return false;
  const i = idx != null && S.inv[idx] === null ? idx : freeSlot(); if (i < 0) return false;
  S.inv[i] = w; S.slots[slot] = null; return true;
}
function swapSlots(a, b) {
  const t = S.slots[a]; S.slots[a] = S.slots[b]; S.slots[b] = t;
  for (const w of [S.slots[a], S.slots[b]]) if (w) w.cd = Math.max(w.cd, 0.2);
  return true;
}
function attachPart(invIdx, slot) {
  const it = S.inv[invIdx], w = S.slots[slot];
  if (!it || it.kind !== 'p' || !w) return { ok: false, reason: 'none' };
  const k = w.parts.indexOf(null);
  if (k < 0) return { ok: false, reason: 'full' };
  w.parts[k] = { id: it.id, g: it.g }; S.inv[invIdx] = null; dirty(w);
  return { ok: true };
}
function replacePart(invIdx, slot, k) { // 가득 찬 무기의 파츠 하나와 맞바꾼다. 빠진 파츠는 인벤토리의 그 칸으로 간다
  const it = S.inv[invIdx], w = S.slots[slot];
  if (!it || it.kind !== 'p' || !w || !w.parts[k]) return false;
  const old = w.parts[k];
  w.parts[k] = { id: it.id, g: it.g }; S.inv[invIdx] = { kind: 'p', id: old.id, g: old.g }; dirty(w);
  return true;
}
function putPart(invIdx, slot, k) { // 무기의 k번 파츠 칸에 넣는다. 차 있으면 맞바꾼다
  const it = S.inv[invIdx], w = S.slots[slot];
  if (!it || it.kind !== 'p' || !w) return false;
  if (w.parts[k]) return replacePart(invIdx, slot, k);
  w.parts[k] = { id: it.id, g: it.g }; S.inv[invIdx] = null; dirty(w);
  return true;
}
function meltPart(i) { // 용해로: 파츠를 녹여 게이지를 얻는다
  const it = S.inv[i]; if (!it || it.kind !== 'p') return 0;
  const pts = CFG.meltPts[it.g];
  S.melt = (S.melt || 0) + pts; S.inv[i] = null;
  return pts;
}
function craftPart() { // 용해로: 게이지를 써서 희귀 이상 파츠를 만든다
  if ((S.melt || 0) < CFG.craftCost) return { ok: false, reason: 'gauge' };
  const i = freeSlot(); if (i < 0) return { ok: false, reason: 'full' };
  S.melt -= CFG.craftCost;
  const g = wpick(CFG.craftW);
  const item = { kind: 'p', id: pick(PART_IDS.filter(id => PARTS[id].min <= g)), g };
  S.inv[i] = item;
  return { ok: true, item, i };
}
function detachPart(slot, k) {
  const w = S.slots[slot]; if (!w || !w.parts[k]) return false;
  const i = freeSlot(); if (i < 0) return false;
  S.inv[i] = { kind: 'p', id: w.parts[k].id, g: w.parts[k].g }; w.parts[k] = null; dirty(w);
  return true;
}

/* ---------- 강화와 증강 ---------- */
function upgradeInfo(w) {
  const next = w.lv + 1;
  return { cost: next, rate: Math.min(1, BAL.success(next) + stats(w).luck), have: shardCount(), max: w.lv >= CFG.maxLv };
}
function upgrade(slot) {
  const w = S.slots[slot];
  if (!w || S.over || S.pendingAug) return { ok: false, reason: 'busy' };
  const info = upgradeInfo(w);
  if (info.max) return { ok: false, reason: 'max' };
  if (info.have < info.cost) return { ok: false, reason: 'shards' };
  const st = stats(w);
  const saved = st.save > 0 && rnd() < st.save;
  if (!saved) takeShards(info.cost);
  const success = rnd() < info.rate;
  if (success) {
    w.lv++; dirty(w);
    if (w.lv > S.maxLv) S.maxLv = w.lv;
    if (w.lv % CFG.augEvery === 0) S.pendingAug = { slot, lv: w.lv, options: rollAugs(w) };
  }
  return { ok: true, success, saved, lv: w.lv };
}
function rollAugs(w) {
  const f = w.lv / CFG.maxLv;
  const ws = [72 - 32 * f, 23 + 7 * f, 4.5 + 17.5 * f, 0.5 + 7.5 * f];
  const pool = AUG_POOL[w.type];
  const out = [];
  for (let k = 0; k < 3; k++) {
    let g = wpick(ws), cand = [];
    for (let tries = 0; tries < 4 && !cand.length; tries++) {
      cand = pool.filter(id => AUGS[id].min <= g && !out.some(o => o.id === id) &&
        !w.augs.some(a => a && a.id === id && a.g >= g));
      if (!cand.length) g = Math.min(3, g + 1);
    }
    if (!cand.length) cand = pool.filter(id => !out.some(o => o.id === id));
    const id = pick(cand);
    out.push({ id, g: Math.max(g, AUGS[id].min) });
  }
  return out;
}
// 반환: {ok} 또는 {ok:false, need:'replace'} (칸이 가득 차서 교체할 칸을 골라야 함)
function chooseAug(i, replaceIdx) {
  const pa = S.pendingAug; if (!pa) return { ok: false };
  const w = S.slots[pa.slot], opt = pa.options[i];
  if (!w || !opt) { S.pendingAug = null; return { ok: false }; }
  let k = w.augs.findIndex(a => a && a.id === opt.id);
  if (k < 0) k = w.augs.indexOf(null);
  if (k < 0) {
    if (replaceIdx == null || replaceIdx < 0 || replaceIdx > 2) return { ok: false, need: 'replace' };
    k = replaceIdx;
  }
  w.augs[k] = { id: opt.id, g: opt.g }; dirty(w);
  S.pendingAug = null;
  return { ok: true };
}
function skipAug() { S.pendingAug = null; }

/* ---------- 효과 표시용 ---------- */
function snd(name) { if (S.snd && S.snd.length < 24) S.snd.push(name); }
function fx(o) { if (S.fx.length < 200) { o.t = o.d; S.fx.push(o); } }
// 피해 숫자. c: 0 일반, 1 치명타, 2 지속 피해, 3 강화 조각 획득
function fxNum(x, y, v, c) { if (S.fx.length < 270) S.fx.push({ k: 'num', d: 0.6, t: 0.6, x, y, v, c }); }
function flushNum(e) {
  if (e.nAcc > 0) { fxNum(e.x + (rnd() - 0.5) * e.r, e.y - e.r * 0.5, e.nAcc, e.nCrit ? 1 : 0); e.nAcc = 0; e.nCrit = false; e.nT = S.t; }
}
let boomDepth = 0;

/* ---------- 적 생성 ---------- */
function spawn(type, lane, x, y) {
  const d = ENEMIES[type];
  const m = BAL.hpMul(S.t) * (d.boss ? BAL.bossMul(S.bossN) : 1);
  const cx = (lane + 0.5) * LW;
  const e = {
    type, lane, x: x != null ? x : cx + (d.boss ? 0 : (rnd() - 0.5) * 30), y: y != null ? y : -d.r,
    r: d.r, hp: d.hp * m, maxHp: d.hp * m, speed: d.speed, leak: d.leak, gold: d.gold * BAL.goldMul(S.t),
    boss: !!d.boss, slowT: 0, slowPct: 0, burnT: 0, burnDps: 0, burnSt: null, stunT: 0, dead: false, flash: 0,
  };
  e.x = Math.max(e.r * 0.7, Math.min(W - e.r * 0.7, e.x));
  S.enemies.push(e);
  return e;
}
function spawnWave() {
  const t = S.t;
  const ws = [5, t > 20 ? 2 + Math.min(2, t / 200) : 0, t > 45 ? 1.4 : 0, t > 75 ? 1 + Math.min(3, t / 150) : 0];
  const type = ['basic', 'runner', 'swarm', 'heavy'][wpick(ws)];
  const lane = Math.floor(rnd() * LANES);
  if (type === 'swarm') {
    for (let k = 0; k < 4; k++) spawn('swarm', lane, (lane + 0.5) * LW + (rnd() - 0.5) * 56, -10 - k * 24);
  } else spawn(type, lane);
}
function spawnBoss() {
  const type = S.bossN % 2 === 0 ? 'giant' : 'split';
  const lane = 1 + Math.floor(rnd() * 3);
  spawn(type, lane);
  S.bossN++;
  fx({ k: 'warn', d: 3.2, text: ENEMIES[type].name });
  snd('warn');
}

/* ---------- 피해 처리 ---------- */
function kill(e, st) {
  if (e.dead) return;
  e.dead = true; S.kills++;
  if (st && st.w) st.w.kills = (st.w.kills || 0) + 1;
  S.gold += e.gold * (1 + (st ? st.goldPct : 0));
  if (st && st.heal && S.hp < S.maxHp && rnd() < st.heal) S.hp = Math.min(S.maxHp, S.hp + 1);
  fx({ k: 'pop', d: 0.25, x: e.x, y: e.y, r: e.r, boss: e.boss });
  snd(e.boss ? 'bosskill' : 'kill');
  if (st && st.magnet && rnd() < st.magnet) {
    const n = Math.max(1, Math.round(BAL.bundle(genCost()) * 0.06));
    if (addShards(n) < n) { fxNum(e.x, e.y, n, 3); S.invDirty = true; }
  }
  if (st && st.deathBoom && boomDepth < 5) {
    boomDepth++;
    const R = 70 * (1 + st.areaPct);
    fx({ k: 'boom', d: 0.3, x: e.x, y: e.y, r: R, c: '#ff8a5a' });
    for (let i = 0, n = S.enemies.length; i < n; i++) {
      const o = S.enemies[i];
      if (!o.dead && Math.hypot(o.x - e.x, o.y - e.y) <= R + o.r * 0.5) hit(o, st.dmg * st.deathBoom, st, true);
    }
    boomDepth--;
  }
  if (e.boss) {
    S.bossKills++;
    S.drops.push(bossDrop());
    if (e.type === 'split') for (let k = 0; k < 3; k++) spawn('heavy', e.lane, e.x + (k - 1) * 46, e.y - k * 14);
  }
}
function credit(st, amt, e) {
  const real = Math.max(0, Math.min(amt, e.hp));
  S.dealt = (S.dealt || 0) + real;
  if (st && st.w) st.w.dealt = (st.w.dealt || 0) + real;
}
function dot(e, amt, st) {
  if (e.dead) return;
  credit(st, amt, e); e.hp -= amt;
  e.dAcc = (e.dAcc || 0) + amt;
  if (S.t - (e.dT || -1) >= 0.4 || e.hp <= 0) { fxNum(e.x + (rnd() - 0.5) * e.r, e.y - e.r * 0.2, e.dAcc, 2); e.dAcc = 0; e.dT = S.t; }
  if (e.hp <= 0) kill(e, st);
}
function hit(e, amt, st, noSplash) {
  if (e.dead) return;
  let d = amt, crit = false;
  if (rnd() < st.crit) { d *= 1.5 + st.critDmg; crit = true; }
  if (st.gamble) d *= 0.5 + rnd() * (st.gamble - 0.5);
  if (st.farPct && e.y < H * 0.5) d *= 1 + st.farPct;
  if (e.boss) d *= 1 + st.bossPct;
  const f = e.hp / e.maxHp;
  if (st.execPct && f <= 0.3) d *= 1 + st.execPct;
  if (st.firstPct && f >= 0.8) d *= 1 + st.firstPct;
  if (st.closePct && e.y > H * 0.65) d *= 1 + st.closePct;
  if (st.instakill && !e.boss && (e.hp - d) / e.maxHp <= st.instakill) d = e.hp;
  credit(st, d, e);
  e.hp -= d; e.flash = 0.08;
  if (st.slow) { e.slowT = 1.5; e.slowPct = Math.max(e.slowPct, e.boss ? st.slow * 0.5 : st.slow); }
  if (st.burn) { e.burnT = 3; e.burnDps = Math.max(e.burnDps, amt * st.burn); e.burnSt = st; }
  if (st.knock && !e.boss) e.y = Math.max(-e.r, e.y - st.knock);
  if (st.stun && !e.boss && rnd() < st.stun) e.stunT = Math.max(e.stunT, 0.8);
  if (st.freeze) {
    if (e.boss) { e.slowT = Math.max(e.slowT, 1); e.slowPct = Math.max(e.slowPct, 0.4); }
    else { e.stunT = Math.max(e.stunT, st.freeze); e.ice = true; }
  }
  e.nAcc = (e.nAcc || 0) + d; if (crit) e.nCrit = true;
  if (e.hp <= 0 || S.t - (e.nT || -1) >= 0.2) flushNum(e);
  const ex = e.x, ey = e.y;
  if (e.hp <= 0) kill(e, st);
  if (st.splash && !noSplash) {
    const R = 62 * (1 + st.areaPct);
    fx({ k: 'boom', d: 0.22, x: ex, y: ey, r: R, c: st.color });
    for (let i = 0, n = S.enemies.length; i < n; i++) {
      const o = S.enemies[i];
      if (o !== e && !o.dead && Math.hypot(o.x - ex, o.y - ey) <= R + o.r * 0.5) hit(o, amt * st.splash, st, true);
    }
  }
}
function explode(x, y, R, dmg, st) {
  snd('boom');
  fx({ k: 'boom', d: 0.28, x, y, r: R, c: st.color });
  for (let i = 0, n = S.enemies.length; i < n; i++) {
    const o = S.enemies[i];
    if (!o.dead && Math.hypot(o.x - x, o.y - y) <= R + o.r * 0.5) hit(o, dmg, st, true);
  }
}

/* ---------- 무기 발사 ---------- */
function inReach(e, wx, st) {
  return !e.dead && e.y + e.r > 0 &&
    Math.abs(e.x - wx) <= (st.lanes + 0.5) * LW + e.r * 0.4 &&
    (H - e.y) <= st.range * H + e.r;
}
function nearest(wx, st) {
  let best = null;
  for (const e of S.enemies) if (inReach(e, wx, st) && (!best || e.y > best.y)) best = e;
  return best;
}
function bullet(x, y, ang, dmg, st, dist, o) {
  const sp = (o && o.sp) || 900;
  const b = { x, y, vx: Math.sin(ang) * sp, vy: -Math.cos(ang) * sp, dmg, st, pierce: st.pierce, hit: [], left: dist, c: st.color,
    r: 5, rico: st.rico, split: st.split, kn: 0 };
  if (o) Object.assign(b, o);
  S.bullets.push(b);
  return b;
}
function fire(w, slot, st) {
  const wx = (slot + 0.5) * LW, wy = H - 2;
  switch (w.type) {
    case 'blaster': {
      const t = nearest(wx, st); if (!t) return false;
      const ang = Math.atan2(t.x - wx, wy - t.y);
      const n = 1 + st.shots, dist = st.range * H + 50;
      w.n++;
      if (st.giant && w.n % 5 === 0) {      // 거대탄
        bullet(wx, wy, ang, st.dmg * st.giant, st, H + 120, { pierce: 99, r: 14, rico: 0, split: 0, big: 1 });
        return true;
      }
      for (let i = 0; i < n; i++) {
        const off = i === 0 ? 0 : (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 0.09;
        bullet(wx, wy, ang + off, st.dmg * (i === 0 ? 1 : CFG.extraShotMul), st, dist);
      }
      return true;
    }
    case 'shotgun': {
      if (!nearest(wx, st)) return false;
      const dist = st.range * H + 30, n = 1 + st.shots;
      const one = { lanes: 0, range: st.range };
      for (let j = Math.max(0, slot - st.lanes); j <= Math.min(LANES - 1, slot + st.lanes); j++) {
        const cx = (j + 0.5) * LW;
        const t = nearest(cx, one);
        const tx = t ? t.x : cx, ty = t ? t.y : H - st.range * H * 0.8;
        const ang = Math.atan2(tx - wx, wy - ty);
        for (let i = 0; i < n; i++) bullet(wx, wy, ang + (i === 0 ? 0 : (rnd() - 0.5) * 0.16), st.dmg * (i === 0 ? 1 : CFG.extraShotMul), st, dist);
      }
      if (st.slug) bullet(wx, wy, 0, st.dmg * st.slug, st, H + 120, { pierce: 99, r: 12, kn: 34, big: 1 });
      return true;
    }
    case 'laser': {
      let any = false; const list = [];
      for (const e of S.enemies) if (inReach(e, wx, st)) { list.push(e); any = true; }
      if (!any) return false;
      w.n++;
      const m = st.third && w.n % 3 === 0 ? 1 + st.third : 1;
      for (const e of list) hit(e, st.dmg * m, st);
      fx({ k: 'beam', d: 0.16, x: wx, y0: H - st.range * H, y1: H, w: (st.lanes * 2 + 1) * (m > 1 ? 16 : 9), c: st.color });
      if (st.sideBeam) {
        const wide = { lanes: st.lanes + 1, range: st.range };
        for (const e of S.enemies) if (inReach(e, wx, wide) && list.indexOf(e) < 0) hit(e, st.dmg * m * st.sideBeam, st);
        for (const sx of [wx - (st.lanes + 1) * LW, wx + (st.lanes + 1) * LW]) {
          if (sx > 0 && sx < W) fx({ k: 'beam', d: 0.16, x: sx, y0: H - st.range * H, y1: H, w: 5, c: st.color });
        }
      }
      if (st.orbit) {                        // 궤도 포격: 적이 있는 다른 레인에 빔 낙하
        const lanes = [];
        for (let j = 0; j < LANES; j++) {
          if (Math.abs(j - slot) <= st.lanes) continue;
          const cx = (j + 0.5) * LW;
          if (S.enemies.some(e => !e.dead && e.y + e.r > 0 && Math.abs(e.x - cx) <= LW / 2 + e.r * 0.4)) lanes.push(j);
        }
        if (lanes.length) {
          const cx = (pick(lanes) + 0.5) * LW;
          for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && Math.abs(e.x - cx) <= LW / 2 + e.r * 0.4) hit(e, st.dmg * m * st.orbit, st);
          fx({ k: 'beam', d: 0.3, x: cx, y0: 0, y1: H, w: 16, c: '#ffffff' });
        }
      }
      if (st.hold) S.beams.push({ k: slot, t: 0.6, tick: 0.1, st });
      return true;
    }
    case 'pulse': {
      const R = st.radius; const list = [];
      for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && Math.hypot(e.x - wx, e.y - H) <= R + e.r * 0.5) list.push(e);
      if (!list.length) return false;
      w.n++;
      if (st.nova && w.n % 5 === 0) {        // 초신성
        const R2 = R * 3;
        for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && Math.hypot(e.x - wx, e.y - H) <= R2 + e.r * 0.5) hit(e, st.dmg * st.nova, st);
        fx({ k: 'ring', d: 0.55, x: wx, y: H, r: R2, c: '#ffffff', fat: 1 });
        fx({ k: 'flash', d: 0.18 });
        return true;
      }
      const times = st.echo && rnd() < st.echo ? 2 : 1;
      for (let k = 0; k < times; k++) {
        for (const e of list) hit(e, st.dmg, st);
        fx({ k: 'ring', d: 0.3 + k * 0.12, x: wx, y: H, r: R, c: st.color });
      }
      return true;
    }
    case 'mortar': {
      let t = null;
      for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && (!t || e.y > t.y)) t = e;
      if (!t) return false;
      w.n++;
      const nuke = st.nuke && w.n % 4 === 0;
      const targets = [t];
      if (st.barrage) {
        const rest = S.enemies.filter(e => !e.dead && e !== t && e.y + e.r > 0).sort((a, b) => b.y - a.y);
        for (let k = 0; k < st.barrage; k++) targets.push(rest[k * 2] || rest[k] || t);
      }
      targets.forEach((e, k) => {
        const dur = 0.55 + k * 0.14, off = k && e === t ? (rnd() - 0.5) * 120 : 0;
        S.shells.push({ x0: wx, y0: wy, tx: Math.max(10, Math.min(W - 10, e.x + off)), ty: Math.min(H - 6, e.y + e.speed * H * dur), p: 0, dur, st,
          dmg: st.dmg * (k ? 0.7 : nuke ? st.nuke : 1), nuke: !k && nuke });
      });
      return true;
    }
    case 'tesla': {
      const first = nearest(wx, st); if (!first) return false;
      w.n++;
      const starts = [first];
      if (st.multi) {
        const rest = S.enemies.filter(e => e !== first && inReach(e, wx, st)).sort((a, b) => b.y - a.y);
        for (let k = 0; k < st.multi && k < rest.length; k++) starts.push(rest[k]);
      }
      const done = starts.slice();
      for (const s0 of starts) {
        let cur = s0, dmg = st.dmg, px = wx, py = wy;
        const pts = [[px, py]];
        for (let j = 0; j <= st.chain && cur; j++) {
          pts.push([cur.x, cur.y]);
          hit(cur, dmg, st);
          dmg *= st.chainGrow ? 1 + st.chainGrow : 0.8;
          px = cur.x; py = cur.y;
          let nx = null, bd = st.jump;
          for (const e of S.enemies) {
            if (e.dead || e.y + e.r <= 0 || done.indexOf(e) >= 0) continue;
            const dd = Math.hypot(e.x - px, e.y - py) - e.r * 0.5;
            if (dd <= bd) { bd = dd; nx = e; }
          }
          cur = nx; if (cur) done.push(cur);
        }
        fx({ k: 'bolt', d: 0.14, pts, c: st.color });
      }
      if (st.storm && w.n % 3 === 0) {        // 번개 폭풍
        const pool = S.enemies.filter(e => !e.dead && e.y + e.r > 0);
        for (let k = 0; k < st.storm && pool.length; k++) {
          const e = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
          fx({ k: 'bolt', d: 0.22, pts: [[e.x + (rnd() - 0.5) * 60, 0], [e.x, e.y]], c: '#ffffff' });
          hit(e, st.dmg * 1.5, st);
        }
      }
      return true;
    }
  }
  return false;
}

// 위성 구체의 위치 (화면 표시와 판정이 같은 식을 쓴다)
function orbPos(slot, st, i, t) {
  const a = Math.PI * (0.5 + 0.46 * Math.sin(t * 1.5 + i * 2 * Math.PI / st.orbs));
  const R = st.radius * 0.85;
  return [(slot + 0.5) * LW + R * Math.cos(a), H - R * Math.sin(a)];
}

/* ---------- 한 프레임 진행 ---------- */
function step(dt) {
  if (!S || S.over || S.pendingAug) return;
  S.t += dt;
  if (S.hitFlash > 0) S.hitFlash -= dt;

  // 적 등장
  S.spawnAcc += BAL.spawnRate(S.t) * dt;
  while (S.spawnAcc >= 1) { S.spawnAcc -= 1; spawnWave(); }
  if (S.t >= S.nextBoss) { S.nextBoss += CFG.bossEvery; spawnBoss(); }

  // 무기
  for (let i = 0; i < LANES; i++) {
    const w = S.slots[i]; if (!w) continue;
    w.cd -= dt;
    if (w.ag > 0) {                          // 2연발의 두 번째 발사
      w.ag -= dt;
      if (w.ag <= 0) { w.ag = 0; const st = stats(w); if (fire(w, i, Object.assign({}, st, { dmg: st.dmg * st.again }))) snd(w.type); }
    }
    if (w.cd <= 0) {
      const st = stats(w);
      if (fire(w, i, st)) {
        snd(w.type);
        let cd = st.cd;
        if (st.ramp) { w.rp = Math.min(st.ramp, (w.rp || 0) + 0.03); cd /= 1 + w.rp; }
        if (st.again) w.ag = 0.13;
        w.cd = st.dbl && rnd() < st.dbl ? Math.min(0.1, cd) : cd;
      } else { w.cd = 0.05; if (w.rp) w.rp = Math.max(0, w.rp - 0.02); }
    }
    if (w.type === 'pulse') {                // 위성 구체
      const st = stats(w);
      for (let k = 0; k < st.orbs; k++) {
        const p = orbPos(i, st, k, S.t), dps = st.dmg / st.cd * 0.5;
        for (let j = 0, n = S.enemies.length; j < n; j++) {
          const e = S.enemies[j];
          if (!e.dead && Math.hypot(e.x - p[0], e.y - p[1]) <= 18 + e.r * 0.6) dot(e, dps * dt, st);
        }
      }
    }
  }

  // 지속 빔
  for (const b of S.beams) {
    b.t -= dt; b.tick -= dt;
    if (b.tick <= 0) {
      b.tick += 0.1;
      const wx = (b.k + 0.5) * LW;
      for (let j = 0, n = S.enemies.length; j < n; j++) { const e = S.enemies[j]; if (inReach(e, wx, b.st)) hit(e, b.st.dmg * b.st.hold, b.st); }
    }
  }

  // 탄환
  for (const b of S.bullets) {
    const mvx = b.vx * dt, mvy = b.vy * dt;
    b.x += mvx; b.y += mvy; b.left -= Math.hypot(mvx, mvy);
    if (b.left <= 0 || b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) { b.dead = true; continue; }
    for (let i = 0, n = S.enemies.length; i < n; i++) {
      const e = S.enemies[i];
      if (e.dead || b.hit.indexOf(e) >= 0) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) <= e.r + b.r) {
        b.hit.push(e);
        hit(e, b.dmg, b.st);
        if (b.kn && !e.boss && !e.dead) e.y = Math.max(-e.r, e.y - b.kn);
        if (b.split) {                       // 분열탄
          const base = Math.atan2(b.vx, -b.vy), m = b.split;
          for (let k = 0; k < m; k++) {
            const off = m === 2 ? (k ? 0.5 : -0.5) : (k - 1) * 0.55;
            bullet(b.x, b.y, base + off, b.dmg * 0.5, b.st, 240, { split: 0, rico: 0, pierce: 0, r: 3.5 }).hit.push(e);
          }
          b.split = 0;
        }
        if (b.rico > 0) {                    // 도탄: 가까운 다른 적에게 방향을 바꾼다
          let nx = null, bd = 280;
          for (let j = 0; j < n; j++) {
            const o = S.enemies[j];
            if (o.dead || o.y + o.r <= 0 || b.hit.indexOf(o) >= 0) continue;
            const dd = Math.hypot(o.x - b.x, o.y - b.y);
            if (dd < bd) { bd = dd; nx = o; }
          }
          if (nx) {
            const sp = Math.hypot(b.vx, b.vy), a = Math.atan2(nx.x - b.x, b.y - nx.y);
            b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp;
            b.rico--; b.dmg *= 0.8; b.left = Math.max(b.left, 320);
            break;
          }
        }
        if (b.pierce-- <= 0) { b.dead = true; break; }
      }
    }
  }

  // 포탄
  for (const s of S.shells) {
    s.p += dt / s.dur;
    if (s.p >= 1) {
      s.dead = true;
      const st = s.st, R = st.blast * (s.nuke ? 2.5 : 1);
      explode(s.tx, s.ty, R, s.dmg, st);
      if (s.nuke) { fx({ k: 'flash', d: 0.22 }); fx({ k: 'ring', d: 0.5, x: s.tx, y: s.ty, r: R * 1.15, c: '#ffffff', fat: 1, full: 1 }); }
      for (let k = 0; k < st.shrap; k++) {
        bullet(s.tx, s.ty, k * 2 * Math.PI / st.shrap + rnd() * 0.4, s.dmg * 0.3, st, 170, { sp: 520, pierce: 0, r: 3.5, rico: 0, split: 0 });
      }
      for (let k = 0; k < st.cluster; k++) {
        const a = rnd() * Math.PI * 2, rr = st.blast * (0.6 + rnd() * 0.7);
        explode(s.tx + Math.cos(a) * rr, s.ty + Math.sin(a) * rr, st.blast * 0.6, s.dmg * 0.4, st);
      }
      if (st.pool) S.pools.push({ x: s.tx, y: s.ty, r: R, dps: s.dmg * st.pool, t: 3, st });
    }
  }

  // 화염 지대
  for (const p of S.pools) {
    p.t -= dt;
    for (let i = 0, n = S.enemies.length; i < n; i++) {
      const e = S.enemies[i];
      if (!e.dead && Math.hypot(e.x - p.x, e.y - p.y) <= p.r + e.r * 0.5) dot(e, p.dps * dt, p.st);
    }
  }

  // 적 이동
  for (let i = 0, n = S.enemies.length; i < n; i++) {
    const e = S.enemies[i]; if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.burnT > 0) { e.burnT -= dt; dot(e, e.burnDps * dt, e.burnSt); if (e.dead) continue; if (e.burnT <= 0) e.burnDps = 0; }
    if (e.stunT > 0) { e.stunT -= dt; if (e.stunT <= 0) e.ice = false; continue; }
    let sp = e.speed;
    if (e.slowT > 0) { e.slowT -= dt; sp *= 1 - e.slowPct; if (e.slowT <= 0) e.slowPct = 0; }
    e.y += sp * H * dt;
    if (e.y + e.r * 0.3 >= H) {
      e.dead = true;
      let red = 0;
      for (const w of S.slots) if (w) red += stats(w).shield;
      const dmg = Math.round(e.leak * (1 - Math.min(0.6, red)) * 10) / 10;
      S.hp -= dmg; S.hitFlash = 0.3;
      fx({ k: 'leak', d: 0.5, x: e.x, n: dmg });
      snd('leak');
    }

function dragSource(el) {

  for (let k = 0; k < C.LANES; k++) {
    const w = S.slots[k]; if (!w) continue;
    const x = (k + 0.5) * C.LW;
    ctx.fillStyle = C.WEAPONS[w.type].color; ctx.beginPath();
    ctx.moveTo(x, H - 13); ctx.lineTo(x + 9, H - 3); ctx.lineTo(x - 9, H - 3); ctx.closePath(); ctx.fill();
  }
}

/* ---------- 상태 표시 ---------- */
const hudEl = { hp: $('#hpTxt'), fill: $('#hpFill'), t: $('#tTxt'), k: $('#kTxt'), g: $('#gTxt') };
const hudPrev = {};
function setText(key, v) { if (hudPrev[key] !== v) { hudPrev[key] = v; hudEl[key].textContent = v; } }
function hud() {
  const S = C.S; if (!S) return;
  setText('hp', String(Math.ceil(S.hp)));
  setText('t', fmtTime(S.t)); setText('k', String(S.kills)); setText('g', fmtInt(S.gold));
  const w = Math.max(0, S.hp / S.maxHp * 100).toFixed(0) + '%';
  if (hudPrev.w !== w) { hudPrev.w = w; hudEl.fill.style.width = w; hudEl.fill.classList.toggle('low', S.hp / S.maxHp < 0.3); }
}

/* ---------- 진행 ---------- */
let last = 0, acc = 0, lightAt = 0;
function frame(ts) {
  const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0; last = ts;
  const S = C.S;
  if (mode === 'play' && S && !S.pendingAug && wmodal < 0 && !partSwap) {
    acc += dt * speed; let n = 0;
    while (acc >= 1 / 60 && n < 12) { C.step(1 / 60); acc -= 1 / 60; n++; }
    if (n === 12) acc = 0;
    if (S.snd && S.snd.length) { for (const n of S.snd) Snd.play(n); S.snd.length = 0; }
    if (S.invDirty) { S.invDirty = false; renderBottom(); }
    if (S.newDrop) { S.newDrop = false; say('보스 보상이 인벤토리에 들어왔습니다.'); }
    if (S.over) gameOver();
  }
  if (drag && performance.now() - drag.at > 6000) endDrag(false);   // 신호가 끊긴 끌기 정리
  draw(); hud();
  if (ts - lightAt > 250) { lightAt = ts; lightUpdate(); }
  requestAnimationFrame(frame);
}

function snapshot() {
  const S = C.S;
  if (!S || (mode !== 'play' && mode !== 'pause') || S.over) return {};
  const copy = Object.assign({}, S, {
    bullets: [], shells: [], pools: [], beams: [], fx: [], snd: [], pendingAug: S.pendingAug,
    enemies: S.enemies.map(e => Object.assign({}, e, { burnSt: null, burnT: 0, burnDps: 0 })),
  });
  return { S: JSON.parse(JSON.stringify(copy)) };
}
function start(data) {
  try {
    const s = data && data.S;
    if (s && s.v === 1 && Array.isArray(s.slots) && Array.isArray(s.inv) && !s.over) { C.setState(s); mode = 'pause'; }
  } catch (e) { /* 이어하기 실패 시 새로 시작 */ }
  if (!C.S) C.newGame();
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap); else window.addEventListener('resize', resize);
  renderAll();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(snapshot); } catch (e) { /* 무시 */ } }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

// 점검용
window.__game = { start: startGame, get mode() { return mode; } };
})();

</script>
