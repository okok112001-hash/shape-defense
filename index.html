// 폭발 범위 배수 (T10a), 폭격기 길의 기울기 한도 (매듭 사이 평균. 부드럽게 이어 가장 가파른 곳은 1.5배)
const AIR_CD = 15, AIR_WARN = 0.8, AIR_GAP = 0.12, AIR_DROP = 0.3, AIR_ALT = 120, AIR_R = 1.3, AIR_SLOPE = 0.7;
// 공습 폭격기가 지나는 길 (땅 위 자리, 화면용과 같이 쓴다): 매듭 [x, y] 사이를 부드럽게 잇는다 (매듭에서 기울기 0). 매듭 밖은 끝 매듭 높이
function airTrack(g, x) {
  if (x <= g[0][0]) return g[0][1];
  for (let i = 1; i < g.length; i++) {
    if (x > g[i][0]) continue;
    const a = g[i - 1], b = g[i], u = (x - a[0]) / Math.max(1e-6, b[0] - a[0]);
    return a[1] + (b[1] - a[1]) * u * u * (3 - 2 * u);
  }
  return g[g.length - 1][1];
}
// 공습 (T10a): 레인마다 그 레인에서 기지에 가장 가까운 적. 빈 레인 몫은 이미 고른 표적의 폭발 범위 밖에서 기지에 가장 가까운 적 (적 하나에 한 발, 모자라면 덜 떨어뜨린다).
// 폭격기는 표적들 위를 왼쪽에서 오른쪽으로 부드럽게 휘어 지나가며, 표적 위를 지날 때 떨어뜨린다 (폭탄은 폭격기 아래에서 표적까지 떨어진다)
function airStrike(st) {
  const live = [], near = [], pick = [], R = st.blast * AIR_R;
  for (const e of S.enemies) if (!e.dead && e.y + e.r > 0) live.push(e);
  if (!live.length) return false;
  for (const e of live) { const l = Math.max(0, Math.min(LANES - 1, Math.floor(e.x / LW))); if (!near[l] || e.y > near[l].y) near[l] = e; }
  for (let l = 0; l < LANES; l++) if (near[l]) pick.push(near[l]);
  if (pick.length < LANES) {
    live.sort(byNear);
    for (const e of live) {
      if (pick.length >= LANES) break;
      if (pick.indexOf(e) < 0 && pick.every((p) => Math.hypot(e.x - p.x, e.y - p.y) > R)) pick.push(e);
    }
  }
  const tg = pick.map((e) => {                  // 떨어질 때의 자리를 앞질러 본다. 자리를 조금씩 흐트러뜨린다 (기계적으로 맞춰 터지지 않게)
    const x = Math.max(8, Math.min(W - 8, e.x + (rnd() - 0.5) * 10)), tt = AIR_WARN + AIR_GAP * (x / LW - 0.5) + AIR_DROP;
    return { x, y: Math.max(20, Math.min(H - 6, e.y + e.speed * H * tt + (rnd() - 0.5) * 10)) };
  }).sort((a, b) => a.x - b.x);
  const g = [];                                 // 폭격기 길의 매듭: 같은 레인쯤의 표적은 한 매듭으로 (평균 높이, 가장 위 표적보다 40 이상은 위로 떨어지게)
  for (const t of tg) {
    const k = g[g.length - 1];
    if (k && t.x - k[0] < LW * 0.5) { k[3]++; k[0] += (t.x - k[0]) / k[3]; k[1] += (t.y - k[1]) / k[3]; k[2] = Math.min(k[2], t.y); }
    else g.push([t.x, t.y, t.y, 1]);
  }
  for (const k of g) k[1] = Math.min(k[1], k[2] + AIR_ALT - 40);
  for (let i = 1; i < g.length; i++) g[i][1] = Math.min(g[i][1], g[i - 1][1] + AIR_SLOPE * (g[i][0] - g[i - 1][0]));   // 기울기 한도: 높은 쪽(아래)을 끌어올리기만 한다
  for (let i = g.length - 2; i >= 0; i--) g[i][1] = Math.min(g[i][1], g[i + 1][1] + AIR_SLOPE * (g[i + 1][0] - g[i][0]));
  const knots = g.map((k) => [k[0], k[1]]), pts = [];
  let end = 0;
  for (const t of tg) {
    const gy = airTrack(knots, t.x), fall = t.y - gy + AIR_ALT, dur = AIR_DROP * Math.sqrt(Math.max(40, fall) / AIR_ALT);
    const wt = AIR_WARN + AIR_GAP * (t.x / LW - 0.5) + rnd() * 0.02;
    S.shells.push({ drop: 1, air: 1, x0: t.x, y0: gy - AIR_ALT, tx: t.x, ty: t.y, p: 0, dur, wt, st, dmg: st.dmg * st.air, R });
    pts.push([t.x, t.y, wt + dur]); end = Math.max(end, wt + dur);
  }
  fx({ k: 'airwarn', d: Math.max(AIR_WARN + 0.9, end + 0.15), g: knots, pt: pts, w: AIR_WARN, c: st.color });   // 예고 (폭격기가 지날 길과 표적 표시)와 폭격기
  snd('air');
  return true;
}
// 스킬이 있는 진화 무기가 매 스텝 하는 일
function skillStep(w, i, st, dt) {
  const wx = (i + 0.5) * LW;
  switch (w.type) {
    case 'blaster': {                        // 보조 포탑: 자기 간격으로 옆 레인을 쏜다
      if (!st.tur) break;
      const n = st.turTwin ? 2 : 1, tcd = st.cd / (1 + st.turRate), one = oneLane(st);
      for (let k = 0; k < n; k++) {
        const key = k ? 't2' : 't1';
        w[key] = (w[key] == null ? 0.2 : w[key]) - dt;
        if (w[key] > 0) continue;
        const tp = turretPos(i, k), t = nearest((tp[2] + 0.5) * LW, one);
        if (!t) { w[key] = 0.05; continue; }
        w[key] = tcd;
        const ang = Math.atan2(t.x - tp[0], tp[1] - t.y);
        w[k ? 'g2' : 'g1'] = ang; w[k ? 'f2' : 'f1'] = S.t;
        bullet(tp[0], tp[1], ang, st.dmg * st.turD, st, st.range * H + 50, { pierce: 0, rico: 0, split: 0, r: 4, sm: 1, tb: st.turTwin, sp: 1000 });
      }
      break;
    }
    case 'shotgun': {                        // 지뢰 설치
      if (!st.mine) break;
      w.mt = (w.mt == null ? 1 : w.mt) - dt;
      if (w.mt > 0) break;
      let cnt = 0; for (const m of S.mines) if (m.wk === w && !m.mini) cnt++;
      if (cnt >= st.mineMax) { w.mt = 0.25; break; }
      w.mt = Math.max(0.5, st.mineCd);
      const j = Math.max(0, Math.min(LANES - 1, i - st.lanes + Math.floor(rnd() * (2 * st.lanes + 1))));
      const x = (j + 0.5) * LW + (rnd() - 0.5) * 50, y = H - st.range * H * (0.3 + 0.6 * rnd());
      S.mines.push({ x, y, t: 12, tr: 16, R: 60 * (1 + st.areaPct), dmg: st.dmg * st.mine, st, wk: w, mini: 0, ph: rnd() * 6 });
      fx({ k: 'boom', d: 0.15, x, y, r: 16, c: st.color, mset: 1 });   // mset: 설치 순간 (화면은 지뢰가 날아와 내려앉는 모습으로 그린다)
      break;
    }
    case 'laser': {                          // 상시 빔: 0.1초마다 피해, 5번에 한 번만 적중 효과
      if (!st.always) break;
      w.bt = (w.bt == null ? 0.1 : w.bt) - dt;
      if (w.bt > 1e-9) break;
      w.bt += 0.1; w.bk = (w.bk || 0) + 1;
      const full = w.bk % 5 === 0, mul = st.dmg * st.alwaysM * 0.1 / st.cd, lf = st.lens ? nearest(wx, st) : null, list = [];
      for (let j = 0, n = S.enemies.length; j < n; j++) { const e = S.enemies[j]; if (inReach(e, wx, st)) list.push(e); }
      capPick(list, st.cap);
      for (const e of list) hit(e, mul * (st.focus ? 1 + st.focus * focusN(e, w) : 1) * (e === lf ? 1 + st.lens : 1), st, !full, false, !full);
      break;
    }
    case 'acid': {                           // 산성비: RAIN_CD 초마다 적이 가장 많은 레인 (폭우: 둘)
      if (!st.rain) break;
      w.rn = (w.rn == null ? 2 : w.rn) - dt;
      if (w.rn > 0) break;
      const cnt = [0, 0, 0, 0, 0]; let any = 0;
      for (const e of S.enemies) if (!e.dead && e.y + e.r > 0) { cnt[Math.max(0, Math.min(LANES - 1, Math.floor(e.x / LW)))]++; any = 1; }
      if (!any) { w.rn = 0.5; break; }
      w.rn = RAIN_CD;
      const order = [0, 1, 2, 3, 4].sort((a, b) => cnt[b] - cnt[a] || a - b);
      for (let k = 0; k < (st.rain2 ? 2 : 1); k++) {
        S.pools.push({ kind: 'rain', wk: w, lane: order[k], x: (order[k] + 0.5) * LW, t: st.rainT, d: st.rainT, dps: st.dmg * st.rain, st, c: st.color, cv: CORR_K + st.aVuln, sd: rnd() });
        if (st.rain2) puddles(order[k], st);   // 폭우: 비가 오는 동안 고이는 웅덩이
      }
      snd('rain');
      break;
    }
    case 'tesla': {                          // 먹구름: 1초마다 무작위 적 1명에게 낙뢰
      if (!st.cloud) break;
      w.cl = (w.cl == null ? 1 : w.cl) - dt;
      if (w.cl > 0) break;
      const pool = S.enemies.filter(e => !e.dead && e.y + e.r > 0);
      if (!pool.length) { w.cl = 0.25; break; }
      w.cl = 1;
      strike(w, pool[Math.floor(rnd() * pool.length)], st.dmg * st.cloud, st, cloudPos(i, S.t));
      break;
    }
    case 'mortar': {                         // 공습: 10초마다 레인마다 기지에 가장 가까운 적에게 (빈 레인 몫은 다른 적에게)
      if (!st.air) break;
      w.at = (w.at == null ? 3 : w.at) - dt;
      if (w.at > 0) break;
      w.at = airStrike(st) ? AIR_CD : 0.25;
      break;
    }
    case 'pulse': {
      if (w.nv > 0) { w.nv -= dt; if (w.nv <= 0) { w.nv = 0; novaBlast(i, st, 0.7 * st.twinStar, false); } }   // 쌍성: 곧바로 한 번 더
      if (w.ct > 0) w.ct -= dt;
      if (st.fld) {                          // 역장: 항상 켜져 있다. 안의 적을 옆으로 끌어 무기 앞(가운데)에 모으고 (아래로는 끌지 않는다) 압착 피해를 준다
        const R = st.radius * FLD_R, pull = st.fld * dt, list = FLD; list.length = 0;
        for (let j = 0, n = S.enemies.length; j < n; j++) {
          const e = S.enemies[j];
          if (e.dead || e.y + e.r <= 0 || !within(e.x - wx, e.y - H, R + e.r * 0.5)) continue;
          const dx = wx - e.x, mv = e.cr || ghW(st) ? 0 : Math.min(Math.abs(dx), e.boss ? pull * 0.5 : pull);   // 보급 상자는 끌려가지 않는다 (망령 블록과 이어진 무기는 끌지 않는다)
          if (mv > 0) { e.x += dx > 0 ? mv : -mv; e.pullT = S.t; e.pullD = dx > 0 ? 1 : -1; }   // pullT, pullD: 화면용 (끌려가는 방향)
          if (st.fldVuln && !ghW(st)) { e.vulnPct = Math.max(e.vulnT > 0 ? e.vulnPct || 0 : 0, st.fldVuln); e.vulnT = Math.max(e.vulnT, 0.3); }
          list.push(e);
        }
        if (st.fldDps && list.length) {      // 압착: 최대 타격 수까지 (기지에 가까운 적부터)
          capPick(list, st.cap);
          const a = st.dmg * st.fldDps * dt;
          for (const e of list) { dot(e, a, st); e.crT = S.t; }   // crT: 화면용 (짓눌리는 빛)
        }
        list.length = 0;
      }
      if (st.orbs) {                         // 위성 구체
        const cr = 18 * st.orbSize, dps = st.dmg * st.orbDps;
        let top = 1e9;
        for (let k = 0; k < st.orbs; k++) { orbPos(i, st, k, S.t, ORBP[k]); if (ORBP[k][1] < top) top = ORBP[k][1]; }
        top -= cr + 8;                       // 이보다 위에 있는 적은 구체와 줄에 닿을 수 없다
        const chain = st.orbChain && st.orbs > 1, segs = st.orbs === 2 ? 1 : st.orbs, cdps = dps * st.orbChainD;
        for (let j = 0, n = S.enemies.length; j < n; j++) {
          const e = S.enemies[j];
          if (e.dead || e.y + e.r * 0.6 < top) continue;
          for (let k = 0; k < st.orbs; k++) { const p = ORBP[k]; if (within(e.x - p[0], e.y - p[1], cr + e.r * 0.6)) dot(e, dps * dt, st); }
          if (!chain || e.dead) continue;
          for (let q = 0; q < segs; q++) {   // 전기 사슬: 구체 사이의 줄에 닿는 적
            const a = ORBP[q], b = ORBP[(q + 1) % st.orbs];
            if (segDist(e.x, e.y, a[0], a[1], b[0], b[1]) > e.r * 0.6 + 6) continue;
            dot(e, cdps * dt, st);
            if (!e.dead && !e.boss && !ghW(st) && S.t - (e.chT == null ? -9 : e.chT) >= 2) { e.stunT = Math.max(e.stunT, 0.3); e.chT = S.t; }
          }
        }
      }
      break;
    }
  }
}
// 오래 남는 효과 (불길, 용융선, 잔광)
// 한 틱에 피해를 주는 적은 그 무기의 최대 타격 수까지 (기지에 가까운 적부터). CAND: 매 스텝 쓰는 후보 목록 (새로 만들지 않는다)
const CAND = [], FLD = [];   // FLD: 역장 안의 적 (매 스텝 다시 쓴다)
function poolTick(p, dt) {
  const st = p.st, melt = p.kind === 'melt', list = CAND; list.length = 0;
  for (let i = 0, n = S.enemies.length; i < n; i++) {
    const e = S.enemies[i];
    if (e.dead || e.y + e.r <= 0) continue;
    if (melt ? !(Math.abs(e.x - p.x) > 8 + e.r * 0.8 || e.y + e.r < p.y) : within(e.x - p.x, e.y - p.y, p.r + e.r * 0.5)) list.push(e);
  }
  capPick(list, p.big ? st.capBig : st.cap);   // big: 잔광 (초신성 범위, T10c)
  for (let i = 0, n = list.length; i < n; i++) {
    const e = list[i]; if (e.dead) continue;
    dot(e, p.dps * dt, st, melt);
    if (melt && p.slow && !e.dead && !ghW(st)) { e.slowT = Math.max(e.slowT, 0.25); e.slowPct = Math.max(e.slowPct, e.boss ? p.slow * 0.5 : p.slow); }
  }
}
// 연쇄 지뢰: 밀어내고 작은 지뢰가 흩어진다
function mineBlast(m) {
  m.dead = true;
  const st = m.st;
  const n0 = S.fx.length;
  explode(m.x, m.y, m.R, m.dmg, st);
  if (S.fx[n0] && S.fx[n0].k === 'boom') S.fx[n0].mine = m.mini ? 2 : 1;   // 화면용 표시: 지뢰 폭발
  if (!st.mineChain) return;
  if (!ghW(st)) for (let i = 0, n = S.enemies.length; i < n; i++) { const o = S.enemies[i]; if (!o.dead && !o.boss && within(o.x - m.x, o.y - m.y, m.R + o.r * 0.5)) o.y = Math.max(-o.r, o.y - 20); }
  if (m.mini || S.mines.length >= 60) return;
  for (let k = 0; k < 2; k++) {
    const a = (k + rnd() * 0.8) * Math.PI, d = 40 + rnd() * 30;
    S.mines.push({ x: Math.max(12, Math.min(W - 12, m.x + Math.cos(a) * d)), y: Math.max(20, Math.min(H - 12, m.y + Math.sin(a) * d)), t: 12, tr: 12, R: 40, dmg: m.dmg * 0.4 * st.mineChain, st, wk: m.wk, mini: 1, ph: rnd() * 6, ox: m.x, oy: m.y });
  }
}

/* ---------- 보스 능력 ---------- */
function note(text) { if (S.notes.length < 6) S.notes.push(text); }
function boardOn() { return S.m3 && S.prep && S.prep.phase === 'wave' ? S.m3 : null; }   // 웨이브 중인 연결 판 (판에 거는 보스 능력용)
function bossStep(dt) {
  const alive = {};
  for (let i = 0, n = S.enemies.length; i < n; i++) {
    const e = S.enemies[i];
    if (!e.boss || e.dead || e.cr) continue;
    alive[e.type] = e;
    if (e.gd) { goldBlk(e, dt); continue; }   // 황금 적: 나오자마자 황금 블록 시계가 돈다
    if (e.y <= 0) continue;                  // 화면에 들어온 뒤에만 능력을 쓴다
    switch (e.type) {
      case 'summon':
        e.abT = (e.abT == null ? AB_FIRST : e.abT) - dt;
        if (e.abT <= 0) {
          e.abT += 4;
          if (S.enemies.length < 150) for (let k = 0; k < 3; k++) spawn('swarm', e.lane, e.x + (k - 1) * 26 + (rndS() - 0.5) * 10, e.y - e.r * 0.4 - k * 6);
          fx({ k: 'ring', d: 0.4, x: e.x, y: e.y, r: e.r * 1.5, c: '#ff5fd0', full: 1 });
        }
        break;
      case 'jammer': {
        if (S.m3) { const b = boardOn(); if (b) boardAb(e, dt, b, 'sl', SEAL, 'hitlock'); break; }   // 연결 판: 봉쇄 블록
        e.abT = (e.abT == null ? AB_FIRST : e.abT) - dt;
        if (e.abT <= 0) {
          e.abT += 7;
          const c = []; for (let k = 0; k < LANES; k++) if (S.slots[k] && !S.locks[k]) c.push(k);
          if (c.length) { S.locks[pick(c, rndS)] = { w: AB_WARN, l: 0 }; S.slotDirty = true; snd('alert'); }
        }
        break;
      }
      case 'jumble': {                       // 교란체: 판의 줄 JUMBLE.rows 개를 예고한다 (판이 없으면 능력이 없다)
        const b = boardOn(); if (!b) break;
        e.abT = (e.abT == null ? JUMBLE.first : e.abT) - dt;
        if (e.abT <= 0) {
          e.abT += JUMBLE.every;
          if (!b.jw) {
            const rs = []; for (let r = 0; r < b.R; r++) rs.push(r);
            const rows = []; while (rows.length < Math.min(JUMBLE.rows, b.R)) rows.push(rs.splice(Math.floor(rndS() * rs.length), 1)[0]);
            b.jw = { rows: rows.sort((x, y) => x - y), t: AB_WARN }; snd('alert');
          }
        }
        break;
      }
      case 'stone': {                        // 석화체: 판의 칸 STONE.n 개를 예고한다 (이미 굳었거나 예고된 칸은 빼고)
        const b = boardOn(); if (!b) break;
        e.abT = (e.abT == null ? STONE.first : e.abT) - dt;
        if (e.abT <= 0) {
          e.abT += STONE.every;
          const w = b.sw || (b.sw = []), c = [];
          for (let i = b.C; i < b.g.length; i++) if (b.g[i] && !b.g[i].st && !w.some(q => q.i === i)) c.push(i);   // 무기 바로 아래 칸(0행)은 빼고
          for (let k = 0; k < STONE.n && c.length; k++) w.push({ i: c.splice(Math.floor(rndS() * c.length), 1)[0], t: AB_WARN });
          if (w.length) snd('alert');
        }
        break;
      }
      case 'ghost': {                        // 망령체: 판의 블록 하나를 망령 블록으로 (판이 없으면 능력이 없다)
        const b = boardOn(); if (b) boardAb(e, dt, b, 'gh', GHOST, 'hitghost');
        break;
      }
      case 'scale':                          // 4초마다 단단함(피해 x0.5, 속도 x0.6) <-> 연약함(피해 x1.5, 속도 x1.3)
        e.sc.t -= dt;
        if (e.sc.t <= 0) {
          e.sc.t += SCALE_T; e.sc.heavy = !e.sc.heavy;
          e.dmgMul = e.sc.heavy ? 0.5 : 1.5; e.spdMul = e.sc.heavy ? 0.6 : 1.3;
          fx({ k: 'ring', d: 0.5, x: e.x, y: e.y, r: e.r * 1.7, c: e.sc.heavy ? '#8d99b3' : '#fff2c4', full: 1 });
          snd('alert');
        }
        break;
      case 'charge': {                       // 돌격체: 걷다가 멈춰 다른 레인을 예고하고, 그 레인으로 옮겨 가며 빠르게 돌진
        const c = e.ch || (e.ch = { ph: 0, t: CHG_FIRST, to: e.lane });
        c.t -= dt;
        if (c.ph === 0 && c.t <= 0) {
          const ls = []; for (let k = 0; k < LANES; k++) if (k !== e.lane) ls.push(k);
          c.to = pick(ls, rndS); c.ph = 1; c.t = CHG_WARN; e.spdMul = 0; snd('alert');
        } else if (c.ph === 1 && c.t <= 0) { c.ph = 2; c.t = CHG_DASH; e.lane = c.to; e.spdMul = CHG_SPD; snd('dash'); }
        else if (c.ph === 2) {
          const tx = (c.to + 0.5) * LW, dx = tx - e.x, mv = CHG_SIDE * dt;
          e.x = Math.abs(dx) <= mv ? tx : e.x + Math.sign(dx) * mv;
          if (c.t <= 0) { c.ph = 0; c.t = CHG_WAIT; e.spdMul = 1; e.x = tx; }
        }
        break;
      }
      case 'corrode':
        if (S.m3) { const b = boardOn(); if (b) boardAb(e, dt, b, 'ru', RUST, 'hitcorr'); break; }   // 연결 판: 부식 블록
        e.abT = (e.abT == null ? AB_FIRST : e.abT) - dt;
        if (e.abT <= 0) {
          e.abT += 12;
          if (!S.corr) {
            let c = []; for (let k = 0; k < LANES; k++) if (S.slots[k] && effLv(S.slots[k]) > 0) c.push(k);
            if (!c.length) for (let k = 0; k < LANES; k++) if (S.slots[k]) c.push(k);
            if (c.length) { S.corr = { k: pick(c, rndS), t: AB_WARN }; S.slotDirty = true; snd('alert'); }
          }
        }
        break;
    }
  }
  // 봉쇄: 경고 3초, 잠금 5초. 봉쇄체가 없으면 모두 풀린다
  if (!alive.jammer) { if (Object.keys(S.locks).length) { S.locks = {}; S.slotDirty = true; } }
  else for (const k of Object.keys(S.locks)) {
    const lk = S.locks[k];
    if (lk.w > 0) { lk.w -= dt; if (lk.w <= 0) { lk.w = 0; lk.l = 5; S.slotDirty = true; abfx('lock', +k); snd('hitlock'); } }
    else { lk.l -= dt; if (lk.l <= 0) { delete S.locks[k]; S.slotDirty = true; } }
  }
  const b = S.m3;
  // 교란: 예고한 줄의 블록을 모두 새 블록으로 (굳은 칸은 그대로). 교란체가 없어지면 예고도 사라진다
  if (b && b.jw) {
    if (!alive.jumble) b.jw = null;
    else if ((b.jw.t -= dt) <= 0) {
      const old = [];
      for (const r of b.jw.rows) for (let c = 0; c < b.C; c++) {
        const i = r * b.C + c, o = b.g[i]; if (!o || o.st) continue;
        old.push({ i, s: o.s, id: o.id }); b.g[i] = { s: m3Rand(b), id: ++b.id, jz: 1 };
      }
      b.ev.push({ k: 'jumble', rows: b.jw.rows, old }); b.jw = null; snd('hitjumble');
    }
  }
  // 석화: 예고한 칸에 그때 있는 블록이 굳는다. 석화체가 없어지면 남은 예고는 사라진다 (이미 굳은 칸은 웨이브 끝까지)
  if (b && b.sw) {
    if (!alive.stone) b.sw = null;
    else {
      let hit = false;
      for (const w of b.sw) if ((w.t -= dt) <= 0) { const o = b.g[w.i]; if (o && !o.st) { o.st = 1; b.ev.push({ k: 'stone', i: w.i }); hit = true; } }
      b.sw = b.sw.filter(w => w.t > 0); if (!b.sw.length) b.sw = null;
      if (hit) snd('hitstone');
    }
  }
  // 부식·봉쇄·망령 블록: 시간이 다 되거나, 굳거나, 그 보스가 없어지면 사라진다
  if (b) for (const [k, boss, end] of [['ru', 'corrode', 'rustEnd'], ['sl', 'jammer', 'sealEnd'], ['gh', 'ghost', 'ghostEnd']]) {
    const i = blkAt(b, k);
    if (i >= 0) { const o = b.g[i]; if (!alive[boss] || o.st || (o[k] -= dt) <= 0) { delete o[k]; b.ev.push({ k: end, i }); } }
  }
  // 부식: 예고한 칸의 무기 강화 단계를 5 낮춘다. 0 아래로 내려가면 무기가 파괴된다 (판이 없는 예전 방식)
  if (S.corr) {
    if (!alive.corrode) { S.corr = null; S.slotDirty = true; }
    else {
      S.corr.t -= dt;
      if (S.corr.t <= 0) {
        const w = S.slots[S.corr.k];
        abfx('corr', S.corr.k);
        if (w && w.evo) {                    // 진화한 무기: 단계만 낮아지고, 0 아래면 진화가 풀린다 (무기는 사라지지 않는다)
          const k0 = S.corr.k;
          if (!evoLose(w, 5, k0).devo)       // 진화가 풀린 경우의 알림은 evq가 맡는다
            note('<b>부식체</b>가 <b>' + WEAPONS[w.type].name + '</b>의 강화 단계를 낮췄습니다. (★+' + w.lv + ')');
          snd('hitcorr');
        } else if (w) {
          if (w.lv - 5 < 0) {
            S.slots[S.corr.k] = null;
            note('부식: ' + WEAPONS[w.type].name + ' 파괴됨');
          } else {
            w.hi = Math.max(w.hi || 0, w.lv);   // 이미 받은 증강은 다시 받지 못하게 기록
            w.lv -= 5; dirty(w);
            note('<b>부식체</b>가 <b>' + WEAPONS[w.type].name + '</b>의 강화 단계를 낮췄습니다. (+' + w.lv + ')');
          }
          snd('hitcorr');
        }
        S.corr = null; S.slotDirty = true;
      }
    }
  }
}

/* ---------- 한 프레임 진행 ---------- */
function step(dt) {
  if (!S || S.over || S.pendingAug || S.pendingPact) return;
  S.t += dt;
  if (S.hitFlash > 0) S.hitFlash -= dt;

  // 적 등장
  if (CFG.waves) waveStep(dt);
  else {                                     // 예전 연속 등장 (밸런스 도구)
    S.spawnAcc += BAL.spawnRate(S.t) * dt;
    while (S.spawnAcc >= 1) { S.spawnAcc -= 1; spawnWave(); }
    if (S.t >= S.nextBoss) { S.nextBoss += bossInterval(); spawnBoss(); }
  }
  if (S.pendingBoss && (S.pendingBoss.t -= dt) <= 0) appearBoss();
  crateStep(dt);

  bossStep(dt);

  // 무기
  const pl = S.pipe && S.m3 ? pipeLinks() : null;   // 연결: 칸마다 연결 수
  const ri = pl ? rustAt(S.m3) : -1, si = pl ? sealAt(S.m3) : -1, gi = pl ? ghostAt(S.m3) : -1;   // 부식 블록, 봉쇄 블록, 망령 블록이 있는 판 칸
  for (let i = 0; i < LANES; i++) {
    const w = S.slots[i]; if (!w) continue;
    w.au = pl ? pl[i][2] : 0;                                // 이어진 황금 블록 수 (황금체에게 주는 피해)
    const rz = ri >= 0 && pl[i][1].indexOf(ri) >= 0 ? 1 : 0;  // 부식 블록과 이어져 있으면 강화 단계를 0으로 친다
    if ((w.rz || 0) !== rz) { w.rz = rz; dirty(w); S.slotDirty = true; }
    const sz = si >= 0 && pl[i][1].indexOf(si) >= 0 ? 1 : 0;  // 봉쇄 블록과 이어져 있으면 쏘지 않는다
    if ((w.sz || 0) !== sz) { w.sz = sz; S.slotDirty = true; }
    const gz = gi >= 0 && pl[i][1].indexOf(gi) >= 0 ? 1 : 0;  // 망령 블록과 이어져 있으면 공격이 피해 대신 회복 (탄 색이 바뀌므로 능력치 사본을 버린다)
    if ((w.gz || 0) !== gz) { w.gz = gz; dirty(w); S.slotDirty = true; }
    if (sz) continue;
    const lk = S.locks[i]; if (lk && lk.l > 0) continue;     // 봉쇄된 칸은 발사하지 않는다
    if (pl && pl[i][0] < PIPE.need) continue;               // 연결: 하나도 이어지지 않은 무기는 쏘지 않는다
    w.cd -= pl ? dt * pipeRate(pl[i][0]) : dt;
    if (w.rl && w.cd <= 0) { w.rl = 0; w.rlE = S.t; snd('rack'); }   // 난사: 재장전 끝 (철컥)
    if (w.ag > 0) {                          // 2연발의 두 번째 발사
      w.ag -= dt;
      if (w.ag <= 0) { w.ag = 0; const st = stats(w); if (fire(w, i, Object.assign({}, st, { dmg: st.dmg * st.again }))) snd(st.spray ? 'spray' : w.type); }
    }
    if (w.bq > 0) {                          // 점사: 같은 표적에게 BURST_GAP 초 간격으로 더 쏜다
      w.bT -= dt;
      if (w.bT <= 1e-9) { w.bT += BURST_GAP; w.bq--; burstShot(w, i, stats(w)); }
    }
    if (w.aimT > 0) {                        // 저격포 조준 중: 표적을 따라가다 시간이 되면 발사
      w.aimT -= dt;
      const f = w.aimFx, a = w.aim;
      if (f && a && !a.dead) { f.x1 = a.x; f.y1 = a.y; }
      if (w.aimT <= 0) { w.aimT = 0; railShoot(w, i, stats(w)); }
    }
    if (w.cd <= 0 && !(w.bq > 0)) {          // 점사가 끝나기 전에는 다음 조준을 시작하지 않는다
      const st = stats(w);
      if (fire(w, i, st)) {
        snd(st.spray ? 'spray' : w.type);
        let cd = st.cd;
        if (st.ramp) { w.rp = Math.min(st.ramp, (w.rp || 0) + 0.03); cd /= 1 + w.rp; }
        if (st.warm) {                       // 예열: 쉬지 않고 쏠수록 빨라진다 (1.5초 쉬면 초기화)
          if (!(S.t - (w.lf == null ? -9 : w.lf) <= HEAT_IDLE)) w.ht = 0;
          w.ht = Math.min(HEAT_MAX, (w.ht || 0) + 1); w.lf = S.t; cd /= 1 + st.warmR * w.ht;
        }
        if (st.again) w.ag = 0.13;
        if (st.spray) {                      // 난사: 탄띠를 쏜 시간만큼 줄이고, 다 쓰면 재장전 (발사 간격이 짧아 남은 시간을 넘겨 끊김 없이 쏜다)
          cd /= st.spray;
          if (w.bl == null) w.bl = SPRAY_ON;
          w.bl -= cd;
          if (w.bl <= 1e-9) { w.bl = SPRAY_ON; w.rl = 1; w.cd = SPRAY_RL; }
          else w.cd = Math.max(0, cd + Math.max(w.cd, -cd));
        } else w.cd = st.dbl && rnd() < st.dbl ? Math.min(0.1, cd) : cd;
      } else { w.cd = 0.05; if (w.rp) w.rp = Math.max(0, w.rp - 0.02); }
    }
    { const st = stats(w); if (st.evo) skillStep(w, i, st, dt); }
  }

  // 지속 빔
  for (const b of S.beams) {
    b.t -= dt; b.tick -= dt;
    if (b.tick <= 1e-9) {                    // 0.1초마다 (부동소수 오차로 마지막 틱이 빠지지 않게 아주 작은 여유를 둔다)
      b.tick += 0.1;
      const wx = (b.k + 0.5) * LW;
      const bs_ = b.st, fo = bs_.focus, lf = bs_.lens ? nearest(wx, bs_) : null;
      const list = [];
      for (let j = 0, n = S.enemies.length; j < n; j++) { const e = S.enemies[j]; if (inReach(e, wx, bs_)) list.push(e); }
      capPick(list, bs_.cap);
      for (const e of list) hit(e, bs_.dmg * bs_.holdD * (fo ? 1 + fo * focusN(e, b) : 1) * (e === lf ? 1 + bs_.lens : 1), bs_);
    }
  }

  // 탄환
  for (const b of S.bullets) {
    const mvx = b.vx * dt, mvy = b.vy * dt;
    b.x += mvx; b.y += mvy; b.left -= Math.hypot(mvx, mvy);
    if (b.left <= 0 || b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) { b.dead = true; continue; }
    for (let i = 0, n = S.enemies.length; i < n; i++) {
      const e = S.enemies[i];
      if (e.dead || b.hit.indexOf(e) >= 0) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) <= e.r + b.r) {
        b.hit.push(e);
        if (b.bk) bigFrom(b.x, b.y, b.bk, b.vx, b.vy);   // 거대탄, 슬러그, 용 머리: 맞아 죽은 적이 탄이 가는 쪽으로 날아간다 (T10c)
        hit(e, b.dmg, b.st, false, false, false, b.drg);
        if (b.bk) bigFrom(null);
        if (!ghW(b.st)) {                    // 망령 블록과 이어진 무기: 밀치기, 기절, 작은 폭발, 분열 없음
        if (b.kn && !e.boss && !e.dead && !(b.slg && S.t - (e.slkT == null ? -9 : e.slkT) < 1)) {   // 슬러그는 같은 적을 1초에 한 번만 밀어낸다 (여러 자루가 겹쳐도)
          e.y = Math.max(-e.r, e.y - b.kn); if (b.slg) e.slkT = S.t;
        }
        if (b.stn && !e.boss && !e.dead) e.stunT = Math.max(e.stunT, b.stn);   // 묵직한 탄: 기절
        if (b.tb) miniBoom(b.x, b.y, 45, b.dmg * 0.4 * b.tb, b.st, e);           // 쌍포탑: 맞으면 작은 폭발
        if (b.split) {                       // 분열탄
          const base = Math.atan2(b.vx, -b.vy), m = b.split;
          for (let k = 0; k < m; k++) {
            const off = m === 2 ? (k ? 0.5 : -0.5) : (k - 1) * 0.55;
            bullet(b.x, b.y, base + off, b.dmg * 0.35, b.st, 240, { split: 0, rico: 0, pierce: 0, r: 3.5 }).hit.push(e);
          }
          b.split = 0;
        }
        }
        if (b.rico > 0) {                    // 도탄: 가까운 다른 적에게 방향을 바꾼다
          let nx = null, bd = 280;
          for (let j = 0; j < n; j++) {
            const o = S.enemies[j];
            if (o.dead || o.y + o.r <= 0 || b.hit.indexOf(o) >= 0) continue;
            const dd = Math.hypot(o.x - b.x, o.y - b.y);
            if (dd < bd) { bd = dd; nx = o; }
          }
          if (nx) {
            const sp = Math.hypot(b.vx, b.vy), a = Math.atan2(nx.x - b.x, b.y - nx.y);
            b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp;
            b.rico--; b.dmg *= 0.5; b.left = Math.max(b.left, 320);
            break;
          }
        }
        if (b.pierce-- <= 0) { b.dead = true; break; }
        if (!b.drg) b.dmg *= b.big ? 0.85 : b.pk;   // 관통할수록 약해진다 (가속 관통: 덜 약해진다). 용 머리는 줄지 않는다
      }
    }
  }

  // 포탄 (박격포 포탄, 미사일, 떨어지는 폭탄, 산성 덩어리). 도중에 분리 탄두와 뒤따르는 폭탄이 더해진다
  for (let q = 0; q < S.shells.length; q++) {
    const s = S.shells[q];
    if (s.dead) continue;
    if (s.wt > 0) { s.wt -= dt; continue; }   // 공습, 뒤따르는 폭탄: 떨어지기 전 기다림
    if (s.tg && !s.tg.dead) { s.tx = s.tg.x; s.ty = s.tg.y; }   // 미사일: 표적을 따라간다 (표적이 죽으면 그 자리로)
    s.p += dt / s.dur;
    if (s.mirv && !s.split && s.p >= 0.8) mirvSplit(s);
    if (s.p < 1) continue;
    s.dead = true;
    if (s.acid) { acidPool(s.tx, s.ty, s.st); continue; }
    shellBlast(s);
  }

  // 화염 지대
  const aSeen = new Map();
  let eSeen = null, rSeen = null, bSeen = null, nSeen = null, lSeen = null;   // 전격기: 전기장, 줄, 구체 / 산성비, 점액 자국 (종류마다 따로)
  for (const p of S.pools) {
    p.t -= dt;
    if (p.acid) { if (p.rp) p.r = puddleR(p); acidTick(p, dt, aSeen); continue; }   // 폭우의 고이는 웅덩이: 반경이 커졌다 줄어든다
    switch (p.kind) {
      case 'fire': fireTick(p, dt, aSeen); continue;
      case 'efield': fieldTick(p, dt, eSeen || (eSeen = new Map())); continue;
      case 'arc': arcTick(p, dt, rSeen || (rSeen = new Map())); continue;
      case 'ball': ballTick(p, dt, bSeen || (bSeen = new Map())); continue;
      case 'rain': rainTick(p, dt, nSeen || (nSeen = new Map())); continue;
      case 'slime': fieldTick(p, dt, lSeen || (lSeen = new Map())); continue;   // 점액 자국 (전기장과 같은 판정)
    }
    poolTick(p, dt);                         // 용융선, 잔광, 박격포 화염 지대
  }

  // 지뢰: 적이 밟으면 터진다
  if (S.mines.length) {
    for (let q = 0, nm = S.mines.length; q < nm; q++) {
      const m = S.mines[q]; m.t -= dt;
      if (m.t <= 0) { m.dead = true; continue; }
      for (let i = 0, n = S.enemies.length; i < n; i++) {
        const e = S.enemies[i];
        if (!e.dead && e.y + e.r > 0 && within(e.x - m.x, e.y - m.y, m.tr + e.r * 0.6)) { mineBlast(m); break; }
      }
    }
    if (S.mines.some(m => m.dead)) S.mines = S.mines.filter(m => !m.dead);
  }

  // 기지의 자동 효과
  const bs = bstats(), B = S.base;
  if (bs.regenPct && S.hp < S.maxHp) S.hp = Math.min(S.maxHp, S.hp + S.maxHp * bs.regenPct * dt);   // 1초마다 최대 체력의 일정 비율
  if (bs.turret) {                           // 방어 포탑
    B.tt -= dt;
    if (B.tt <= 0) {
      let t = null;
      for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && (!t || e.y > t.y)) t = e;
      if (t) {
        bullet(W / 2, H - 6, Math.atan2(t.x - W / 2, H - 6 - t.y), bestDps() * bs.turret * 0.5, bs.st, H + 150, { pierce: 0, rico: 0, split: 0, r: 6 });
        snd('blaster'); B.tt = 0.5;
      } else B.tt = 0.1;
    }
  }
  if (bs.fence) {                            // 전기 울타리
    const dps = bestDps() * bs.fence;
    for (let i = 0, n = S.enemies.length; i < n; i++) { const e = S.enemies[i]; if (!e.dead && e.y + e.r > H * 0.86) dot(e, dps * dt, bs.st); }
  }
  if (bs.wave) {                             // 빙결 파동
    B.wv += dt;
    if (B.wv >= bs.wave && S.enemies.some(e => !e.dead && e.y + e.r > 0)) {
      B.wv = 0;
      for (const e of S.enemies) {
        if (e.dead || e.y + e.r <= 0) continue;
        if (e.boss) { e.slowT = Math.max(e.slowT, 1.5); e.slowPct = Math.max(e.slowPct, 0.4); }
        else { e.stunT = Math.max(e.stunT, 1.5); e.ice = true; }
      }
      fx({ k: 'ring', d: 0.7, x: W / 2, y: H, r: Math.hypot(W / 2, H) * 1.05, c: '#8fe3ff', fat: 1 });
      snd('pulse');
    }
  }
  if (B.bc > 0) B.bc -= dt;
  if (bs.bomb && B.bc <= 0 && S.hp / S.maxHp < bs.bomb / 100 && S.enemies.length) {   // 비상 폭격
    B.bc = 60;
    const bd = bestDps() * 8;
    fx({ k: 'flash', d: 0.3 });
    for (let i = 0, n = S.enemies.length; i < n; i++) {
      const e = S.enemies[i]; if (e.dead || e.y + e.r <= 0) continue;
      fx({ k: 'boom', d: 0.4, x: e.x, y: e.y, r: 60, c: '#ffffff' });
      hit(e, bd, bs.st, true);
    }
    snd('bosskill');
  }

  // 적 이동
  for (let i = 0, n = S.enemies.length; i < n; i++) {
    const e = S.enemies[i]; if (e.dead) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.hl > 0) e.hl -= dt;                 // 망령 회복 빛 (화면용)
    if (e.vulnT > 0) { e.vulnT -= dt; if (e.vulnT <= 0) e.vulnPct = 0; }
    if (e.cor > 0 && e.corS !== S.t && (e.corH -= dt) <= 0) { e.corH += CORR_DROP; e.corA = 0; if (--e.cor <= 0) e.corV = 0; }   // 부식: 나간 뒤 CORR_HOLD 초 유지, 그 뒤 한 겹씩
    if (e.burnT > 0) { e.burnT -= dt; dot(e, e.burnDps * dt, e.burnSt); if (e.dead) continue; if (e.burnT <= 0) e.burnDps = 0; }
    if (e.fT > 0) { e.fT -= dt; if (e.fSt) dot(e, e.fDps * dt, e.fSt); if (e.dead) continue; if (e.fT <= 0) e.fDps = 0; }   // 화염 산탄의 화상
    if (e.slT > 0) { e.slT -= dt; slimeDrop(e); }   // 점액 흔적
    if (e.cr) { if ((e.cr.t -= dt) <= 0) { e.dead = true; fx({ k: 'crfade', d: 0.6, x: e.x, y: e.y, r: e.r, id: e.cr.id }); } continue; }   // 보급 상자: 움직이지 않고, 시간이 다 되면 사라진다 (보상 없음)
    if (e.stunT > 0) { e.stunT -= dt; if (e.stunT <= 0) e.ice = false; continue; }
    let sp = e.speed;
    if (e.spdMul != null) sp *= e.spdMul;   // 천칭의 교대, 돌격체의 멈춤(0)과 돌진
    if (e.slowT > 0) { e.slowT -= dt; sp *= 1 - e.slowPct; if (e.slowT <= 0) e.slowPct = 0; }
    if (bs.nearSlow && e.y > H * 0.75) sp *= 1 - (e.boss ? bs.nearSlow * 0.5 : bs.nearSlow);
    e.y += sp * H * dt;
    if (e.y + e.r * 0.3 >= H) {
      e.dead = true;
      const dmg = Math.round(e.leak * BAL.leakMul(tD()) * (1 - bs.shield) * (1 - bs.dmgRed) * (hasPact('blood') ? PACT.bloodDmg : 1) * 10) / 10;
      if (!(S.cheat && S.cheat.god)) S.hp -= dmg;   // 테스트: 기지 무적
      if (S.prep) S.lkW = S.wt;               // 배속 추천: 기지가 맞은 때 (무적이어도 맞은 것으로 친다)
      S.hitFlash = 0.3;
      fx({ k: 'leak', d: 0.5, x: e.x, n: dmg });
      snd('leak');
      for (let q = 0; q < LANES; q++) {      // 반격: 기지에 닿을 때마다 파동 (0.5초에 한 번)
        const cw = S.slots[q];
        if (cw && cw.evo && cw.type === 'pulse' && !(cw.ct > 0)) { const cs = stats(cw); if (cs.counter) { cw.ct = 0.5; counterPulse(q, cs); } }
      }
      if (bs.shock) {                        // 충격 방벽
        const R = 150, bd = bestDps() * bs.shock / 100;
        fx({ k: 'ring', d: 0.45, x: e.x, y: H, r: R, c: '#7af0c1', fat: 1 });
        for (let j = 0; j < n; j++) {
          const o = S.enemies[j];
          if (o.dead || Math.hypot(o.x - e.x, o.y - H) > R + o.r * 0.5) continue;
          if (!o.cr) o.y = Math.max(-o.r, o.y - (o.boss ? bs.shock * 0.4 : bs.shock));
          hit(o, bd, bs.st, true);
        }
      }
    }
  }

  // 정리
  if (S.enemies.some(e => e.dead)) S.enemies = S.enemies.filter(e => !e.dead);
  if (S.bullets.some(b => b.dead)) S.bullets = S.bullets.filter(b => !b.dead);
  if (S.shells.some(s => s.dead)) S.shells = S.shells.filter(s => !s.dead);
  if (S.pools.some(p => p.t <= 0)) S.pools = S.pools.filter(p => p.t > 0);
  if (S.beams.some(b => b.t <= 0)) S.beams = S.beams.filter(b => b.t > 0);
  for (const f of S.fx) f.t -= dt;
  if (S.fx.some(f => f.t <= 0)) S.fx = S.fx.filter(f => f.t > 0);

  // 보스 보상은 빈 칸이 생길 때 들어온다
  while (S.drops.length && freeSlot() >= 0) { S.inv[freeSlot()] = S.drops.shift(); S.newDrop = true; S.invDirty = true; }

  if (S.hp <= 0) {
    const k = B.parts.findIndex(p => p && p.id === 'barrier');
    if (k >= 0) {                            // 비상 방벽: 한 번 막고 사라진다
      const v = PARTS.barrier.v[B.parts[k].g];
      B.parts[k] = null; bdirty();
      S.hp = Math.max(1, Math.round(S.maxHp * v / 100));
      for (const e of S.enemies) if (!e.dead && !e.boss && e.y > H * 0.5) e.y -= H * 0.3;
      fx({ k: 'flash', d: 0.4 }); fx({ k: 'ring', d: 0.7, x: W / 2, y: H, r: H * 0.8, c: '#7af0c1', fat: 1 });
      snd('bosskill'); S.revived = true; S.invDirty = true;
    } else { S.hp = 0; S.over = true; }
  }
}

/* ---------- 연결 판 (연결 모드에서만 S.m3 가 생긴다) ---------- */

/* ---------- 정비 시간 (연결 모드에서만 S.prep 이 생긴다) ---------- */
// 웨이브는 적이 다 나오고(PREP.spawnT) 모두 쓰러지면(보스 예고, 떨어진 보급 상자는 빼고) 끝난다. 그 뒤 정비 시간(시간 제한 없음, 2026-11-28),
// '다음 웨이브'를 누르면 다음 웨이브. 웨이브 중에는 무기·인벤토리 옮기기만 된다(화면이 막는다).

// 그 값은 구간 가운데 span(n-1) + span/2 다 (예전 연속 등장에서 그 구간에 나온 적의 평균 등장 시각, 예전 웨이브가 세기를 정하던 시점도 구간 가운데).
// 적 체력, 처치 재화, 웨이브 세기와 종류 가중치, 기지 피해 배수, 황금체·보급 상자 재화가 이 값을 쓴다. 정비 시간과 실제 흐른 시간은 난이도와 무관하다.
// fill: 웨이브 세기 배수. 예전 방식의 CFG.waveFill(1.2)은 12초에 몰아 나오고 8초 쉬는 구조를 봇에 맞춘 보정이라 쓰지 않는다 (고르게 나오면 연속 등장과 같으니 1)

// 배속 추천 (T13d, 연결 모드): 적이 쉽게 쓰러지는 동안 화면이 2배를 권한다. 웨이브 시계(S.wt, 게임 시간)로 재서 배속과 상관없고 난수를 쓰지 않는다.

// 재는 방법: 이번 웨이브 안의 최근 win 초만 보므로 웨이브 시작 win 초 뒤부터, 그 동안 쓰러진 적이 n명 미만이면 판단하지 않는다.

const SPD_TIP = { win: 20, n: 8, hit: 0.5, show: 10, keep: 64 };   // keep: 처치 기록을 남기는 수 (고리 배열)

    P.phase = 'rest'; S.invDirty = true; S.slotDirty = true; snd('clear');   // 화면은 판이 가라앉은 뒤 인벤토리로 바뀐다 (ui prepSync)
  }

/* ---------- 테스트 모드 ---------- */
// S.cheat 는 테스트 게임에만 있다. 일반 게임에서는 아래 함수가 아무 일도 하지 않고, 본문의 분기도 `S.cheat &&` 뒤에만 있다.
const CHEAT_KEYS = ['gold', 'shards', 'succ', 'god', 'melt'];   // 재화 무한, 조각 무한, 강화 100%, 기지 무적, 용해로 무한
const SK_TOTAL = CFG.maxLv / CFG.augEvery;                      // 진화 100강까지 받는 스킬 포인트 (20)

    ? `<button type="button" class="fg-chip${k === k0 ? ' on' + coreCls() : ''}${w.evo ? ' evo' : ''}" data-fw="${k}" aria-label="${C.WEAPONS[w.type].name}">${icon(w.type, 22, w.evo)}<b style="color:${C.WEAPONS[w.type].color}">${lvTxt(w)}</b></button>`
    : '<span class="fg-chip empty"></span>').join('')}</div>`;
}
function fgParts(parts) {
  return `<div class="fg-parts n${parts.length}">${parts.map((p, k) => p
    ? `<button type="button" class="fpt g${p.g}" data-wpart="${k}">${partIcon(p.id, 22)}<small>${C.PARTS[p.id].name}</small></button>`
    : `<button type="button" class="fpt empty" data-wpart="${k}">파츠</button>`).join('')}</div>`;
}
// 강화 버튼: 창 너비만큼, 보유 조각 · 필요 · 성공 확률을 함께 적는다
function fgUp(t, act) {
  const u = C.upgradeInfo(t);
  if (u.max) return '<button type="button" class="btn fg-up max" disabled><span class="fl">강화</span><span class="fmx">최대 강화</span></button>';
  const ok = u.have >= u.cost;
  return `<button type="button" class="btn primary fg-up${ok ? '' : ' off'}" data-act="${act}"><span class="fl">강화</span>
    <span class="fv"><small>보유 조각</small><b>${SHARD}${fmtInt(u.have)}</b></span><span class="fv${ok ? '' : ' lack'}"><small>필요</small><b>${fmtInt(u.cost)}</b></span><span class="fv"><small>성공 확률</small><b>${Math.round(u.rate * 100)}%</b></span></button>`;
}
// 진화 / 스킬 버튼: 두 글자만으로는 무엇인지 모르니 짧은 설명을 붙인다
function fgEvo(w) {
  const st = `style="--wc:${C.WEAPONS[w.type].color}"`;
  if (w.evo) {
    const n = C.skillPoints(w).left;
    return `<button type="button" class="btn fg-wide evob${n > 0 ? ' has' : ''}" data-act="skOpen" ${st}><span class="fl">★ 스킬</span><span class="fd">진화한 무기의 스킬을 찍습니다<br>남은 포인트 <b>${n}</b></span></button>`;
  }
  if (w.lv >= C.CFG.maxLv) return `<button type="button" class="btn fg-wide evob has" data-act="evoOpen" ${st}><span class="fl">★ 진화</span><span class="fd">0강부터 다시, 능력은 그대로, 스킬이 열립니다<br>조각 <b>${fmtInt(C.CFG.evoCost)}</b></span></button>`;
  return '<button type="button" class="btn fg-wide lock" disabled><span class="fl">★ 진화</span><span class="fd">100강이 되면 진화해서<br>스킬을 찍을 수 있습니다</span></button>';
}
// 교체 버튼 (T13f): 진화 전에만. 30강 전에는 잠긴 버튼
function fgSwap(w, k) {
  if (w.evo) return '';
  if (w.lv < C.SWAP.lv) return `<button type="button" class="btn fg-wide lock" disabled><span class="fl">교체</span><span class="fd">${C.SWAP.lv}강부터 다른 무기로<br>바꿀 수 있습니다</span></button>`;
  const c = C.canSwap(k);
  return `<button type="button" class="btn fg-wide swb${c.reason === 'gold' ? ' off' : ''}" data-act="swOpen"><span class="fl">교체</span><span class="fd">다른 무기로 바꿉니다, 강화 −${C.SWAP.loss}<br>비용 <b>◆ ${fmtInt(c.cost)}</b></span></button>`;
}
function wmHtml(w) {
  const S = C.S, st = C.stats(w), d = C.WEAPONS[w.type];
  const dealt = w.dealt || 0, share = S.dealt > 0 ? Math.round(dealt / S.dealt * 100) : 0;
  return `<div class="modal wm fg">${fgHead()}${fgChips(wmodal)}
    <div class="fg-card">
      <div class="fg-name"><div><span class="nm" style="color:${d.color}">${d.name} ${lvTxt(w)}</span>
        <span class="st">공격력 ${fmt(st.dmg)} · 간격 ${st.cd.toFixed(2)}초 · 치명 ${Math.round(st.crit * 100)}%${st.capOn ? ` · ${st.cap < C.CAP_NONE ? '최대 ' + st.cap + '명' : '제한 없음'}` : ''}</span></div>
        ${S.pipe ? '' : '<button type="button" class="btn sm" data-act="wunequip">장착 해제</button>'}</div>
      ${fgParts(w.parts)}
      <div class="wm-info" id="wmInfo">${wInfoHtml(modalInfoText())}</div>
      <div class="wm-augs">${augRows(w.augs)}</div>
      <div class="fg-rec">처치 <b>${fmtInt(w.kills || 0)}</b> · 누적 피해 <b>${fmt(dealt)}</b> · 전체 피해 중 <b>${share}%</b></div>
    </div>
    ${fgUp(w, 'wup')}${fgSwap(w, wmodal)}${fgEvo(w)}</div>`;
}
function bmHtml() {
  const S = C.S, b = S.base, bs = C.bstats();
  const extra = [];
  const red = 1 - (1 - bs.shield) * (1 - bs.dmgRed);   // 방패와 기지 증강의 피해 감소를 합친 값
  if (red > 0) extra.push(`받는 피해 -${Math.round(red * 100)}%`);
  if (bs.regenPct) extra.push(`초당 체력 ${+(bs.regenPct * 100).toFixed(2)}% 회복`);
  if (bs.luck) extra.push(`강화 성공 +${Math.round(bs.luck * 100)}%p`);
  return `<div class="modal wm fg bm">${fgHead()}
    <div class="fg-card${coreCls()}">
      <div class="fg-name"><div><span class="nm bcol">기지 +${b.lv}</span>
        <span class="st">최대 체력 ${bs.maxHp}${extra.length ? ' · ' + extra.join(' · ') : ''} · 강화 단계마다 체력 +${C.CFG.baseHpPerLv}</span></div></div>
      ${fgParts(b.parts)}
      <div class="wm-info" id="wmInfo">${wInfoHtml(modalInfoText())}</div>
      <div class="wm-augs">${augRows(b.augs)}</div>
      <div class="fg-rec">체력 <b>${Math.ceil(S.hp)}/${S.maxHp}</b> · 기지가 처치 <b>${fmtInt(b.kills || 0)}</b> · 준 피해 <b>${fmt(b.dealt || 0)}</b></div>
      ${pactListHtml()}
    </div>
    ${fgUp(b, 'bup')}</div>`;
}
// 용해로 탭: 게이지는 여기서만 보인다. 녹일 것은 창 안의 인벤토리에서 고른다
function fmHtml() {
  const S = C.S, cc = C.craftCost(), m = C.meltCount(), pct = Math.min(100, m / cc * 100), od = oddsPct();
  const n = meltSet.size, v = n ? [...meltSet].reduce((a, i) => a + C.meltValue(S.inv[i]), 0) : C.meltAllValue().pts;
  const label = n ? `선택 분해 ${n}개` : meltAllArm ? '정말 모두 분해' : '모두 분해';
  return `<div class="modal wm fg fgm">${fgHead()}
    <div class="fg-card">
      <div class="fg-gauge"><span>게이지</span><b>${fmtInt(m)} / ${fmtInt(cc)}</b></div>
      <span class="gbar"><i style="width:${pct}%"></i></span>
      <span class="odds">제조하면 <span class="g1">희귀 ${od[1]}%</span> · <span class="g2">영웅 ${od[2]}%</span> · <span class="g3">전설 ${od[3]}%</span></span>
    </div>
    <div class="wm-sec">${S.pipe ? '녹일 파츠를 누르세요' : '녹일 파츠·무기를 누르세요'}</div>
    <div class="inv melting">${S.inv.map((it, i) => cellHtml(it, i, true)).join('')}</div>
    <button type="button" class="btn primary fg-wide${m >= cc ? '' : ' off'}" data-act="craft"><span class="fl">제조</span><span class="fd">게이지 <b>${fmtInt(cc)}</b>로 희귀 이상 파츠 하나</span></button>
    <button type="button" class="btn ember fg-wide${meltAllArm && !n ? ' danger' : ''}" data-act="meltBulk"><span class="fl">${label}</span><span class="fd">게이지 <b>+${fmtInt(v)}</b>${n ? '' : S.pipe ? '<br>영웅 이상 파츠는 빼고' : '<br>영웅 이상 파츠, 강화한 무기는 빼고'}</span></button></div>`;
}
/* ---------- 진화 창과 스킬 창 ---------- */
function evoHtml() {
  const w = C.S.slots[evoK], d = C.WEAPONS[w.type], c = C.canEvolve(evoK), ok = c.ok;
  return `<div class="modal evom"><h2>진화</h2>
    <div class="evo-w" style="--wc:${d.color}"><span class="evo-ic">${icon(w.type, 40)}</span><span class="evo-arr">${ARROW}</span><span class="evo-ic on">${icon(w.type, 40, true)}</span>
      <div class="evo-nm"><b style="color:${d.color}">${d.name}</b><span>+100 → ★+0</span></div></div>
    <div class="evo-cost${c.reason === 'shards' ? ' short' : ''}">${SHARD}<b>조각 ${fmtInt(c.cost)}</b><span>보유 <b>${fmtInt(c.have)}</b></span></div>
    <ul class="evo-list"><li>0강으로 돌아가지만 능력은 유지</li><li>강화 비용 300 + 일반의 5배, 5강마다 스킬 포인트</li><li>0강 아래로 떨어지면 진화가 풀림</li></ul>
    ${c.reason === 'shards' ? `<p class="warn">조각이 ${fmtInt(c.cost - c.have)}개 모자랍니다.</p>` : ''}
    <div class="d-acts two"><button type="button" class="btn primary${ok ? '' : ' off'}" data-act="evoOk"${ok ? '' : ' disabled'}>진화한다</button><button type="button" class="btn" data-act="evoClose">닫기</button></div></div>`;
}
// 무기 교체 창 (T13f): 바꿀 종류를 누르고 '교체한다'. 지금 종류는 같은 자리에 흐리게 (고를 수 없음)
function swHtml() {
  const w = C.S.slots[swK], d = C.WEAPONS[w.type], c = C.canSwap(swK, swT), nd = swT ? C.WEAPONS[swT] : null;
  const lv = w.lv - C.SWAP.loss, ok = !!nd && c.ok, short = c.reason === 'gold';
  return `<div class="modal evom swm"><h2>무기 교체</h2>
    <div class="evo-w"><span class="evo-ic" style="--wc:${d.color}">${icon(w.type, 40)}</span><span class="evo-arr">${ARROW}</span><span class="evo-ic${nd ? ' on' : ' q'}"${nd ? ` style="--wc:${nd.color}"` : ''}>${nd ? icon(swT, 40) : '?'}</span>
      <div class="evo-nm"><b style="color:${nd ? nd.color : 'var(--dim)'}">${nd ? nd.name : '무기를 고르세요'}</b><span>+${w.lv} → +${lv}</span>${nd ? `<span>${ROLE_LINE[swT]}</span>` : ''}</div></div>
    <div class="sw-grid">${C.WEAPON_IDS.map(t => `<button type="button" class="sw-t${t === swT ? ' on' : ''}" data-swt="${t}" style="--wc:${C.WEAPONS[t].color}"${t === w.type ? ' disabled' : ''}>${icon(t, 28)}<small>${t === w.type ? '지금 무기' : C.WEAPONS[t].name}</small></button>`).join('')}</div>
    <div class="evo-cost${short ? ' short' : ''}"><i class="gem">◆</i><b>비용 ${fmtInt(c.cost)}</b><span>보유 <b>${fmtInt(c.have)}</b></span></div>
    <ul class="evo-list"><li>강화 −${C.SWAP.loss}, 파츠는 그대로</li><li>기존 증강은 사라지고, 새 증강을 선택하게 됩니다</li></ul>
    ${short ? `<p class="warn">◆ ${fmtInt(c.cost - c.have)} 모자랍니다.</p>` : ''}
    <div class="d-acts two"><button type="button" class="btn primary${ok ? '' : ' off'}" data-act="swOk"${ok ? '' : ' disabled'}>교체한다</button><button type="button" class="btn" data-act="swClose">닫기</button></div></div>`;
}

const skIcon = (n) => `<svg viewBox="0 0 24 24" ${SVG_ATTR}>${SKICON[n.id] || ''}</svg>`;
const SK_LOCK = `<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>`;
const SK_KIND = { root: '기본', up: '강화', cap: '최종' };
function skFirst(w) {   // 열 때 고를 노드: 지금 찍을 수 있는 첫 노드 (없으면 첫 칸)
  for (let l = 0; l < 3; l++) for (let t = 0; t < 3; t++) if (C.skillInfo(w, l, t).can) return { l, t };
  return { l: 0, t: 0 };
}
// 창을 열 때 고를 노드: 이 무기에서 마지막에 찍은 노드(다 찍어 넘어간 다음 단계 포함). 찍은 적이 없으면 찍을 수 있는 첫 노드
function skOpenSel(w) {
  const m = skMem.get(w);
  return m && C.skillPoints(w).spent > 0 ? { l: m.l, t: m.t } : skFirst(w);
}
function skillHtml() {
  const w = C.S.slots[skK], d = C.WEAPONS[w.type], P = C.skillPoints(w), tree = C.SKILLS[w.type];
  if (!skSel) skSel = skOpenSel(w);
  const cols = tree.map((line, l) => {
    const tiles = [2, 1, 0].map((t) => {
      const i = C.skillInfo(w, l, t), nm = i.name;
      const cls = 'skt ' + (t === 2 ? 'cap' : '') + (i.locked ? ' lock' : '') + (i.rank >= i.max ? ' full' : i.rank > 0 ? ' has' : '') + (i.can ? ' can' : '') +
        (skSel.l === l && skSel.t === t ? ' sel' : '') + (skGot && skGot.l === l && skGot.t === t ? ' got' : '');
      const conn = t > 0 ? `<i class="skc${C.skillInfo(w, l, t - 1).rank >= C.skillInfo(w, l, t - 1).max ? ' on' : ''}"></i>` : '';
      return `<button type="button" class="${cls}" data-sk="${l}:${t}" aria-label="${nm} ${i.rank}/${i.max}${i.locked ? ' 잠김' : ''}"><span class="skic">${skIcon(i.node)}</span><span class="skn">${nm}</span>${i.locked ? `<span class="skl">${SK_LOCK}</span>` : `<b class="skr">${i.rank}/${i.max}</b>`}</button>${conn}`;
    });
    return `<div class="skcol"><div class="sktiles">${tiles.join('')}</div><b class="sklab">${line.name}</b></div>`;
  }).join('');
  const i = C.skillInfo(w, skSel.l, skSel.t), cur = C.skillText(w, skSel.l, skSel.t, i.rank), nxt = i.rank < i.max ? C.skillText(w, skSel.l, skSel.t, i.rank + 1) : '';
  const prev = skSel.t > 0 ? C.skillInfo(w, skSel.l, skSel.t - 1) : null;
  let body;
  if (i.locked) body = `<span class="skreq">${prev.name} ${prev.max}/${prev.max}을(를) 먼저 찍어야 합니다. (지금 ${prev.rank}/${prev.max})</span>` + (nxt ? `<span class="skfx dim">${nxt}</span>` : '');
  else if (i.rank >= i.max) body = `<span class="skfx">${cur}</span><span class="skreq">최대 랭크입니다.</span>`;
  else body = `<span class="skfx${i.rank ? '' : ' dim'}">${i.rank ? cur : '아직 찍지 않음'}</span><span class="skarr">▼</span><span class="skfx nx">${nxt}</span>`;
  const noPt = !i.can && !i.locked && i.rank < i.max;   // 포인트가 없을 때는 버튼 글로 알린다 (설명 칸 높이를 고정해 두었으므로 줄을 늘리지 않는다)
  return `<div class="modal skm" style="--wc:${d.color}"><div class="wm-head"><div><h2>스킬</h2><span class="st"><b style="color:${d.color}">${d.name} ${lvTxt(w)}</b></span></div>
      <span class="skpts${P.left > 0 ? ' has' : ''}">남은 포인트 <b>${P.left}</b></span></div>
    <div class="skgrid">${cols}</div>
    <div class="skdet"><div class="skhd"><span class="skpic${i.locked ? ' lock' : i.rank > 0 ? ' on' : ''}">${skIcon(i.node)}</span><b>${i.name}</b><span class="skk">${SK_KIND[i.node.t]}</span><span class="skrk">${i.rank}/${i.max}</span></div>${body}</div>
    <div class="d-acts two"><button type="button" class="btn primary${i.can ? '' : ' off'}" data-act="skUp"${i.can ? '' : ' disabled'}>${noPt ? (P.left > 0 ? `포인트 ${i.cost}점 필요` : '포인트 없음') : (i.cost > 1 ? `찍기 · ${i.cost}점` : '찍기')}</button><button type="button" class="btn" data-act="skClose">닫기</button></div></div>`;
}
// 비교 창: 왼쪽은 지금 장착한 것(바뀌는 것), 오른쪽은 새로 넣을 것. 글이 길면 줄바꿈한다
const partItem = (p) => ({ g: p.g, pic: picHtml(p), nm: C.PARTS[p.id].name, ds: C.partDesc(p) });

function cmpSide(lab, x) {
  const body = x.txt ? `<span class="ct">${x.txt}</span>`
    : `<span class="ch">${x.pic || ''}<span class="chip g${x.g}">${GR[x.g]}</span></span><b class="nm">${x.nm}</b><span class="ds">${x.ds}</span>`;
  return `<div class="cbox${x.txt ? ' none' : ' g' + x.g}"><small class="cl">${lab}</small>${body}</div>`;
}
const ARROW = '<span class="arr" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span>';
function cmpHtml(l, r) { return `<div class="cmp">${cmpSide(l.lab, l.x)}${ARROW}${cmpSide(r.lab, r.x)}</div>`; }
// 무기의 k번 파츠 칸을 np로 바꿨을 때의 능력치 변화. 복사본에 적용하므로 게임 상태는 바뀌지 않는다
function statDeltaHtml(w, k, np) {
  const cp = Object.assign({}, w, { parts: w.parts.slice() });
  cp.parts[k] = np;
  const a = C.stats(w), b = C.stats(cp);
  const line = (lab, x, y, f, lowGood) => {
    const better = lowGood ? y < x - 1e-9 : y > x + 1e-9, worse = lowGood ? y > x + 1e-9 : y < x - 1e-9;
    return `<span class="sd ${better ? 'up' : worse ? 'dn' : ''}">${lab} ${f(x)} → ${f(y)}</span>`;
  };
  return `<div class="sdelta">${line('공격력', a.dmg, b.dmg, fmt, false)}${line('공격 간격', a.cd, b.cd, v => v.toFixed(2) + '초', true)}</div>`;
}
// 파츠 고르기 창: 무기 창이나 기지 창에서 파츠 칸을 눌렀을 때

  if (cur && wpickNew >= 0 && S.inv[wpickNew]) {   // 이미 파츠가 있는 칸: 새것과 지금 것을 견주어 본다
    return `<div class="modal wm">

      ${cmpHtml({ lab: '지금 장착한 파츠', x: partItem(cur) }, { lab: '새로 넣을 파츠', x: partItem(S.inv[wpickNew]) })}
      ${bmodal ? '' : statDeltaHtml(holder, k, S.inv[wpickNew])}

      const x = cx(f.i % N) + (f.sd - 0.5) * Rb * 1.4 + Math.sin(u * 4 + f.sd * 9) * Rb * 0.15, y = cy(Math.floor(f.i / N)) - u * Rb * 1.1, r = Rb * (0.18 + 0.3 * u) * (0.8 + 0.4 * hash(f.sd * 3));
      g.fillStyle = rgba(f.c || ECOL.corrode, (f.c ? 0.3 : 0.22) * Math.sin(Math.PI * u)); m3Blob(g, x, y, r, f.sd, now, false); g.fill();
    } else if (f.k === 'mote') {                  // 망령 알갱이: 둘레의 흩어진 자리에서 블록 가운데로 휘어 들어오며 작아지고 옅어진다
      const a = f.sd * 6.28 + u * 1.2, d = Rb * (1.5 - 1.2 * u * u) * (0.8 + 0.4 * hash(f.sd * 7)), x = cx(f.i % N) + Math.cos(a) * d, y = cy(Math.floor(f.i / N)) + Math.sin(a) * d * 0.8;
      const z = (1.4 + 1.6 * hash(f.sd * 11)) * (1 - 0.6 * u), al = Math.sin(Math.PI * Math.min(1, u * 1.15));
      g.fillStyle = rgba(TC.ghost, 0.18 * al); g.beginPath(); g.arc(x, y, z * 2.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = rgba(theme.scheme === 'light' ? TC.ghost : TC.ghostB, 0.85 * al); g.beginPath(); g.arc(x, y, z, 0, Math.PI * 2); g.fill();
    } else if (f.k === 'glint') {
      const x = cx(f.i % N) + (f.sd - 0.5) * Rb * 2, y = cy(Math.floor(f.i / N)) + (hash(f.sd * 7) - 0.5) * Rb * 2 - u * Rb * 0.4;
      m3Star(g, x, y, (2.5 + 3 * hash(f.sd * 11)) * Math.sin(Math.PI * u), theme.scheme === 'light' ? TC.gold : TC.goldA, 0.9 * Math.sin(Math.PI * u));

}


/* ---------- 진행 ---------- */
let last = 0, acc = 0, lightAt = 0;
function frame(ts) {
  const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0; last = ts;
  const S = C.S;
  if (mode === 'play' && S && !S.pendingAug && !S.pendingPact && ((wmodal < 0 && !bmodal && !partSwap && skK < 0 && evoK < 0 && swK < 0) || (S.prep && S.prep.phase === 'rest'))) {
    legendMark();
    acc += dt * speed; let n = 0;
    while (acc >= 1 / 60 && n < 12) { C.step(1 / 60); acc -= 1 / 60; n++; }
    if (n === 12) acc = 0;
    if (S.prep) prepSync();                  // 웨이브를 막은 걸 인벤토리를 다시 그리기 전에 안다 (판이 가라앉을 동안 남긴다)
    if (S.snd && S.snd.length) { for (const n of S.snd) Snd.play(n); S.snd.length = 0; }
    if (S.rewq && S.rewq.length) bossRewards(S.rewq.splice(0));     // 인벤토리를 다시 그리기 전에: 날아오는 물건의 칸을 먼저 가린다
    if (S.invDirty) { S.invDirty = false; renderBottom(); }
    if (S.slotDirty) { S.slotDirty = false; renderWeapons(); }
    if (S.abfx && S.abfx.length) { for (const a of S.abfx.splice(0)) abHitFx(a.kind, a.i); }
    if (S.notes && S.notes.length) say(S.notes.splice(0).join('<br>'), true);
    if (S.evq && S.evq.length) drainEvq();
    if (S.revived) { S.revived = false; say('<b>비상 방벽</b>이 기지를 지켰습니다. 방벽 파츠는 사라졌습니다.'); }
    if (S.newDrop) { S.newDrop = false; legendScan(); }                 // 기다리던 보상이 늦게 들어올 때도 알림 글은 없다
    if (S.over) gameOver();
    else if (S.pendingPact) { renderAll(); }   // 천칭이 쓰러짐: 거래 제안 창을 연다
  }
  if (drag && performance.now() - drag.at > 6000) endDrag(false);   // 신호가 끊긴 끌기 정리
  draw(); hud(); updateChips();
  if (S && S.m3) m3Draw(dt);
  if (S && S.prep) prepSync(); else if (!prepEl.hidden) prepEl.hidden = true;
  waveSync(); spdSync();
  if (ts - lightAt > 120) { lightAt = ts; lightUpdate(); }
  requestAnimationFrame(frame);
}

function snapshot() {
  const S = C.S;
  if (!S || (mode !== 'play' && mode !== 'pause') || S.over) return {};
  const copy = Object.assign({}, S, {
    bullets: [], shells: [], pools: [], beams: [], mines: [], fx: [], snd: [], abfx: [], rewq: [], pendingAug: S.pendingAug,
    enemies: S.enemies.map(e => Object.assign({}, e, { burnSt: null, burnT: 0, burnDps: 0, fSt: null, fT: 0, fDps: 0, fcB: null, slT: 0 })),
  });
  return { S: JSON.parse(JSON.stringify(copy)) };
}
function start(data) {
  applyTheme(loadTheme(), false);
  try {
    const s = data && data.S;
    if (s && s.v === 1 && Array.isArray(s.slots) && Array.isArray(s.inv) && !s.over) { C.setState(s); mode = 'pause'; }
  } catch (e) { /* 이어하기 실패 시 새로 시작 */ }
  if (!C.S) C.newGame(undefined, 'pipe');
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap); else window.addEventListener('resize', resize);
  renderAll();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(snapshot); } catch (e) { /* 무시 */ } }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

// 점검용
window.__game = { start: startGame, get mode() { return mode; } };
window.__shareBlob = () => buildShare();   // 점검용: 공유 이미지(PNG Blob)를 지금 상태로 만든다
})();
