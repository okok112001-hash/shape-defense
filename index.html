<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#eef1f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="도형 디펜스">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>도형 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 설계도 콘셉트: 도면 위에 선으로 그린 도형. 세로 4단(상태, 전장, 무기 5칸, 인벤토리) */
  /* 아래 색은 기본 테마(밝은 종이)와 같다. 스크립트가 테마를 입히기 전 첫 화면에 쓰인다 (ui.js THEMES 의 paper 와 맞출 것) */
  color-scheme: light;
  --bg: #eef1f5;
  --panel: #ffffff;
  --panel-2: #e3e8ef;
  --line: rgba(30, 50, 90, .22);
  --ink: #1c2740;
  --dim: #5b6a85;
  --accent: #e09a00;
  --accent-ink: #8a5600;   /* 밝은 바탕 위의 글자용 강조색 */
  --on-accent: #1c1503;
  --backdrop: #d9dee6;
  --shade: rgba(30, 50, 90, .07);
  --overlay: rgba(28, 39, 64, .55);
  --toast: rgba(255, 255, 255, .97);
  --shadow: #fff;
  --hatch: rgba(30, 50, 90, .07);
  --sheen: rgba(255, 255, 255, .95);
  --melt: #b4540a;
  --melt-fill: #e5731a;
  --ember: #d4260f;        /* 용해로 모드 표시색: 붉은 불씨 (등급 네 색, 강화 모드의 금색과 다르다) */
  --danger: #e03a3a;
  --ok: #0f9d76;
  --g0: #6b7688;
  --g1: #1f7fe0;
  --g2: #8a4be0;
  --g3: #e07a00;
  --font-display: 'Do Hyeon', 'IBM Plex Sans KR', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --slot-h: 76px;
  --cell-h: 40px;
}
@media (min-height: 760px) { :root { --slot-h: 88px; --cell-h: 48px; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--backdrop); color: var(--ink);
  font: 400 13px/1.35 var(--font-body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
b { font-weight: 600; }
.g0 { color: var(--g0); } .g1 { color: var(--g1); } .g2 { color: var(--g2); } .g3 { color: var(--g3); }

#app {
  position: relative; height: 100%; max-width: 480px; margin: 0 auto;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
  background: var(--bg);
}

/* 상태 표시 */
#hud {
  /* 칸 너비를 고정해 숫자 길이가 바뀌어도 아무것도 움직이지 않는다: 체력 | 시간 | 처치 | 속도 | 정지 */
  display: grid; grid-template-columns: minmax(0, 1fr) 54px 50px 38px 38px; column-gap: 8px; align-items: center; padding: 6px 10px;
  position: relative; background: var(--panel); border-bottom: 1px solid var(--line);
}
.hp { display: grid; grid-template-columns: minmax(0, 1fr) 38px; column-gap: 6px; align-items: center; min-width: 0; }
.hp-bar { height: 10px; border: 1px solid var(--line); background: var(--shade); border-radius: 2px; overflow: hidden; }
.hp-bar i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .15s; }
.hp-bar i.low { background: var(--danger); }
#hpTxt { display: block; width: 38px; font: 16px var(--font-display); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; text-align: right; }
.stat small { font-size: 10px; color: var(--dim); }
.stat b { display: block; width: 100%; font: 16px var(--font-display); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
#pauseBtn, #speedBtn { width: 38px; height: 34px; padding: 0; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; color: var(--dim); }
#speedBtn.on { color: var(--on-accent); background: var(--accent); border-color: var(--accent); font-weight: 600; }
/* 배속 추천 (T13d, ui spdSync): 1배 버튼이 숨 쉬듯 빛나고, 버튼 아래에서 작은 화살표가 버튼 쪽으로 올라간다. 나타나고 사라질 때는 서서히 */
#speedBtn { position: relative; }
#speedBtn::before { content: ''; position: absolute; inset: -3px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity .8s ease-out;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 62%, transparent), 0 0 12px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 0 9px color-mix(in srgb, var(--accent) 28%, transparent); }
#speedBtn.tip::before { opacity: 1; }
#speedBtn.tip::before, #speedBtn.tipo::before { animation: spdglow 2.2s ease-in-out infinite; }
@keyframes spdglow { 50% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 32%, transparent), 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent), inset 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent); } }
#spdTip { position: absolute; right: 56px; width: 38px; top: calc(100% - 7px); height: 34px; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .8s ease-out; }
#spdTip[hidden] { display: none; }
#spdTip.on { opacity: 1; }
#spdTip b { position: absolute; left: 50%; bottom: 2px; width: 8px; height: 8px; margin-left: -4.5px; box-sizing: border-box; border: solid var(--accent); border-width: 2px 0 0 2px; border-radius: 1px 0 0 0;
  opacity: 0; transform: translateY(0) rotate(45deg); animation: spdup 1.8s cubic-bezier(.3, .2, .5, 1) infinite; }
#spdTip b:nth-child(2) { margin-left: -3px; width: 7px; height: 7px; animation-delay: .6s; }
#spdTip b:nth-child(3) { margin-left: -5.5px; width: 9px; height: 9px; animation-delay: 1.2s; }
@keyframes spdup { 0% { opacity: 0; transform: translateY(0) rotate(45deg); } 35% { opacity: .85; } 100% { opacity: 0; transform: translateY(-24px) rotate(45deg); } }
@media (prefers-reduced-motion: reduce) {
  #speedBtn.tip::before, #speedBtn.tipo::before, #spdTip b { animation: none; }
  #spdTip b { opacity: .5; transform: translateY(-14px) rotate(45deg); } #spdTip b:nth-child(2) { opacity: .25; transform: translateY(-4px) rotate(45deg); } #spdTip b:nth-child(3) { display: none; }
}

/* 전장 */
#fieldWrap { position: relative; min-height: 0; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* 무기 5칸: 전장의 5개 레인과 세로로 정렬 */
#weapons {
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--panel); border-top: 2px solid var(--line); border-bottom: 1px solid var(--line);
}
.slot {
  position: relative; height: var(--slot-h); margin: 4px 3px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 1.5px solid var(--line); border-radius: 6px; background: var(--shade);
}
.slot.empty { border-style: dashed; }
.slot .plus { font: 22px var(--font-display); color: var(--dim); opacity: .5; }
.slot .lv { font: 15px var(--font-display); line-height: 1; }
.slot.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.slot.tg { border-color: var(--ok); border-style: dashed; animation: blink .8s linear infinite; }
@keyframes blink { 50% { background: color-mix(in srgb, var(--ok) 20%, transparent); } }
/* 파츠 추천 (T13g): 고른 파츠와 잘 맞는 무기 칸(또는 대장간에서 이 무기와 잘 맞는 파츠 줄)에 작은 반짝임과 옅은 안쪽 빛. 테마 강조색(배속 추천과 같은 말투) */
.slot.fit { box-shadow: inset 0 0 12px color-mix(in srgb, var(--accent) 32%, transparent); }
.fitic { position: absolute; z-index: 1; pointer-events: none; display: flex; color: var(--accent); animation: fittw 2.2s ease-in-out infinite; }
.slot .fitic { left: 3px; top: 3px; }
.prow.fit { position: relative; padding-right: 26px; }
.prow .fitic { right: 7px; top: 7px; }
.hfit { display: inline-flex; vertical-align: -2px; color: var(--accent); }
@keyframes fittw { 0%, 100% { opacity: .6; transform: scale(.82) rotate(-8deg); } 50% { opacity: 1; transform: scale(1.06) rotate(8deg); } }
.pips { display: flex; gap: 3px; height: 6px; }
.pips i { width: 8px; height: 6px; border: 1px solid var(--line); }
.pips i.pa { width: 6px; border-radius: 50%; }
.slot .pop {
  position: absolute; left: 50%; top: -4px; transform: translate(-50%, 0); white-space: nowrap; pointer-events: none;
  font: 15px var(--font-display); animation: rise .7s ease-out forwards; z-index: 2;
  text-shadow: 0 1px 0 var(--shadow), 0 0 6px var(--shadow);
}
.slot .pop.ok { color: var(--ok); } .slot .pop.no { color: var(--danger); }
@keyframes rise { to { transform: translate(-50%, -26px); opacity: 0; } }
.slot.flash-ok { border-color: var(--ok); } .slot.flash-no { border-color: var(--danger); }

/* 하단: 인벤토리 또는 무기 상세 */
#bottom { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
/* 연결 판: 판의 열이 무기 칸과 딱 맞도록 좌우 여백 없이 */
#bottom.m3on { padding: 2px 0 8px; }
#m3cv { display: block; width: 100%; height: calc(5 * var(--cell-h) + 30px); touch-action: none; -webkit-user-select: none; user-select: none; animation: m3in .3s ease-out backwards; }   /* 웨이브 시작: 판이 옅게 나타나고 블록이 위에서 떨어진다 */
/* 웨이브를 막고 정비로: 판이 가라앉은 자리에 인벤토리가 아래에서 살짝 떠오른다 (칸마다 다른 때, ui invRise 가 늦춤을 정한다) */
#bottom.rise .info, #bottom.rise .cell, #bottom.rise .acts > * { animation: invrise .4s cubic-bezier(.2, .75, .3, 1) backwards; }
@keyframes invrise { from { opacity: 0; transform: translateY(14px); } }
@keyframes m3in { from { opacity: 0; } }
@keyframes invfade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #bottom.rise .info, #bottom.rise .cell, #bottom.rise .acts > * { animation: invfade .24s ease-out backwards; } #m3cv { animation: none; } }
.info { height: 34px; font-size: 12px; line-height: 17px; color: var(--dim); overflow: hidden; }
.info b { color: var(--ink); }
.info .g0 { color: var(--g0); } .info .g1 { color: var(--g1); } .info .g2 { color: var(--g2); } .info .g3 { color: var(--g3); }
.info.warn { color: var(--accent-ink); }
.inv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.cell {
  position: relative; height: var(--cell-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  border: 1.5px solid var(--line); border-radius: 5px; background: var(--panel); line-height: 1.05;
}
.cell.empty { background: var(--shade); border-style: dashed; }
.cell b { font: 13px var(--font-display); font-variant-numeric: tabular-nums; }
.cell small { font-size: 9px; color: var(--dim); }
.cell .ab { font: 15px var(--font-display); }
.cell svg { flex: none; }
.cell.kp.g0 { border-color: var(--g0); color: var(--g0); }
.cell.kp.g1 { border-color: var(--g1); color: var(--g1); background: color-mix(in srgb, var(--g1) 12%, var(--panel)); }
.cell.kp.g2 { border-color: var(--g2); color: var(--g2); background: color-mix(in srgb, var(--g2) 14%, var(--panel)); }
.cell.kp.g3 { border-color: var(--g3); color: var(--g3); background: color-mix(in srgb, var(--g3) 16%, var(--panel)); }
.cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.new { animation: got .5s ease-out; }
@keyframes got { from { transform: scale(1.18); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent); } }

.acts { display: grid; grid-template-columns: 1fr; gap: 6px; }
.acts.two { grid-template-columns: 1.5fr 1fr; }
.slot, .cell { touch-action: none; -webkit-touch-callout: none; }
.ghost {
  position: fixed; z-index: 20; pointer-events: none; transform: translate(-50%, -85%) scale(1.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.05;
  border: 2px solid var(--accent); border-radius: 6px; background: var(--panel-2); box-shadow: 0 8px 20px rgba(0, 0, 0, .45);
}
.ghost b { font: 14px var(--font-display); } .ghost small { font-size: 9px; } .ghost .ab { font: 16px var(--font-display); }
.ghost .pips, .ghost .pop { display: none; }
#app.dragging .slot, #app.dragging .cell { border-style: dashed; }
#app.dragging .over { border-color: var(--accent); border-style: solid; background: color-mix(in srgb, var(--accent) 22%, transparent); }
.dragsrc { opacity: .3; }
.btn {
  height: 42px; border-radius: 5px; border: 1.5px solid var(--line); background: var(--panel-2);
  font: 600 14px var(--font-body); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px;
}
.btn small { font-weight: 400; font-size: 11px; color: var(--dim); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary small { color: color-mix(in srgb, var(--on-accent) 75%, transparent); }
.btn.primary b { font: 16px var(--font-display); }
.btn.off { opacity: .42; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:active { transform: translateY(1px); }

/* 무기 창 */
.d-acts { display: grid; grid-template-columns: 1.7fr 1fr; gap: 6px; }
.wm { gap: 8px; }
.wm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.wm-head .nm { display: block; font: 24px/1.1 var(--font-display); }
.wm-head .st { font-size: 11.5px; color: var(--dim); }
.wm-head .x { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; color: var(--ink); flex: none; }
.schem {
  position: relative; height: 178px; flex: none; border: 1px solid var(--line); border-radius: 6px;
  background-color: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 18px 18px; background-position: -1px -1px;
}
.schem .lab { position: absolute; left: 8px; top: 6px; font-size: 11px; color: var(--dim); }
.schem .wires { position: absolute; inset: 0; width: 100%; height: 100%; }
.schem .core {
  position: absolute; left: 50%; top: 54%; width: 86px; height: 86px; transform: translate(-50%, -50%);
  border: 2px solid; border-radius: 50%; background: var(--panel);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.schem .core b { font: 15px var(--font-display); }
.schem .pop {
  position: absolute; left: calc(100% + 44px); top: 30px; transform: translate(-50%, 0); white-space: nowrap; pointer-events: none;
  font: 26px var(--font-display); animation: rise .7s ease-out forwards; text-shadow: 0 1px 0 var(--shadow), 0 0 6px var(--shadow);
}
.schem .pop.ok { color: var(--ok); } .schem .pop.no { color: var(--danger); }
.pt {
  position: absolute; width: 94px; height: 48px; transform: translateX(-50%); gap: 1px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
  border: 1.5px solid var(--line); border-radius: 5px; background: var(--panel);
}
.pt b { font: 17px var(--font-display); }
.pt small { font-size: 10.5px; white-space: nowrap; }
.pt svg { flex: none; }
.pt.p0 { left: 50%; top: 5px; } .pt.p1 { left: 17%; bottom: 7px; } .pt.p2 { left: 83%; bottom: 7px; }
.pt.empty { border-style: dashed; color: var(--dim); font-size: 11px; background: var(--bg); }
.pt.g0 { border-color: var(--g0); color: var(--g0); }
.pt.g1 { border-color: var(--g1); color: var(--g1); background: color-mix(in srgb, var(--g1) 16%, var(--panel)); }
.pt.g2 { border-color: var(--g2); color: var(--g2); background: color-mix(in srgb, var(--g2) 18%, var(--panel)); }
.pt.g3 { border-color: var(--g3); color: var(--g3); background: color-mix(in srgb, var(--g3) 20%, var(--panel)); }
.pt.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.wm-info { min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 17px; color: var(--dim); }
.wm-info b { color: var(--ink); }
.wm-info .g0 { color: var(--g0); } .wm-info .g1 { color: var(--g1); } .wm-info .g2 { color: var(--g2); } .wm-info .g3 { color: var(--g3); }
.wm-info .warn { color: var(--accent-ink); }
.btn.sm { height: 32px; padding: 0 14px; font-size: 13px; flex: none; }
.wm-sec { font-size: 11px; color: var(--dim); margin-bottom: -4px; }
.wm-augs { display: flex; flex-direction: column; gap: 5px; }
.arow {
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; align-items: center;
  padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--panel-2);
}
.arow .chip { font-size: 10.5px; font-weight: 600; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; }
.arow b { font: 16px var(--font-display); color: var(--ink); }
.arow .ds { grid-column: 1 / -1; font-size: 12px; color: var(--ink); }
.arow.empty { display: block; border-style: dashed; background: none; color: var(--dim); font-size: 11.5px; padding: 5px 14px; }
.arow.g0 { border-color: var(--g0); } .arow.g1 { border-color: var(--g1); } .arow.g2 { border-color: var(--g2); } .arow.g3 { border-color: var(--g3); }
@media (max-height: 640px) { .schem { height: 156px; } .schem .core { width: 72px; height: 72px; } .pt { height: 42px; } .modal.wm { padding: 12px; gap: 6px; } }

/* 겹침 창 */
#overlay {
  position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: var(--overlay);
}
#overlay[hidden] { display: none; }
.modal {
  width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto;
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.modal h1 { margin: 0; font: 40px/1 var(--font-display); letter-spacing: 1px; text-wrap: balance; }
.modal h1 span { color: var(--accent-ink); }
.modal h2 { margin: 0; font: 24px/1.1 var(--font-display); }
.modal p { margin: 0; color: var(--dim); }
.modal ol { margin: 0; padding-left: 18px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.rec { display: grid; gap: 6px; }
.rec div { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
.rec small { display: block; font-size: 10px; color: var(--dim); }
.rec b { font: 16px var(--font-display); font-variant-numeric: tabular-nums; }
.rec .rmain { text-align: center; padding: 8px 8px 6px; }
.rec .rmain small { font-size: 12px; }
.rec .rmain b { font-size: 44px; line-height: 1.05; }
.rec .rsub { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; border: 0; padding: 0; }
.newrec { color: var(--accent-ink); font-weight: 600; }
.aug {
  text-align: left; width: 100%; padding: 10px 12px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--panel-2);
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 3px; align-items: center;
}
.aug .chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.aug .nm { font: 18px var(--font-display); }
.aug .ds { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink); }

/* 보스 능력: 봉쇄(잠금), 부식(강화 단계 감소) 예고와 발동. 교란·석화는 판 캔버스에 그린다 */

.slot.warn-lock { --ab: #ff3d5a; } .slot.warn-corr { --ab: #c04bff; }
@keyframes abblink {
  0%, 100% { background: color-mix(in srgb, var(--ab) 14%, var(--shade)); box-shadow: 0 0 0 0 var(--ab); }
  50% { background: color-mix(in srgb, var(--ab) 62%, var(--panel)); box-shadow: 0 0 0 3px var(--ab), inset 0 0 0 2px #fff; }

.slot.rusted, .slot.evo.rusted { border-color: #c04bff; background: color-mix(in srgb, #c04bff 16%, var(--panel)); }   /* 부식 블록과 이어진 무기 (0강으로 침) */

.slot .lockic { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; display: flex; color: #ff5d7a; }
/* ghosted: 망령 블록과 이어진 무기 (공격이 적을 회복시킨다). 아이콘이 흐려지고 칸 둘레에 청록 안개가 천천히 숨 쉰다 */

.slot .abic { right: 2px; top: 2px; min-width: 26px; height: 22px; padding: 0 4px; border-radius: 11px; }

@media (prefers-reduced-motion: reduce) {
  .slot.warn-lock, .slot.warn-corr { animation: none; background: color-mix(in srgb, var(--ab) 40%, var(--panel)); box-shadow: 0 0 0 2px var(--ab); }

@keyframes evia { 0% { transform: none; opacity: 1; animation-timing-function: cubic-bezier(.55, 0, .8, .45); } 36% { transform: scale(.36) rotate(-14deg); opacity: .85; }

  62% { transform: scale(.3) rotate(-16deg); opacity: .9; } 63%, 100% { transform: scale(.2); opacity: 0; } }
/* 2. 가운데에 빛이 모이고, 테두리를 따라 빛이 한 바퀴 차오른다 (앞머리가 밝다) */
@keyframes evcg { 0%, 18% { opacity: 0; transform: scale(.45); animation-timing-function: ease-in; } 62% { opacity: .9; transform: scale(1); }
  63% { opacity: 1; transform: scale(1.08); animation-timing-function: ease-out; } 84%, 100% { opacity: 0; transform: scale(1.55); } }
@keyframes evfill { 0%, 20% { stroke-dashoffset: 100; animation-timing-function: cubic-bezier(.5, .05, .75, .75); } 62%, 100% { stroke-dashoffset: 0; } }
@keyframes evtip { 0%, 20% { stroke-dashoffset: 3; animation-timing-function: cubic-bezier(.5, .05, .75, .75); } 62%, 100% { stroke-dashoffset: -97; } }
@keyframes evtipo { 0%, 21% { opacity: 0; } 25%, 60% { opacity: 1; } 63%, 100% { opacity: 0; } }
/* 3. 쿵: 눌렸다 튀고, 새 아이콘이 튀어나오고, ★ 가 찍힌다. 테두리 빛은 번졌다가 남는 빛으로 넘어간다 */
@keyframes evpress { 0%, 62% { transform: none; border-color: var(--line); } 63% { border-color: var(--wc); } 65% { transform: scale(.9); } 72% { transform: scale(1.06); } 80% { transform: scale(.985); } 88%, 100% { transform: none; border-color: var(--wc); } }
@keyframes evib { 0%, 62.9% { opacity: 0; transform: scale(.4); } 63% { opacity: 1; transform: scale(.5); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
  71% { transform: scale(1.22); animation-timing-function: ease-in-out; } 80% { transform: scale(.95); } 88% { transform: scale(1.02); } 100% { opacity: 1; transform: none; } }
@keyframes evlv { 0%, 62.9% { opacity: 0; } 63%, 100% { opacity: 1; } }
@keyframes evst { 0%, 63% { transform: scale(2.6); animation-timing-function: ease-in; } 68% { transform: scale(.88); animation-timing-function: ease-out; } 75% { transform: scale(1.08); } 83%, 100% { transform: none; } }
@keyframes evline { 0%, 63% { opacity: 1; } 100% { opacity: 0; } }
@keyframes evglow { 0% { stroke-width: 5; stroke-opacity: .25; } 62% { stroke-width: 6; stroke-opacity: .4; } 63% { stroke-width: 9; stroke-opacity: .6; animation-timing-function: ease-out; } 100% { stroke-width: 5; stroke-opacity: 0; } }
/* 4. 남는 빛이 서서히 켜진다 */
@keyframes evhalo { 0%, 63% { opacity: 0; } 100% { opacity: 1; } }
/* 움직임 줄이기: 0.6초, 크기와 위치는 바꾸지 않고 밝기만 */
@media (prefers-reduced-motion: reduce) {
  .slot.evoing, .evst, .slot.evo::after { animation: none; }
  .slot.evoing { animation: evqbd var(--ed) var(--ea) linear both; }
  .evo-a { animation-name: evqout; } .slot.evoing .evic > .evoic { animation-name: evlv; } .evcg { animation-name: evqcg; }
}
@keyframes evqbd { 0%, 62.9% { border-color: var(--line); } 63%, 100% { border-color: var(--wc); } }
@keyframes evqout { 0%, 50% { opacity: 1; } 63%, 100% { opacity: 0; } }
@keyframes evqcg { 0%, 18% { opacity: 0; } 62% { opacity: .9; } 84%, 100% { opacity: 0; } }

/* ---- 보스 보상: 죽은 자리에서 떠올라 인벤토리 칸으로 ---- */
#rewLayer { position: absolute; inset: 0; z-index: 12; pointer-events: none; overflow: hidden; }
.rw { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: left .5s cubic-bezier(.5, 0, .75, .5), top .5s cubic-bezier(.5, 0, .75, .5), opacity .5s ease-in, transform .5s ease-in; animation: rwpop .35s cubic-bezier(.2, 1.5, .4, 1) backwards; }
.rw-ic { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 9px; color: var(--c);
  border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 22%, var(--panel)); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 70%, transparent); }
.rw-l { font: 600 11px var(--font-body); color: var(--ink); background: var(--toast); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; transition: opacity .25s; }
.rw.go .rw-l { opacity: 0; }
.rw.fly { transform: translate(-50%, -50%) scale(.55); opacity: .9; }
.rw.rise { opacity: 0; transform: translate(-50%, -170%); }
.cell.incoming > * { opacity: 0; }
@keyframes rwpop { from { opacity: 0; transform: translate(-50%, -20%) scale(.3); } }
@media (prefers-reduced-motion: reduce) { .rw { animation: none; } }

/* ---- 테스트 모드 ---- */
#testBtn { width: 44px; height: 34px; padding: 0; border: 1px dashed var(--accent); border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--accent-ink); white-space: nowrap; }
#testBtn[hidden] { display: none; }
#app.test #hud { grid-template-columns: minmax(0, 1fr) 54px 50px 44px 38px 38px; }   /* 체력 | 시간 | 처치 | 테스트 | 속도 | 정지 */
.tlink { align-self: center; height: 36px; padding: 0 18px; margin-top: -2px; font-size: 12px; color: var(--dim); border: 1px dashed var(--line); border-radius: 5px; }
.tlink:active, .tchk:active, .twb:active { transform: translateY(1px); }
/* 정비 시간 막대 */
#prepBar {
  position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 3;
  display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; white-space: nowrap;
  border-radius: 8px; background: var(--panel); border: 1.5px solid var(--accent); box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
}
#prepBar[hidden] { display: none; }
#prepBar { animation: prepin .38s cubic-bezier(.2, .75, .3, 1) backwards; }   /* 나타날 때 위에서 살짝 내려오고, 다음 웨이브로 갈 때 위로 흐려진다 (ui prepSync) */
#prepBar.out { animation: prepout .24s ease-in forwards; pointer-events: none; }
@keyframes prepin { from { opacity: 0; transform: translate(-50%, -12px); } }
@keyframes prepout { to { opacity: 0; transform: translate(-50%, -8px); } }
@media (prefers-reduced-motion: reduce) { #prepBar { animation: invfade .24s ease-out backwards; } #prepBar.out { animation: prepfade .2s ease-in forwards; } }
@keyframes prepfade { to { opacity: 0; } }
/* 웨이브 막대 (연결 모드, 웨이브 중): HUD 아래 가장자리. 적이 나오는 동안 차오르고, 보스 시각마다 작은 마름모 (ui waveSync) */
#waveBar { position: absolute; left: 0; right: 0; bottom: -1px; height: 4px; z-index: 4; pointer-events: none; background: color-mix(in srgb, var(--ink) 10%, transparent); }
#waveBar[hidden] { display: none; }
#waveBar .wf { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: color-mix(in srgb, var(--ink) 52%, transparent); transition: opacity .35s; }
#waveBar.end::after { content: ''; position: absolute; right: 0; top: -1px; bottom: -1px; width: 44px; border-radius: 2px 0 0 2px;   /* 마무리 중: 끝이 숨 쉰다 */
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 80%, transparent)); animation: wvbr 1.7s ease-in-out infinite alternate; }
#waveBar .wb { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; box-sizing: border-box; transform: rotate(45deg); border-radius: 1px;
  border: 1.5px solid var(--danger); background: var(--panel); transition: opacity .5s, background-color .5s, border-color .5s, box-shadow .5s; }
#waveBar .wb[hidden] { display: none; }
#waveBar .wb.up { opacity: .7; }
#waveBar .wb.warn { background: var(--danger); animation: wvbl .42s ease-in-out infinite alternate; }
#waveBar .wb.on { background: var(--danger); box-shadow: 0 0 0 2px color-mix(in srgb, var(--danger) 28%, transparent); }
#waveBar .wb.gone { opacity: .4; border-color: var(--dim); background: var(--dim); }
#waveBar .wb.gd { border-color: var(--gold); }
#waveBar .wb.gd.warn, #waveBar .wb.gd.on { background: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 30%, transparent); }
#waveBar.ps .wb, #waveBar.ps::after { animation-play-state: paused; }
@keyframes wvbl { from { opacity: 1; } to { opacity: .25; } }
@keyframes wvbr { from { opacity: .12; } to { opacity: .85; } }
@media (prefers-reduced-motion: reduce) {
  #waveBar .wb.warn { animation: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--danger) 45%, transparent); }
  #waveBar.end::after { animation: none; opacity: .5; }
}
#prepBar .prt { font-size: 13px; color: var(--dim); }
#prepBar .prt b { font: 20px var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }
#prepBar .btn { height: 38px; padding: 0 14px; }
.slot.dormant { opacity: .45; filter: grayscale(.85); }
.acts.plock .btn { opacity: .4; }
.modal.testm { gap: 8px; padding: 12px; }
.testm .wm-head { align-items: center; }
.testm .wm-head h2 { font: 22px/1 var(--font-display); flex: none; }
.tmsg { flex: 1; min-width: 0; font-size: 12px; color: var(--accent-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnow { margin-left: 4px; color: var(--ink); font-variant-numeric: tabular-nums; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tgrid .btn { height: 40px; min-width: 0; white-space: nowrap; }
.tchk { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; min-width: 0; border: 1.5px solid var(--line); border-radius: 5px; background: var(--panel-2); font: 600 13.5px var(--font-body); white-space: nowrap; text-align: left; }
.tbox { flex: none; width: 18px; height: 18px; border: 1.5px solid var(--dim); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: var(--on-accent); }
.tchk.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); }

.twp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tbp { margin-top: 6px; } .tbp svg { width: 28px; height: 28px; }   /* 테스트: 부를 보스 고르기 */
.twb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 50px; min-width: 0; border: 1.5px solid var(--line); border-radius: 5px; background: var(--panel-2); }
.twb small { font-size: 11px; line-height: 1.1; white-space: nowrap; }
.twb.off { opacity: .42; }

@media (max-height: 660px) { .tgrid .btn, .tchk { height: 36px; } .twb { height: 44px; } .modal.testm { gap: 7px; } }

/* 황금 웨이브와 티켓 (T11②). --gold 는 전설 등급(--g3)의 주황과 헷갈리지 않는 노란 금색 */
.gtag, .info b.gtag, #toast b.gtag { color: var(--gold); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; font-size: 10.5px; }
.ctag { color: var(--crate); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; font-size: 10.5px; }
.cell.kt { border-color: var(--gold); color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, var(--panel)); }
.cell.kt svg { display: block; }
.btn.primary.gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.rw.gold .rw-l { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
#genHave { display: inline-block; }
#genHave.cbump { animation: cbump .24s ease-out; }
@keyframes cbump { 0% { transform: scale(1); } 35% { transform: scale(1.2); filter: brightness(1.25); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { #genHave.cbump { animation: none; } }
.testm .btn.on { border-color: var(--accent); color: var(--accent-ink); }   /* 테스트: 열린 보스 고르기 */
/* ---------- 대장간 (T13e) ---------- */
/* 아래 행동줄: 생성 + 대장간 */
.acts.gf { grid-template-columns: 1.25fr 1fr; }
.acts.gf .btn { min-width: 0; white-space: nowrap; }
.btn.forge { gap: 8px; font: 19px var(--font-display); color: var(--ink); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.btn.forge svg { color: var(--accent-ink); flex: none; }
.btn.forge.hint { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent), inset 0 0 8px color-mix(in srgb, var(--accent) 22%, transparent); animation: hintglow 1.8s ease-in-out infinite; }
.btn.forge.pulse { animation: got .6s ease-out; }
@media (prefers-reduced-motion: reduce) { .btn.forge.hint, .btn.forge.pulse { animation: none; } }
/* 창 */
.modal.fg { gap: 8px; padding: 12px; }
.fg-head { align-items: center; }
.fg-head .nm { display: flex; align-items: center; gap: 7px; font: 24px/1.1 var(--font-display); }
.fg-head .nm svg { color: var(--accent-ink); }
.fg-tabs { display: grid; grid-template-columns: repeat(3, 1fr); flex: none; border: 1.5px solid var(--line); border-radius: 7px; overflow: hidden; }
.fg-tabs button { height: 38px; display: flex; align-items: center; justify-content: center; gap: 5px; font: 600 14px var(--font-body); color: var(--dim); background: var(--panel); border-right: 1px solid var(--line); }
.fg-tabs button:last-child { border-right: 0; }
.fg-tabs button svg { flex: none; }
.fg-tabs button[data-ft="b"] svg { color: var(--ok); }
.fg-tabs button[data-ft="m"] svg { color: var(--melt); }
.fg-tabs button.on { color: var(--ink); background: color-mix(in srgb, var(--accent) 18%, var(--panel)); box-shadow: inset 0 -3px 0 var(--accent); }
.fg-tabs button:disabled { opacity: .4; }
.fg-chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; flex: none; }
.fg-chip { height: 52px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--shade); }
.fg-chip b { font: 14px var(--font-display); line-height: 1; white-space: nowrap; }
.fg-chip.empty { border-style: dashed; opacity: .5; }
.fg-chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); box-shadow: 0 0 0 1.5px var(--accent); }
.fg-chip.up-ok, .fg-card.up-ok { animation: fgok .75s ease-out; }
.fg-chip.up-no, .fg-card.up-no { animation: fgno .45s linear; }
@keyframes fgok { 0% { box-shadow: 0 0 0 0 rgba(122, 240, 193, .95); } 30% { transform: scale(1.08); } 100% { box-shadow: 0 0 0 22px rgba(122, 240, 193, 0); } }
@keyframes fgno { 0%, 100% { transform: none; } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.fg-card { flex: none; display: flex; flex-direction: column; gap: 7px; padding: 8px; border: 1.5px solid var(--line); border-radius: 8px; }
.fg-name { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.fg-name .nm { display: block; font: 22px/1.1 var(--font-display); }
.fg-name .st { display: block; font-size: 11.5px; color: var(--dim); }
.fg-name .btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
.fg-parts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.fg-parts.n4 { grid-template-columns: repeat(4, 1fr); }
.fpt { position: relative; height: 50px; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.05;
  border: 1.5px solid var(--line); border-radius: 5px; background: var(--panel); }
.fpt svg { flex: none; }

.fpt.empty { border-style: dashed; color: var(--dim); font-size: 11px; background: var(--bg); }
.fpt.g0 { border-color: var(--g0); color: var(--g0); }
.fpt.g1 { border-color: var(--g1); color: var(--g1); background: color-mix(in srgb, var(--g1) 16%, var(--panel)); }
.fpt.g2 { border-color: var(--g2); color: var(--g2); background: color-mix(in srgb, var(--g2) 18%, var(--panel)); }
.fpt.g3 { border-color: var(--g3); color: var(--g3); background: color-mix(in srgb, var(--g3) 20%, var(--panel)); }
.fg-card .wm-info { min-height: 34px; }
.fg-rec { font-size: 11px; color: var(--dim); }

/* 강화 버튼: 창 너비만큼, 보유 조각 · 필요 · 성공 확률 */
.btn.fg-up { flex: none; height: 60px; display: grid; grid-template-columns: auto 1.25fr .8fr 1fr; align-items: center; gap: 4px; padding: 0 12px; text-align: left; }
.fg-up .fl { font: 23px var(--font-display); padding-right: 8px; }

.fg-up .fv b { display: flex; align-items: center; gap: 3px; font: 18px var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fg-up .fv b svg { flex: none; }
.btn.fg-up.max { display: flex; justify-content: space-between; opacity: .55; }

.btn.primary.fg-wide .fd { color: color-mix(in srgb, var(--on-accent) 78%, transparent); }
.btn.primary.fg-wide .fd b { color: var(--on-accent); }

.fg-gauge { display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; color: var(--dim); }

.fgm .fg-card .gbar { height: 9px; border-radius: 5px; margin: 0; }
.fgm .odds { font-size: 11.5px; color: var(--dim); }
.fgm .odds .g1 { color: var(--g1); } .fgm .odds .g2 { color: var(--g2); } .fgm .odds .g3 { color: var(--g3); }

<body>
<div id="app">
  <header id="hud">
    <div class="hp" aria-label="기지 체력">
      <div class="hp-bar"><i id="hpFill"></i></div>
      <span id="hpTxt">100</span>
    </div>
    <div class="stat"><small>웨이브</small><b id="tTxt">1</b></div>
    <div class="stat"><small>처치</small><b id="kTxt">0</b></div>
    <button id="testBtn" type="button" data-act="testOpen" aria-label="테스트 창 열기" hidden>테스트</button>
    <button id="speedBtn" type="button" aria-label="게임 속도">1배</button>
    <button id="pauseBtn" type="button" aria-label="일시정지">II</button>
  </header>
  <div id="fieldWrap"><canvas id="field"></canvas></div>
  <div id="weapons"></div>
  <div id="bottom"></div>
  <div id="overlay" hidden></div>
</div>
<script>
/* 도형 디펜스: 게임 로직 (화면과 분리되어 있어 단독 실행 가능) */
(function (root) {
'use strict';

const LANES = 5, LW = 100, W = LANES * LW;
let H = 520;
const GRADES = ['일반', '희귀', '영웅', '전설'];
const CFG = {
  invSize: 15,        // 인벤토리 칸 수 (답답하면 여기만 바꾸면 됨)
  maxLv: 100,
  baseHp: 100,
  startGold: 80,

// 난수는 세 갈래다. rndS는 '어떤 적이 어디에 나오는가'만, rndG는 '전리품과 성장'(생성, 파츠 굴림, 제조, 보스 보상, 증강 선택지, 강화 성공/절약)만 정하고,
// rnd는 그 밖의 모든 것(치명타, 효과 등 전투)에 쓴다. rndG는 한 번 굴릴 때마다 정확히 한 번만 뽑고(subG), 그 값으로 하위 난수열을 만들어 쓴다.
// 그래서 시드가 같으면 전투와 상관없이 k번째 생성/굴림 결과가 같다. 시드가 없으면 Math.random 그대로다.
let rnd = Math.random;
let rndS = Math.random;
let rndG = Math.random;
let rndH = Math.random;   // 수리 장치의 회복 확률 전용: 체력에 따라 뽑는 횟수가 달라져도 전투 난수열(rnd)이 밀리지 않게 따로 둔다
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// n이 null이면 Math.random으로 되돌린다. 세 갈래는 서로 다른 파생 시드를 쓴다.
function seed(n) {
  if (n == null) { rnd = Math.random; rndS = Math.random; rndG = Math.random; rndH = Math.random; return; }
  rnd = mulberry32((n * 2654435761 + 0x1234567) | 0);
  rndS = mulberry32((n * 2246822519 + 0x7654321) ^ 0x5bd1e995);
  rndG = mulberry32((n * 3266489917 + 0x2545F491) ^ 0x3c6ef372);
  rndH = mulberry32((n * 2891336453 + 0x1b873593) ^ 0x85ebca6b);
}
// 전리품/성장 굴림 한 번당 rndG에서 값 하나만 뽑아, 그 굴림 안에서 쓸 하위 난수열을 만든다
function subG() { return mulberry32((rndG() * 4294967296) | 0); }
function pick(a, r) { return a[Math.floor((r || rnd)() * a.length)]; }
function wpick(ws, rr) {
  let t = 0; for (const w of ws) t += w;
  let r = (rr || rnd)() * t;
  for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; }
  return ws.length - 1;
}

/* ---------- 밸런스 수치 ---------- */
const BAL = {
  // L강에 도전할 때의 성공률 (1강 100% → 100강 10%, 초반에 더 빨리 감소)
  success(L) {
    if (L <= 1) return 1;
    const x = (L - 1) / 99;
    return 0.10 + 0.90 * Math.pow(1 - x, 1.1);
  },
  lvMul(L) { return Math.pow(1.05, L); },
  evoMul(L) { return Math.pow(1.03, L); },   // 진화한 무기: lvMul(100) x evoMul(진화 단계)
  // 적 체력 배수: 끊김 없는 식 하나. 초반에는 거의 오르지 않고, 이후 꾸준히 오르며 끝없이 계속된다
  // 지수 안의 (t/2400)^2 항은 후반 긴장감용: 10분 +6%, 20분 +28%, 30분 +75%, 40분 x2.7
  hpK: 321,         // hpMul 의 시간 상수(초). 전체 난이도는 이 값 하나로 맞춘다 (tools/surv.js 의 K 인자가 이 값을 바꾼다)
  hpMul(t) { return 1.2 * Math.pow(1 + Math.pow(t / BAL.hpK, 3.1), 0.9) * Math.exp(0.0013 * t + Math.pow(t / 3000, 2)); },   // 2026-11-24 사용자 요청: 기본 x1.2, 뒤로 갈수록 늘어나는 속도 살짝 더 (0.0012->0.0013, 3400->3000)
  bossHp: 2.86,     // 모든 보스의 체력 배수 (일반 적과 같은 hpMul 곡선에 곱한다)
  bossSpd: 0.85,    // 모든 보스의 이동 속도 배수
  // 기지가 받는 피해 배수: 적이 기지에 닿는 순간의 시간으로 곱한다 (5분 x1.27, 10분 x1.76, 20분 x3.15, 30분 x4.95)
  leakMul(t) { return 1 + Math.pow(t / 720, 1.5); },
  bossY: 0.14,      // 보스가 나타나는 높이 (전장 높이의 비율). 예고 동안 이 자리에 고정된다
  spawnRate(t) { return 0.5 + 5.5 * (1 - Math.exp(-t / 340)); },
  // 적 종류별 등장 가중치 [basic, runner, swarm, heavy]. 해금 뒤 서서히 늘어난다
  spawnWeights(t) {
    const ramp = (t0, W, tau) => t > t0 ? W * (1 - Math.exp(-(t - t0) / (tau || 120))) : 0;
    return [5, ramp(60, 4, BAL.runnerTau), ramp(150, 1.4), ramp(300, 4)];
  },
  runnerTau: 300,   // 달리는 적(runner) 비중이 늘어나는 시간 상수(초)
  // 초반에는 넉넉하고(시작 +35%) 시간이 갈수록 완만하게 줄어든다
  // 2026-11-21 사용자 결정: 황금체·보급 상자로 쉬워져 재화 전체 x0.9 (goldK)
  goldK: 0.81,
  goldMul(t) { return BAL.goldK * (1 + t / 80) * (0.63 + 0.72 * Math.exp(-t / 200)); },
  // 제조 비용: 이번 판에서 제조한 횟수 k(0부터)가 늘수록 오른다. 비용/100 = m 은 등급 굴림의 '뽑는 횟수'(craftOdds)
  craftCost(k) { return Math.round(CFG.craftCost * Math.pow(1 + 0.1 * k, 1.25)); },
  genCost(n) { return Math.round(10 * Math.pow(1 + 0.2 * n, 1.25)); },
  // 강화 조각 수는 낸 비용을 따라가되 비용보다 느리게 늘어난다 (비용이 10배면 조각은 약 8배)
  bundleExp: 0.9,
  bundle(cost, r) { return Math.max(3, Math.round((0.75 + (r || subG())() * 0.5) * 4.5 * Math.pow(cost / 10, BAL.bundleExp))); },
};

// 항목의 g등급 수치: 둘째 수치(w)가 있는 항목은 둘 다 넘긴다
const val = (D, g) => [D.v[g], D.w ? D.w[g] : undefined];
function partDesc(p) { const D = PARTS[p.id], x = val(D, p.g); return D.d(x[0], x[1]); }
function augDesc(a) { const D = AUGS[a.id], x = val(D, a.g); return D.d(x[0], x[1]); }

// 노드마다 고유한 효과(NEWSK)를 쓴다. 증강 효과를 나눠 담던 예전 방식(SR/SU/SC, skVals)은 T5d 에서 지웠다.
const SK_MAX = { root: 5, up: 5, cap: 1 };
const SK_COST = { root: 1, up: 1, cap: 3 };   // 노드 한 랭크를 찍는 데 드는 스킬 포인트. 궁극은 한 번에 3점 (사용자 결정 2026-11-21)
// 궁극(최상위) 노드는 포인트 3개를 쓰는 대신 핵심 수치에 CAP_M 배를 곱한다 (예전 궁극은 1점에 x1)
const CAP_M = 2;
const cm = () => CAP_M;
const streakF = (k) => 1 - (1 - STREAK_F) / cm(k);   // 연속 사냥: 랭크가 높을수록 줄어드는 폭이 천천히 감소
const poolR = (k, m) => { const x = m == null ? cm(k) : m; return 1 + (x - 1) / 2; };            // 작은 웅덩이 범위 배율 (지속은 cm)
const r1 = (n) => +(Math.round(n * 100) / 100);
const mkNode = (id, t, o) => Object.assign({ id, t, max: SK_MAX[t], cost: SK_COST[t] }, o);
// 새 노드: 이름, 설명 d(랭크, 배율), 효과 ap(s, 랭크, 배율). 배율(sc)은 줄마다 하나, 피해 같은 세기 수치에만 곱한다(메커니즘은 그대로)

// 재장전은 예열 초기화(1.5초)보다 짧아 예열이 유지된다
const SPRAY_ON = 2.4, SPRAY_RL = 1.2, SPRAY_K = 2.5;

//   T10b: 이어서 처치할수록 줄어드는 폭이 STREAK_F 배씩 작아진다 (처치하지 못하면 처음부터). 다른 무기가 깎아 주는 팀이나 물량에서는 처치가 끝없이 이어져
//   대기 -70% 가 계속 걸리면 다른 줄의 두 배 가까이 셌다 (섞인 팀 2.85 대 1.46)

const SNW = (id, t) => mkNode(id, t, { nw: NEWSK[id], sc: 1 });
// 줄: 이름, 노드 3개, 세기 배율(sc). 배율은 tools/balance_log.md 에 기록한다
const LINE = (name, nodes, sc) => { nodes.forEach((n) => { if (n.nw) n.sc = sc == null ? 1 : sc; }); return { name, nodes }; };
const SC_RAIL = [2, 0.3, 1];   // 저격포 줄 배율 (T5c: 첫 값으로 한 번 잰 측정에 계산기 계수를 맞추고 계산기로 정함. T9d: 과잉 살상 1 -> 2 와 점사 줄은 측정으로 정함)
const SC_ACID = [0.25, 0.75, 0.21];   // 산성 분사기 줄 배율 (T5d: 첫 값으로 한 번 잰 측정에 계산기 계수를 맞추고 계산기로 정함. T10e: 부식 겹과 함께 섞인 팀 측정으로 다시 정함 0.5, 1.4, 0.5 ->)

  blaster: [LINE('개틀링', [SNW('gatling', 'root'), SNW('warm', 'up'), SNW('spray', 'cap')], 0.9),

function skName(n) { return n.nw.name; }
function skDesc(n, k) { return n.nw.d(k, n.sc); }
function skApply(s, n, k) { if (k > 0) n.nw.ap(s, k, n.sc); }
function applySkills(w, s) {
  const tree = SKILLS[w.type], rk = w.sk;
  if (!tree || !rk) return;
  for (let l = 0; l < 3; l++) for (let t = 0; t < 3; t++) skApply(s, tree[l].nodes[t], rk[l][t] || 0);
}

function skillPoints(w) {
  let spent = 0; if (w.sk) for (let li = 0; li < w.sk.length; li++) for (let t = 0; t < 3; t++) spent += (w.sk[li][t] || 0) * SK_COST[SKILLS[w.type][li].nodes[t].t];
  const total = w.evo ? (w.skp || 0) : 0;
  return { total, spent, left: total - spent };
}
function skillRank(w, line, tier) { return w.evo && w.sk ? w.sk[line][tier] || 0 : 0; }
// 노드 상태: {node, rank, max, locked, can, reason}
function skillInfo(w, line, tier) {
  const n = SKILLS[w.type][line].nodes[tier], rank = skillRank(w, line, tier);
  const o = { node: n, name: skName(n), rank, max: n.max, cost: n.cost, locked: false, can: false, reason: '' };
  if (tier > 0 && skillRank(w, line, tier - 1) < SKILLS[w.type][line].nodes[tier - 1].max) { o.locked = true; o.reason = 'lock'; }
  else if (rank >= n.max) o.reason = 'max';
  else if (skillPoints(w).left < n.cost) o.reason = 'points';

}

  const w = S.slots[slot];
  if (!w || !w.evo || S.over) return { ok: false, reason: 'none' };
  if (!(line >= 0 && line < 3 && tier >= 0 && tier < 3)) return { ok: false, reason: 'none' };
  const i = skillInfo(w, line, tier);
  if (!i.can) return { ok: false, reason: i.reason };

}

  const o = { ok: false, reason: '', cost, have };
  if (!w) o.reason = 'none';
  else if (w.evo) o.reason = 'evo';
  else if (w.lv < CFG.maxLv) o.reason = 'lv';
  else if (S.over || S.pendingAug || S.pendingPact) o.reason = 'busy';

}

}
// 바깥 요인(부식, 도박사, 유물)으로 진화한 무기가 n단계를 잃는다. 0 아래로 내려가면 진화가 풀려 100강 일반 무기가 된다 (스킬과 포인트는 사라지고 조각은 돌려받지 못한다)
function evoLose(w, n, slot) {
  w.hi = Math.max(w.hi || 0, w.lv);
  if (w.lv - n >= 0) { w.lv -= n; dirty(w); return { devo: false }; }

function stats(w) {

  s.dmg = d.dmg * (w.evo ? BAL.lvMul(CFG.maxLv) * BAL.evoMul(lv) : BAL.lvMul(lv)) * Math.max(0.2, 1 + s.dmgPct);

  if (hasPact('overheat')) s.cd /= PACT.heatRate;
  if (s.gat) s.dmg *= 1 - 0.05 * s.gat;   // 개틀링 포신: 탄 피해 -5%/랭크 (다른 효과를 모두 적용한 뒤)

  s.lanes = Math.min(5, s.lanes);

      const nuke = st.nuke > 0 && w.n % st.nukeEvery === 0;   // 핵탄두 차례 (연쇄 핵: 2번째마다)
      fx({ k: 'smoke', d: 0.7, x: wx, y: wy - 14, r: 20 });   // 발사 연기
      if (st.msl) {                          // 추적 미사일 (쌍발: 둘째는 기지에 두 번째로 가까운 적. 핵탄두 차례에는 핵 미사일 1발)
        const two = st.mslTwin && !nuke;
        missile(wx, wy, t, st, 1, nuke, two ? -1 : w.n % 2 ? 1 : -1);
        if (two) {
          let t2 = null;
          for (const e of S.enemies) if (!e.dead && e !== t && e.y + e.r > 0 && (!t2 || e.y > t2.y)) t2 = e;
          missile(wx, wy, t2 || t, st, st.mslTwin, false, 1);
        }
        return true;
      }
      if (st.carpet && !nuke) {              // 융단 폭격: 표적 레인을 따라 위쪽으로 한 줄 (뒤따라오는 적 쪽)
        const tx = Math.max(10, Math.min(W - 10, t.x)), gap = st.blast;
        for (let k = 0; k < st.carpet; k++) {
          const dur = 0.55 + k * 0.07, ty = Math.min(H - 6, t.y + t.speed * H * dur) - k * gap;
          if (ty < 10) break;
          S.shells.push({ x0: wx, y0: wy, tx, ty, p: 0, dur, st, dmg: st.dmg * st.carpetD, R: st.blast * 0.8, cb: k + 1 });   // cb: 융단 폭격 몇 번째 (화면용)
        }
        return true;
      }
      const dur = 0.55;
      S.shells.push({ x0: wx, y0: wy, tx: Math.max(10, Math.min(W - 10, t.x)), ty: Math.min(H - 6, t.y + t.speed * H * dur), p: 0, dur, st,
        dmg: st.dmg * (nuke ? st.nuke : 1), R: nuke ? st.blast * st.nukeR : 0, nuke: nuke ? 1 : 0 });
      return true;
    }
    case 'tesla': {
      const first = nearestPref(wx, st); if (!first) return false;
      w.n++;
      const starts = [first];
      if (st.multi) {
        const bq = baseReach(st);
        let rest = bq ? S.enemies.filter(e => e !== first && inReach(e, wx, bq)) : [];
        if (!rest.length) rest = S.enemies.filter(e => e !== first && inReach(e, wx, st));
        rest.sort((a, b) => b.y - a.y);
        for (let k = 0; k < st.multi && k < rest.length; k++) starts.push(rest[k]);
      }
      const done = starts.slice();
      for (const s0 of starts) {
        let cur = s0, dmg = s0 === first ? st.dmg : st.dmg * 0.5, px = wx, py = wy;
        const pts = [[px, py]], seq = [];
        for (let j = 0; j <= st.chain && cur; j++) {
          pts.push([cur.x, cur.y]); seq.push(cur);
          hit(cur, dmg, st);
          dmg *= st.chainGrow ? 1 + st.chainGrow : 0.8;
          px = cur.x; py = cur.y;
          let nx = null, bd = st.jump;
          for (const e of S.enemies) {
            if (e.dead || e.y + e.r <= 0 || done.indexOf(e) >= 0) continue;
            const dd = Math.hypot(e.x - px, e.y - py) - e.r * 0.5;
            if (dd <= bd) { bd = dd; nx = e; }
          }
          cur = nx; if (cur) done.push(cur);
        }
        fx({ k: 'bolt', d: 0.14, pts, c: st.color });
        if (st.arc) for (let j = 1; j < seq.length; j++) arcLink(w, seq[j - 1], seq[j], st);   // 전류 사슬: 연쇄된 적 사이에 남는 줄
      }
      if (st.th && w.n % 3 === 0) {          // 낙뢰: 3번째 공격마다 무작위 적에게
        const pool = S.enemies.filter(e => !e.dead && e.y + e.r > 0);
        for (let k = 0; k < st.th && pool.length; k++) strike(w, pool.splice(Math.floor(rnd() * pool.length), 1)[0], st.dmg * st.thD, st, null);
      }
      if (st.ball && w.n % (st.ballTwin ? BALL_N2 : 4) === 0) launchBall(w, wx, wy, first, st);   // 구전: 4번째 공격마다 (쌍구전: BALL_N2 번째마다 둘)
      return true;
    }
    case 'rail': {                             // 저격포: 체력이 가장 많은 적을 고르고, 0.25초 조준선을 보인 뒤 발사
      const pool = S.enemies.filter(e => !e.dead && e.y + e.r > 0).sort((a, b) => b.hp - a.hp);
      if (!pool.length) return false;
      w.n++;
      setAim(w, railTarget(w, pool, st), wx, wy, st);
      return true;
    }
    case 'acid': {                             // 산성 분사기: 전장의 무작위 적 위치에 산성 웅덩이를 던진다
      const live = S.enemies.filter(e => !e.dead && e.y + e.r > 0);
      if (!live.length) return false;
      w.n++;
      for (let k = 0, n = 1 + st.aMulti; k < n && live.length; k++) {
        const e = live.splice(Math.floor(rnd() * live.length), 1)[0], dur = 0.5 + k * 0.08;
        S.shells.push({ acid: 1, x0: wx, y0: wy, tx: Math.max(10, Math.min(W - 10, e.x)), ty: Math.max(20, Math.min(H - 30, e.y + e.speed * H * dur)), p: 0, dur, st });
      }
      return true;
    }
  }
  return false;
}

/* ---------- 전격기 스킬: 낙뢰, 전기장, 먹구름, 전기 줄, 구전 ---------- */
// 저장되지 않는 참조 (미사일의 표적과 같은 방식)
function hide(o, k, v) { Object.defineProperty(o, k, { value: v, writable: true, configurable: true, enumerable: false }); }
const EF_R = 45, EF_T = 2;                  // 전기장 반경, 유지 시간
// 먹구름의 자리: 전장 위쪽에서 무기 레인 둘레를 천천히 오간다 (화면 표시와 낙뢰의 출발점이 같은 식을 쓴다)
function cloudPos(slot, t, out) {
  out = out || [0, 0];
  out[0] = Math.max(60, Math.min(W - 60, (slot + 0.5) * LW + Math.sin(t * 0.23 + slot * 1.7) * LW * 1.1));
  out[1] = 46 + 6 * Math.sin(t * 0.41 + slot);
  return out;
}
// 낙뢰 한 줄기: 피해, 연출, 전기장. from: 출발점 [x, y] (없으면 하늘 위)
function strike(w, e, dmg, st, from) {
  const x = e.x, y = e.y;
  hit(e, dmg, st);
  fx({ k: 'thunder', d: 0.36, x, y, x0: from ? from[0] : x + (rnd() - 0.5) * 70, y0: from ? from[1] : -10, c: st.color, cl: from ? 1 : 0 });
  snd('thunder');
  if (st.efD) S.pools.push({ kind: 'efield', wk: w, x, y, r: EF_R * (1 + st.areaPct), t: EF_T, d: EF_T, dps: st.dmg * st.efD, st, c: st.color, sd: rnd() });
}
// 같은 무기의 전기장, 줄, 구체는 (종류마다) 겹쳐도 적 하나에게 한 스텝에 한 번만 피해를 준다. 한 틱에 때리는 적은 최대 타격 수까지
function gotOf(seen, w) { let g = seen.get(w); if (!g) seen.set(w, g = new Set()); return g; }
function fieldTick(p, dt, seen) {
  const got = gotOf(seen, p.wk), list = CAND, m = p.r + 40; list.length = 0;   // m: 가장 큰 적의 반지름 절반보다 넉넉히. 먼 적은 집합 조회 전에 거른다
  for (let i = 0, n = S.enemies.length; i < n; i++) {
    const e = S.enemies[i], dx = e.x - p.x, dy = e.y - p.y;
    if (dx > m || dx < -m || dy > m || dy < -m) continue;
    if (!e.dead && e.y + e.r > 0 && within(dx, dy, p.r + e.r * 0.5) && !got.has(e)) list.push(e);
  }
  capPick(list, p.st.cap);
  for (let i = 0, n = list.length; i < n; i++) { const e = list[i]; got.add(e); dot(e, p.dps * dt, p.st); }
}
// 전기 줄: 연쇄된 두 적을 잇고 따라 움직인다 (적이 죽으면 그 자리에 남는다). 같은 두 적을 다시 이으면 시간만 새로. 무기마다 최대 ARC_MAX 개
const ARC_MAX = 16, ARC_HW = 7;
function arcLink(w, a, b, st) {
  const T = st.arcT, dps = st.dmg * st.arc * (1 + st.arcHv), hw = ARC_HW * st.arcW;
  let n = 0, old = -1;
  for (let i = 0, m = S.pools.length; i < m; i++) {
    const q = S.pools[i]; if (q.kind !== 'arc' || q.wk !== w) continue;
    if ((q.ea === a && q.eb === b) || (q.ea === b && q.eb === a)) { q.t = q.d = T; q.dps = dps; q.hw = hw; q.st = st; q.hv = st.arcHv; return q; }
    n++; if (old < 0 || q.t < S.pools[old].t) old = i;
  }
  const p = { kind: 'arc', wk: w, x0: a.x, y0: a.y, x1: b.x, y1: b.y, t: T, d: T, dps, hw, st, c: st.color, hv: st.arcHv, sd: rnd() };
  hide(p, 'ea', a); hide(p, 'eb', b);
  if (n >= ARC_MAX) S.pools[old] = p; else S.pools.push(p);
  return p;
}
function arcTouch(p, got) {                 // 줄에 닿은 적 (got 에 있는 적은 뺀다), 최대 타격 수까지
  const m = p.hw + 40, list = CAND; list.length = 0;
  const x0 = Math.min(p.x0, p.x1) - m, x1 = Math.max(p.x0, p.x1) + m, y0 = Math.min(p.y0, p.y1) - m, y1 = Math.max(p.y0, p.y1) + m;
  for (let i = 0, n = S.enemies.length; i < n; i++) {
    const e = S.enemies[i];
    if (e.x < x0 || e.x > x1 || e.y < y0 || e.y > y1) continue;
    if (e.dead || e.y + e.r <= 0) continue;
    if (segDist(e.x, e.y, p.x0, p.y0, p.x1, p.y1) <= p.hw + e.r * 0.5 && !(got && got.has(e))) list.push(e);
  }
  capPick(list, p.st.cap);
  return list;
}
function arcTick(p, dt, seen) {
  const a = p.ea, b = p.eb;
  if (a && !a.dead) { p.x0 = a.x; p.y0 = a.y; }
  if (b && !b.dead) { p.x1 = b.x; p.y1 = b.y; }
  const got = gotOf(seen, p.wk), list = arcTouch(p, got);
  for (let i = 0, n = list.length; i < n; i++) { const e = list[i]; got.add(e); dot(e, p.dps * dt, p.st); }
  if (p.t <= 0 && p.hv) {                   // 고압 방전: 사라질 때 줄을 따라 한 번에 (줄 피해 1초어치)
    const all = arcTouch(p, null).slice();
    for (const e of all) hit(e, p.dps, p.st, true);
    fx({ k: 'arcz', d: 0.3, x0: p.x0, y0: p.y0, x1: p.x1, y1: p.y1, c: p.st.color });
  }
}
// 구전: 천천히 떠가는 번개 구체. 벽에 닿으면 튕긴다. 쌍구전이면 (BALL_N2 번째 공격마다) 둘이 좌우로 갈라지고 사라질 때 크게 터진다 (T10c)
const BALL_SPD = 70, BALL_SPLIT = 0.42;
function launchBall(w, wx, wy, tg, st) {
  const a0 = Math.atan2(tg.x - wx, wy - 10 - tg.y), n = st.ballTwin ? 2 : 1;   // 0 = 위쪽
  for (let k = 0; k < n; k++) {
    const a = a0 + (n > 1 ? (k ? BALL_SPLIT : -BALL_SPLIT) : 0);
    S.pools.push({ kind: 'ball', wk: w, x: wx, y: wy - 10, vx: Math.sin(a) * BALL_SPD, vy: -Math.cos(a) * BALL_SPD, r: st.ballR * (1 + st.areaPct), t: st.ballT, d: st.ballT,
      dps: st.dmg * st.ball, st, c: st.color, boom: st.ballTwin ? st.dmg * st.ballBoom : 0, sd: rnd() });
  }

}
function ballTick(p, dt, seen) {
  p.x += p.vx * dt; p.y += p.vy * dt;
  const m = p.r * 0.5;
  if (p.x < m) { p.x = m; p.vx = Math.abs(p.vx); } else if (p.x > W - m) { p.x = W - m; p.vx = -Math.abs(p.vx); }
  if (p.y < m) { p.y = m; p.vy = Math.abs(p.vy); } else if (p.y > H - m) { p.y = H - m; p.vy = -Math.abs(p.vy); }
  const got = gotOf(seen, p.wk), list = CAND, mm = p.r + 40; list.length = 0;
  for (let i = 0, n = S.enemies.length; i < n; i++) {
    const e = S.enemies[i], dx = e.x - p.x, dy = e.y - p.y;
    if (dx > mm || dx < -mm || dy > mm || dy < -mm) continue;
    if (!e.dead && e.y + e.r > 0 && within(dx, dy, p.r + e.r * 0.5) && !got.has(e)) list.push(e);
  }
  capPick(list, p.st.cap);
  for (let i = 0, n = list.length; i < n; i++) { const e = list[i]; got.add(e); dot(e, p.dps * dt, p.st); }
  if (p.t <= 0 && p.boom) {                 // 쌍구전: 사라질 때 터진다 (최대 타격 수까지, 기절은 보스 제외)
    const st = p.st, R = BALL_BOOM_R * (1 + st.areaPct), all = [];

    capPick(all, st.capBig);   // 큰 한 방 (T10c)
    bigFrom(p.x, p.y, 'ball');
    for (const o of all) { hit(o, p.boom, st, true); if (!o.boss && !o.dead && !ghW(st)) o.stunT = Math.max(o.stunT, BALL_STUN); }
    bigFrom(null);
    fx({ k: 'ballboom', d: 0.55, x: p.x, y: p.y, r: R, c: st.color });

  }

// 역장의 반경 (파동 범위의 배수). T9a: 0.7 에서 1.5 로 넓히고 끌어당김은 초당 6·r 에서 3·r 로 약하게 (파동보다 넓어 옆 레인의 적을 파동 안으로 끌어온다)
const FLD_R = 1.5;
// 프리즘 (T9a): 갈라지는 점은 본줄기 위(레인 가운데, 첫 적의 높이)다. 가지는 비스듬히 옆 레인 가운데로 뻗은 뒤 그 레인을 따라 위로 꺾인다(나뭇가지).
// 무지개: 옆 레인 가지가 조금 위에서 한 번 더 갈라져 바깥 레인으로 (가운데 무기면 양쪽에 두 갈래씩). 맞는 적은 그 레인에서 꺾이는 점(조금 아래까지)보다 위
const PR_RISE = 50, PR_GAP = 40;
function prismSplit(w, slot, st, first, m) {
  const one = oneLane(st), top = H - st.range * H, base = st.dmg * m * (st.prism + st.prismUp), wx = (slot + 0.5) * LW;
  for (let side = -1; side <= 1; side += 2) {

    const step = Math.min(PR_RISE + PR_GAP, Math.max(16, (first.y - top - 16) / (n + 0.2))), rise = step * PR_RISE / (PR_RISE + PR_GAP);
    let px = wx + side * st.lanes * LW, py = first.y;
    for (let d = 1; d <= n; d++) {
      const j = slot + side * (st.lanes + d); if (j < 0 || j >= LANES) break;
      const cx = (j + 0.5) * LW, bend = Math.max(top + 4, py - rise), mul = d === 1 ? 1 : 0.6;
      const pl = [];
      for (const e of S.enemies) if (!e.dead && e.y < first.y && e.y < bend + 20 && inReach(e, cx, one)) pl.push(e);
      const cut = capPick(pl, st.cap);       // 갈라진 빔 하나도 최대 타격 수까지
      for (const e of pl) hit(e, base * mul, st);
      fx({ k: 'dbeam', d: 0.2, x0: px, y0: py, xb: cx, yb: bend, x1: cx, y1: cut ? Math.min(bend - 4, Math.max(top, capTop(pl))) : top, ab: cut ? 1 : 0, c: st.color, rb: st.rainbow ? (side < 0 ? d : d + 4) : 0 });
      px = cx; py = bend - (step - rise);    // 다음 가지는 이 레인 줄기에서 조금 위로 올라간 자리에서 갈라진다
    }
  }
}
// 초신성: 큰 범위에 큰 피해, 잔광(빛의 고리)이 남는다
function novaBlast(slot, st, mult, flash) {
  const wx = (slot + 0.5) * LW, R2 = st.radius * st.novaR, list = [];
  for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && within(e.x - wx, e.y - H, R2 + e.r * 0.5)) list.push(e);
  capPick(list, st.capBig);   // 큰 한 방: 최대 타격 수 x BIG_CAP (T10c)

  bigFrom(null);
  fx({ k: 'ring', d: 0.8, x: wx, y: H, r: R2, c: st.color, fat: 1, nova: flash ? 1 : 2 });   // nova: 1 첫 폭발, 2 쌍성의 두 번째 (화면이 따로 그린다)
  if (st.halo) keepPool('halo', st.w, slot, (p) => { p.x = wx; p.y = H; p.r = R2; p.t = HALO_T; p.big = 1; p.dps = st.dmg * st.halo; p.st = st; p.c = st.color; });   // big: 초신성 범위라 최대 타격 수 x BIG_CAP
}
// 반격: 적이 기지에 닿을 때 파동 1회
function counterPulse(slot, st) {
  const wx = (slot + 0.5) * LW, list = [];
  for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && within(e.x - wx, e.y - H, st.radius + e.r * 0.5)) list.push(e);
  capPick(list, st.cap);
  for (const e of list) hit(e, st.dmg * st.counter, st);
  fx({ k: 'pulse', d: 0.4, x: wx, y: H, r: st.radius, c: '#ffffff' });

}

// 저격포 조준: 표적과 시간은 무기에 저장한다 (표적은 저장 데이터에 들어가지 않게 숨김 속성으로)
const RAIL_AIM = 0.25;
function setAim(w, t, wx, wy, st) {
  w.aimT = RAIL_AIM;
  Object.defineProperty(w, 'aim', { value: t, writable: true, configurable: true, enumerable: false });
  const f = fx({ k: 'aim', d: RAIL_AIM, x0: wx, y0: wy, x1: t.x, y1: t.y, c: st.color });
  Object.defineProperty(w, 'aimFx', { value: f, writable: true, configurable: true, enumerable: false });
}
// 저격 한 발 (주 표적, 이중 저격, 점사의 뒤 발): 관통 저격, 저격선, 피해, 과잉 살상. bu: 점사 무기의 발 (화면: 총구 불꽃, 탄피)
function snipe(w, wx, wy, t, mul, main, st, pool, used, bu) {
  const tx = t.x, ty = t.y, dx = tx - wx, dy = ty - wy, len = Math.hypot(dx, dy) || 1;
  let ex = tx, ey = ty;
  if (st.through) {                      // 관통 저격: 표적 뒤 일직선상의 적도 맞힌다
    const ux = dx / len, uy = dy / len;
    for (const o of S.enemies) {
      if (o === t || o.dead || o.y + o.r <= 0) continue;
      const ox = o.x - wx, oy = o.y - wy, pr = ox * ux + oy * uy;
      if (pr > len && Math.abs(ox * uy - oy * ux) <= o.r + 4) hit(o, st.dmg * mul * st.through, st);
    }
    ex = wx + ux * 1200; ey = wy + uy * 1200;
  }
