<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b3a72">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="도형 디펜스">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>도형 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 설계도 콘셉트: 짙은 청색 도면 위에 선으로 그린 도형. 세로 4단(상태, 전장, 무기 5칸, 인벤토리) */
  color-scheme: dark;
  --bg: #1b3a72;
  --panel: #23498a;
  --panel-2: #2c569f;
  --line: rgba(190, 215, 255, .28);
  --ink: #e9f0ff;
  --dim: #b4c6e6;
  --accent: #ffd166;
  --accent-ink: #ffd166;   /* 밝은 바탕 위의 글자용 강조색 */
  --on-accent: #1c1503;
  --backdrop: #132c5a;
  --shade: rgba(0, 0, 0, .18);
  --overlay: rgba(10, 24, 54, .78);
  --toast: rgba(22, 48, 98, .92);
  --shadow: #000;
  --hatch: rgba(255, 255, 255, .07);
  --sheen: rgba(255, 244, 214, .55);
  --melt: #ffb37a;
  --melt-fill: #ff9f5a;
  --danger: #ff5d5d;
  --ok: #7af0c1;
  --g0: #aab6cc;
  --g1: #5cb8ff;
  --g2: #c48bff;
  --g3: #ffa63d;
  --font-display: 'Do Hyeon', 'IBM Plex Sans KR', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --slot-h: 76px;
  --cell-h: 40px;
}
@media (min-height: 760px) { :root { --slot-h: 88px; --cell-h: 48px; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--backdrop); color: var(--ink);
  font: 400 13px/1.35 var(--font-body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
b { font-weight: 600; }
.g0 { color: var(--g0); } .g1 { color: var(--g1); } .g2 { color: var(--g2); } .g3 { color: var(--g3); }

#app {
  position: relative; height: 100%; max-width: 480px; margin: 0 auto;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
  background: var(--bg);
}

/* 상태 표시 */
#hud {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.hp { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
.hp-bar { flex: 1; height: 10px; border: 1px solid var(--line); background: var(--shade); border-radius: 2px; overflow: hidden; }
.hp-bar i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .15s; }
.hp-bar i.low { background: var(--danger); }
#hpTxt { font: 16px var(--font-display); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; }
.stat small { font-size: 10px; color: var(--dim); }
.stat b { font: 16px var(--font-display); font-variant-numeric: tabular-nums; }
.stat.gold b { color: var(--accent-ink); }
#pauseBtn, #speedBtn { width: 38px; height: 34px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; color: var(--dim); }
#speedBtn.on { color: var(--on-accent); background: var(--accent); border-color: var(--accent); font-weight: 600; }

/* 전장 */
#fieldWrap { position: relative; min-height: 0; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* 무기 5칸: 전장의 5개 레인과 세로로 정렬 */
#weapons {
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--panel); border-top: 2px solid var(--line); border-bottom: 1px solid var(--line);
}
.slot {
  position: relative; height: var(--slot-h); margin: 4px 3px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 1.5px solid var(--line); border-radius: 6px; background: var(--shade);
}
.slot.empty { border-style: dashed; }
.slot .plus { font: 22px var(--font-display); color: var(--dim); opacity: .5; }
.slot .lv { font: 15px var(--font-display); line-height: 1; }
.slot.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.slot.tg { border-color: var(--ok); border-style: dashed; animation: blink .8s linear infinite; }
@keyframes blink { 50% { background: color-mix(in srgb, var(--ok) 20%, transparent); } }
.pips { display: flex; gap: 3px; height: 6px; }
.pips i { width: 8px; height: 6px; border: 1px solid var(--line); }
.pips i.pa { width: 6px; border-radius: 50%; }
.slot .pop {
  position: absolute; left: 50%; top: -4px; transform: translate(-50%, 0); white-space: nowrap; pointer-events: none;
  font: 15px var(--font-display); animation: rise .7s ease-out forwards; z-index: 2;
  text-shadow: 0 1px 0 var(--shadow), 0 0 6px var(--shadow);
}
.slot .pop.ok { color: var(--ok); } .slot .pop.no { color: var(--danger); }
@keyframes rise { to { transform: translate(-50%, -26px); opacity: 0; } }
.slot.flash-ok { border-color: var(--ok); } .slot.flash-no { border-color: var(--danger); }

/* 하단: 인벤토리 또는 무기 상세 */
#bottom { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.info { height: 34px; font-size: 12px; line-height: 17px; color: var(--dim); overflow: hidden; }
.info b { color: var(--ink); }
.info .g0 { color: var(--g0); } .info .g1 { color: var(--g1); } .info .g2 { color: var(--g2); } .info .g3 { color: var(--g3); }
.info.warn { color: var(--accent-ink); }
.inv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.cell {
  position: relative; height: var(--cell-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  border: 1.5px solid var(--line); border-radius: 5px; background: var(--panel); line-height: 1.05;
}
.cell.empty { background: var(--shade); border-style: dashed; }
.cell b { font: 13px var(--font-display); font-variant-numeric: tabular-nums; }
.cell small { font-size: 9px; color: var(--dim); }
.cell .ab { font: 15px var(--font-display); }
.cell svg { flex: none; }
.cell.kp.g0 { border-color: var(--g0); color: var(--g0); }
.cell.kp.g1 { border-color: var(--g1); color: var(--g1); background: color-mix(in srgb, var(--g1) 12%, var(--panel)); }
.cell.kp.g2 { border-color: var(--g2); color: var(--g2); background: color-mix(in srgb, var(--g2) 14%, var(--panel)); }
.cell.kp.g3 { border-color: var(--g3); color: var(--g3); background: color-mix(in srgb, var(--g3) 16%, var(--panel)); }
.cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.new { animation: got .5s ease-out; }
@keyframes got { from { transform: scale(1.18); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent); } }

.acts { display: grid; grid-template-columns: 1fr; gap: 6px; }
.acts.two { grid-template-columns: 1.5fr 1fr; }
.slot, .cell { touch-action: none; -webkit-touch-callout: none; }
.ghost {
  position: fixed; z-index: 20; pointer-events: none; transform: translate(-50%, -85%) scale(1.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.05;
  border: 2px solid var(--accent); border-radius: 6px; background: var(--panel-2); box-shadow: 0 8px 20px rgba(0, 0, 0, .45);
}
.ghost b { font: 14px var(--font-display); } .ghost small { font-size: 9px; } .ghost .ab { font: 16px var(--font-display); }
.ghost .pips, .ghost .pop { display: none; }
#app.dragging .slot, #app.dragging .cell { border-style: dashed; }
#app.dragging .over { border-color: var(--accent); border-style: solid; background: color-mix(in srgb, var(--accent) 22%, transparent); }
.dragsrc { opacity: .3; }
.btn {
  height: 42px; border-radius: 5px; border: 1.5px solid var(--line); background: var(--panel-2);
  font: 600 14px var(--font-body); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px;
}
.btn small { font-weight: 400; font-size: 11px; color: var(--dim); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary small { color: color-mix(in srgb, var(--on-accent) 75%, transparent); }
.btn.primary b { font: 16px var(--font-display); }
.btn.off { opacity: .42; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:active { transform: translateY(1px); }

/* 무기 창 */
.d-acts { display: grid; grid-template-columns: 1.7fr 1fr; gap: 6px; }
.wm { gap: 8px; }
.wm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.wm-head .nm { display: block; font: 24px/1.1 var(--font-display); }
.wm-head .st { font-size: 11.5px; color: var(--dim); }
.wm-head .x { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; color: var(--ink); flex: none; }
.schem {
  position: relative; height: 178px; flex: none; border: 1px solid var(--line); border-radius: 6px;
  background-color: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 18px 18px; background-position: -1px -1px;
}
.schem .lab { position: absolute; left: 8px; top: 6px; font-size: 11px; color: var(--dim); }
.schem .wires { position: absolute; inset: 0; width: 100%; height: 100%; }
.schem .core {
  position: absolute; left: 50%; top: 54%; width: 86px; height: 86px; transform: translate(-50%, -50%);
  border: 2px solid; border-radius: 50%; background: var(--panel);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.schem .core b { font: 15px var(--font-display); }
.schem .pop {
  position: absolute; left: calc(100% + 44px); top: 30px; transform: translate(-50%, 0); white-space: nowrap; pointer-events: none;
  font: 26px var(--font-display); animation: rise .7s ease-out forwards; text-shadow: 0 1px 0 var(--shadow), 0 0 6px var(--shadow);
}
.schem .pop.ok { color: var(--ok); } .schem .pop.no { color: var(--danger); }
.pt {
  position: absolute; width: 94px; height: 48px; transform: translateX(-50%); gap: 1px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
  border: 1.5px solid var(--line); border-radius: 5px; background: var(--panel);
}
.pt b { font: 17px var(--font-display); }
.pt small { font-size: 10.5px; white-space: nowrap; }
.pt svg { flex: none; }
.pt.p0 { left: 50%; top: 5px; } .pt.p1 { left: 17%; bottom: 7px; } .pt.p2 { left: 83%; bottom: 7px; }
.pt.empty { border-style: dashed; color: var(--dim); font-size: 11px; background: var(--bg); }
.pt.g0 { border-color: var(--g0); color: var(--g0); }
.pt.g1 { border-color: var(--g1); color: var(--g1); background: color-mix(in srgb, var(--g1) 16%, var(--panel)); }
.pt.g2 { border-color: var(--g2); color: var(--g2); background: color-mix(in srgb, var(--g2) 18%, var(--panel)); }
.pt.g3 { border-color: var(--g3); color: var(--g3); background: color-mix(in srgb, var(--g3) 20%, var(--panel)); }
.pt.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.wm-info { min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 17px; color: var(--dim); }
.wm-info b { color: var(--ink); }
.wm-info .g0 { color: var(--g0); } .wm-info .g1 { color: var(--g1); } .wm-info .g2 { color: var(--g2); } .wm-info .g3 { color: var(--g3); }
.wm-info .warn { color: var(--accent-ink); }
.btn.sm { height: 32px; padding: 0 14px; font-size: 13px; flex: none; }
.wm-sec { font-size: 11px; color: var(--dim); margin-bottom: -4px; }
.wm-augs { display: flex; flex-direction: column; gap: 5px; }
.arow {
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; align-items: center;
  padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--panel-2);
}
.arow .chip { font-size: 10.5px; font-weight: 600; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; }
.arow b { font: 16px var(--font-display); color: var(--ink); }
.arow .ds { grid-column: 1 / -1; font-size: 12px; color: var(--ink); }
.arow.empty { display: block; border-style: dashed; background: none; color: var(--dim); font-size: 11.5px; padding: 5px 14px; }
.arow.g0 { border-color: var(--g0); } .arow.g1 { border-color: var(--g1); } .arow.g2 { border-color: var(--g2); } .arow.g3 { border-color: var(--g3); }
@media (max-height: 640px) { .schem { height: 156px; } .schem .core { width: 72px; height: 72px; } .pt { height: 42px; } .modal.wm { padding: 12px; gap: 6px; } }

/* 겹침 창 */
#overlay {
  position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: var(--overlay);
}
#overlay[hidden] { display: none; }
.modal {
  width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto;
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.modal h1 { margin: 0; font: 40px/1 var(--font-display); letter-spacing: 1px; text-wrap: balance; }
.modal h1 span { color: var(--accent-ink); }
.modal h2 { margin: 0; font: 24px/1.1 var(--font-display); }
.modal p { margin: 0; color: var(--dim); }
.modal ol { margin: 0; padding-left: 18px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.rec { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.rec div { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
.rec small { display: block; font-size: 10px; color: var(--dim); }
.rec b { font: 20px var(--font-display); font-variant-numeric: tabular-nums; }
.newrec { color: var(--accent-ink); font-weight: 600; }
.aug {
  text-align: left; width: 100%; padding: 10px 12px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--panel-2);
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 3px; align-items: center;
}
.aug .chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.aug .nm { font: 18px var(--font-display); }
.aug .ds { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink); }
.aug .tag { grid-column: 1 / -1; font-size: 11px; color: var(--ok); }
.aug.g0 { border-color: var(--g0); } .aug.g1 { border-color: var(--g1); } .aug.g2 { border-color: var(--g2); } .aug.g3 { border-color: var(--g3); }
.aug.g3 { background: color-mix(in srgb, var(--g3) 14%, var(--panel-2)); } .aug.g2 { background: color-mix(in srgb, var(--g2) 12%, var(--panel-2)); }
.cur { font-size: 11.5px; color: var(--dim); }

@media (prefers-reduced-motion: reduce) {
  .slot.tg, .cell.new, .slot .pop { animation: none; }
  .slot .pop { opacity: 0; }
}

/* 파츠 그림과 목록 */
.cell.kp svg { display: block; }
.ghost.g0 { color: var(--g0); } .ghost.g1 { color: var(--g1); } .ghost.g2 { color: var(--g2); } .ghost.g3 { color: var(--g3); }
.prow {
  text-align: left; width: 100%; padding: 8px 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--panel-2);
  display: grid; grid-template-columns: auto auto 1fr; column-gap: 8px; row-gap: 2px; align-items: center;
}
.pic { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; border: 1.5px solid currentColor; border-radius: 6px; background: var(--bg); }
.prow .pic { grid-row: 1 / span 2; }
.prow .chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.prow .nm { font: 17px var(--font-display); color: var(--ink); }
.prow .ds { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink); }
.prow.g0 { border-color: var(--g0); } .prow.g1 { border-color: var(--g1); } .prow.g2 { border-color: var(--g2); } .prow.g3 { border-color: var(--g3); }
.curpart { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; }
.curpart.g0 { border-color: var(--g0); } .curpart.g1 { border-color: var(--g1); } .curpart.g2 { border-color: var(--g2); } .curpart.g3 { border-color: var(--g3); }
.curpart .tx { font-size: 12.5px; color: var(--ink); }
.plist { display: flex; flex-direction: column; gap: 6px; }
.modal p.warn { color: var(--accent-ink); }

/* 증강, 파츠 목록: 고른 것 표시 */
.aug.sel, .prow.sel { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 강화 모드 표시 */
#weapons.upmode { background: linear-gradient(0deg, color-mix(in srgb, var(--accent) 24%, transparent), transparent 75%), var(--panel); border-top-color: var(--accent); }
#weapons.upmode .slot:not(.empty) { border-color: var(--accent); animation: upglow 1s ease-in-out infinite; }
@keyframes upglow { 50% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 0 14px color-mix(in srgb, var(--accent) 35%, transparent); } }
.upcue { position: absolute; right: 6px; top: 4px; width: 12px; height: 20px; pointer-events: none; }
.upcue i {
  position: absolute; left: 0; top: 12px; width: 0; height: 0; opacity: 0;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 7px solid var(--accent);
  animation: upcue .9s linear infinite;
}
.upcue i:nth-child(2) { animation-delay: .45s; }
@keyframes upcue { 0% { top: 13px; opacity: 0; } 30% { opacity: 1; } 100% { top: -3px; opacity: 0; } }

/* 강화 결과 연출 */
#fxLayer { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
.upfx { position: absolute; --tx: -50%; }
.upfx .glow { position: absolute; inset: 0; border-radius: 6px; animation: upfade .9s ease-out forwards; }
.upfx.ok .glow { background: rgba(122, 240, 193, .5); box-shadow: 0 0 26px 8px rgba(122, 240, 193, .75); }
.upfx.no .glow { background: rgba(255, 93, 93, .45); box-shadow: 0 0 18px 4px rgba(255, 93, 93, .6); animation: upshake .45s linear, upfade .9s ease-out forwards; }
.upfx .ring { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; border: 3px solid var(--ok); animation: upring .7s ease-out forwards; }
.upfx.no .ring { display: none; }
.upfx b {
  position: absolute; left: 50%; bottom: calc(100% - 4px); white-space: nowrap; font: 28px var(--font-display);
  text-shadow: 0 2px 0 var(--shadow), 0 0 10px var(--shadow); animation: uptext 1.05s cubic-bezier(.2, 1.4, .4, 1) forwards;
}
.upfx.ok b { color: var(--ok); } .upfx.no b { color: var(--danger); font-size: 23px; }
.upfx.edge-l b { left: 2px; --tx: 0%; } .upfx.edge-r b { left: auto; right: 2px; --tx: 0%; }
.upfx s { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--accent); animation: upspark .7s ease-out forwards; }
@keyframes upfade { to { opacity: 0; } }
@keyframes upring { from { transform: scale(.4); opacity: 1; } to { transform: scale(3.4); opacity: 0; } }
@keyframes uptext {
  0% { transform: translate(var(--tx), 12px) scale(.3); opacity: 0; }
  22% { transform: translate(var(--tx), -6px) scale(1.3); opacity: 1; }
  40% { transform: translate(var(--tx), -8px) scale(1); }
  80% { opacity: 1; }
  100% { transform: translate(var(--tx), -30px) scale(1); opacity: 0; }
}
@keyframes upspark { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
@keyframes upshake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

.lgfx .ring { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px; border-radius: 50%; border: 3px solid var(--g3); animation: upring .8s ease-out forwards; }

@media (prefers-reduced-motion: reduce) {
  .cell.kp.g3::after, .pic.g3::after, .prow.g3::after, .pt.g3::after, .aug.g3::after, .arow.g3::after, .cbox.g3::after, .curpart.g3::after { display: none; animation: none; }

<body>
<div id="app">
  <header id="hud">
    <div class="hp" aria-label="기지 체력">
      <div class="hp-bar"><i id="hpFill"></i></div>
      <span id="hpTxt">100</span>
    </div>
    <div class="stat"><small>시간</small><b id="tTxt">0:00</b></div>
    <div class="stat"><small>처치</small><b id="kTxt">0</b></div>
    <div class="stat gold"><small>재화</small><b id="gTxt">0</b></div>
    <button id="speedBtn" type="button" aria-label="게임 속도">1배</button>
    <button id="pauseBtn" type="button" aria-label="일시정지">II</button>
  </header>
  <div id="fieldWrap"><canvas id="field"></canvas></div>
  <div id="weapons"></div>
  <div id="bottom"></div>
  <div id="overlay" hidden></div>
</div>
<script>
/* 도형 디펜스: 게임 로직 (화면과 분리되어 있어 단독 실행 가능) */
(function (root) {
'use strict';

const LANES = 5, LW = 100, W = LANES * LW;
let H = 520;
const GRADES = ['일반', '희귀', '영웅', '전설'];
const CFG = {
  invSize: 15,        // 인벤토리 칸 수 (답답하면 여기만 바꾸면 됨)
  maxLv: 100,
  baseHp: 100,
  startGold: 80,
  bossEvery: 60,
  augEvery: 5,
  extraShotMul: 0.6,
  meltPts: [20, 50, 120, 300],   // 용해로: 등급별로 파츠를 녹여 얻는 게이지
  craftCost: 100,            // 제조 1회에 드는 게이지
  craftW: [0, 62, 30, 8],    // 제조한 파츠의 등급 비율 (희귀 이상만)
  baseSlots: 4,              // 기지 파츠 칸 수
  baseHpPerLv: 4,            // 기지 강화 1단계마다 최대 체력
  basePartShare: 0.25,       // 파츠가 나올 때 기지 파츠일 확률
};

const rnd = Math.random;
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function wpick(ws) {
  let t = 0; for (const w of ws) t += w;
  let r = rnd() * t;
  for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) return i; }
  return ws.length - 1;
}

/* ---------- 밸런스 수치 ---------- */
const BAL = {
  // L강에 도전할 때의 성공률 (1강 100% → 100강 10%, 초반에 더 빨리 감소)
  success(L) {
    if (L <= 1) return 1;
    const x = (L - 1) / 99;
    return 0.10 + 0.90 * Math.pow(1 - x, 1.1);
  },
  lvMul(L) { return Math.pow(1.05, L); },
  // 적 체력 배수: 끊김 없는 식 하나. 초반에는 거의 오르지 않고, 이후 꾸준히 오르며 끝없이 계속된다
  hpMul(t) { return Math.pow(1 + Math.pow(t / 260, 3.1), 0.9) * Math.exp(0.0012 * t); },
  bossMul(n) { return 1 - 0.6 * Math.exp(-n / 2.5); }, // 초반 보스는 약하게
  spawnRate(t) { return 0.5 + 5.5 * (1 - Math.exp(-t / 340)); },
  // 초반에는 넉넉하고(시작 +35%) 시간이 갈수록 완만하게 줄어든다
  goldMul(t) { return (1 + t / 80) * (0.63 + 0.72 * Math.exp(-t / 200)); },
  genCost(n) { return Math.round(10 * Math.pow(1 + 0.2 * n, 1.25)); },
  // 강화 조각 수는 낸 비용을 따라가되 비용보다 느리게 늘어난다 (비용이 10배면 조각은 약 8배)
  bundleExp: 0.9,
  bundle(cost) { return Math.max(3, Math.round((0.75 + rnd() * 0.5) * 4.5 * Math.pow(cost / 10, BAL.bundleExp))); },

let S = null;

/* ---------- 능력치 계산 ---------- */
function blankStats(lanes, chain) {
  return {
    dmgPct: 0, ratePct: 0, crit: 0.10, critDmg: 0, rangePct: 0, areaPct: 0, bossPct: 0, goldPct: 0,
    execPct: 0, firstPct: 0, heal: 0, luck: 0, save: 0, dbl: 0,
    pierce: 0, shots: 0, splash: 0, slow: 0, burn: 0, knock: 0, stun: 0, lanes,
    chain, chainGrow: 0, closePct: 0, third: 0, instakill: 0, cluster: 0, pool: 0, echo: 0, sideBeam: 0,
    farPct: 0, gamble: 0, shield: 0, magnet: 0, ramp: 0, deathBoom: 0,
    rico: 0, split: 0, giant: 0, again: 0, slug: 0, freeze: 0, orbit: 0, hold: 0, orbs: 0, nova: 0,
    shrap: 0, barrage: 0, nuke: 0, multi: 0, storm: 0,
    vuln: 0, vulnT: 0, through: 0, twin: 0, carry: 0, poolAcid: 0,
    };
}
function stats(w) {
  if (w._s) return w._s;
  const d = WEAPONS[w.type];
  const s = blankStats(d.lanes, d.chain || 0);
  for (const p of w.parts) if (p) PARTS[p.id].ap(s, PARTS[p.id].v[p.g]);
  for (const a of w.augs) if (a) AUGS[a.id].ap(s, AUGS[a.id].v[a.g]);
  const bs = bstats();                    // 기지 파츠의 전체 효과
  s.dmgPct += bs.dmgAll; s.rangePct += bs.rangeAll;
  const rg = Math.max(0.4, 1 + s.rangePct);
  s.dmg = d.dmg * BAL.lvMul(w.lv) * Math.max(0.2, 1 + s.dmgPct);
  s.cd = d.cd / Math.max(0.4, 1 + s.ratePct);
  s.range = Math.min(1, d.range * rg);
  s.lanes = Math.min(5, s.lanes);
  s.radius = (d.radius || 0) * (rg + s.areaPct);
  s.blast = (d.blast || 0) * (rg + s.areaPct);
  s.jump = 140 * rg;
  s.crit = Math.min(1, s.crit);
  s.color = d.color;
  s.type = w.type;
  s.w = w;
  Object.defineProperty(w, '_s', { value: s, writable: true, configurable: true, enumerable: false });
  return s;
}
function dirty(w) { if (w) w._s = null; }
// 기지 능력치: 강화 단계, 기지 파츠, 기지 증강의 합
function bstats() {
  const b = S.base; if (b._s) return b._s;
  const s = { hpAdd: 0, regen: 0, shield: 0, heal: 0, nearSlow: 0, luck: 0, save: 0, magnet: 0, goldAll: 0, dmgAll: 0, rangeAll: 0, revive: 0,
    turret: 0, shock: 0, fence: 0, wave: 0, bomb: 0 };
  for (const p of b.parts) if (p) PARTS[p.id].ap(s, PARTS[p.id].v[p.g]);
  for (const a of b.augs) if (a) AUGS[a.id].ap(s, AUGS[a.id].v[a.g]);
  s.shield = Math.min(0.6, s.shield);
  s.maxHp = CFG.baseHp + b.lv * CFG.baseHpPerLv + s.hpAdd;
  s.st = Object.assign(blankStats(0, 0), { color: '#7af0c1', type: 'base', w: b, dmg: 0, crit: 0 });   // 기지가 주는 피해의 기록용
  Object.defineProperty(b, '_s', { value: s, writable: true, configurable: true, enumerable: false });
  return s;
}
function syncMaxHp() {
  const m = bstats().maxHp, old = S.maxHp || m;
  if (m > old) S.hp += m - old;
  S.maxHp = m; if (S.hp > m) S.hp = m;
}
function bdirty() {
  S.base._s = null;
  for (const w of S.slots) dirty(w);
  for (const it of S.inv) if (it && it.kind === 'w') dirty(it);
  syncMaxHp();
}
function bestDps() { // 가장 강한 무기의 초당 화력 (기지 포탑 등의 기준)
  let d = 0;
  for (const w of S.slots) if (w) { const st = stats(w); d = Math.max(d, st.dmg / st.cd); }
  return d || 10;
}

/* ---------- 인벤토리 ---------- */
function freeSlot() { return S.inv.indexOf(null); }
function shardCount() { return S.shards || 0; }   // 강화 조각은 인벤토리가 아니라 재화다
function addShards(n) { S.shards = (S.shards || 0) + n; }
function takeShards(n) { S.shards = Math.max(0, (S.shards || 0) - n); }
function addItem(item) {
  const i = freeSlot(); if (i < 0) return -1;
  S.inv[i] = item; return i;
}
function weaponCount() {
  let n = 0;
  for (const w of S.slots) if (w) n++;
  for (const it of S.inv) if (it && it.kind === 'w') n++;
  return n;
}
function ownedTypes() {
  const o = {};
  for (const w of S.slots) if (w) o[w.type] = 1;
  for (const it of S.inv) if (it && it.kind === 'w') o[it.type] = 1;
  return o;
}

/* ---------- 생성 ---------- */
function genCost() { return BAL.genCost(S.gen); }
function rollPartGrade(boost) {
  const f = 1 - Math.exp(-S.t / 700);  // 시간이 갈수록 천천히 좋아진다
  const ws = [80 - 28 * f, 17 + 13 * f, 2.7 + 11.3 * f, 0.3 + 3.7 * f];
  let g = wpick(ws);
  if (boost) g = Math.max(1, g, wpick(ws));
  return g;
}
function newPart(boost) {
  const g = rollPartGrade(boost);
  const ids = (rnd() < CFG.basePartShare ? BASE_PART_IDS : WEAPON_PART_IDS).filter(id => PARTS[id].min <= g);
  return { kind: 'p', id: pick(ids), g };
}
function randomWeapon(preferNew) {
  let ids = WEAPON_IDS;
  if (preferNew) { const o = ownedTypes(); const f = ids.filter(id => !o[id]); if (f.length) ids = f; }
  return newWeapon(pick(ids));
}
function generate() {
  if (!S || S.over || S.pendingAug) return { ok: false, reason: 'busy' };
  const c = genCost();
  if (S.gold < c) return { ok: false, reason: 'gold' };
  if (freeSlot() < 0) return { ok: false, reason: 'full' };
  S.gold -= c; S.gen++;
  const nW = weaponCount();
  const pw = nW < 1 ? 1 : 0.08 + 0.92 * Math.exp(-(nW - 1) / 1.8);  // 무기를 많이 가질수록 연속적으로 줄어든다
  const r = rnd();
  let item;
  if (r < pw) item = randomWeapon(nW < 4);
  else if (r < pw + (1 - pw) * 0.18) item = newPart(false);
  else { const n = BAL.bundle(c); addShards(n); return { ok: true, item: { kind: 's', n } }; }
  addItem(item);
  return { ok: true, item };
}
function bossDrop() {
  const nW = weaponCount();
  if (rnd() < (nW < 5 ? 0.6 : 0.12)) return randomWeapon(true);
  return newPart(true);
}

/* ---------- 장착과 해제 ---------- */
function discard(i) { if (S.inv[i]) { S.inv[i] = null; return true; } return false; }
function moveInv(a, b) { // 인벤토리 안에서 자리 바꾸기
  if (a === b) return false;
  const x = S.inv[a], y = S.inv[b]; if (!x) return false;
  S.inv[a] = y; S.inv[b] = x; return true;
}
function equipWeapon(invIdx, slot) {
  const it = S.inv[invIdx];

        const t = nearest(cx, one);

        const ang = Math.atan2(tx - wx, wy - ty);
        for (let i = 0; i < n; i++) bullet(wx, wy, ang + (i === 0 ? 0 : (rnd() - 0.5) * 0.16), st.dmg * (i === 0 ? 1 : CFG.extraShotMul), st, dist);
      }
      if (st.slug && w.n % 3 === 0) bullet(wx, wy, 0, st.dmg * st.slug, st, H + 120, { pierce: 99, r: 12, kn: 18, big: 1 });
      return true;
    }
    case 'laser': {
      let any = false; const list = [];
      for (const e of S.enemies) if (inReach(e, wx, st)) { list.push(e); any = true; }
      if (!any) return false;
      w.n++;
      const m = st.third && w.n % 3 === 0 ? 1 + st.third : 1;
      for (const e of list) hit(e, st.dmg * m, st);
      fx({ k: 'beam', d: 0.16, x: wx, y0: H - st.range * H, y1: H, w: (st.lanes * 2 + 1) * (m > 1 ? 16 : 9), c: st.color });
      if (st.sideBeam) {
        const wide = { lanes: st.lanes + 1, range: st.range };
        for (const e of S.enemies) if (inReach(e, wx, wide) && list.indexOf(e) < 0) hit(e, st.dmg * m * st.sideBeam, st);
        for (const sx of [wx - (st.lanes + 1) * LW, wx + (st.lanes + 1) * LW]) {
          if (sx > 0 && sx < W) fx({ k: 'beam', d: 0.16, x: sx, y0: H - st.range * H, y1: H, w: 5, c: st.color });
        }
      }
      if (st.orbit) {                        // 궤도 포격: 적이 있는 다른 레인에 빔 낙하
        const lanes = [];
        for (let j = 0; j < LANES; j++) {
          if (Math.abs(j - slot) <= st.lanes) continue;
          const cx = (j + 0.5) * LW;
          if (S.enemies.some(e => !e.dead && e.y + e.r > 0 && Math.abs(e.x - cx) <= LW / 2 + e.r * 0.4)) lanes.push(j);
        }
        if (lanes.length) {
          const cx = (pick(lanes) + 0.5) * LW;
          for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && Math.abs(e.x - cx) <= LW / 2 + e.r * 0.4) hit(e, st.dmg * m * st.orbit, st);
          fx({ k: 'beam', d: 0.3, x: cx, y0: 0, y1: H, w: 16, c: '#ffffff' });
        }
      }
      if (st.hold) S.beams.push({ k: slot, t: 0.6, tick: 0.1, st });
      return true;
    }
    case 'pulse': {
      const R = st.radius; const list = [];
      for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && Math.hypot(e.x - wx, e.y - H) <= R + e.r * 0.5) list.push(e);
      if (!list.length) return false;
      w.n++;
      if (st.nova && w.n % 5 === 0) {        // 초신성
        const R2 = R * 2.2;
        for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && Math.hypot(e.x - wx, e.y - H) <= R2 + e.r * 0.5) hit(e, st.dmg * st.nova, st);
        fx({ k: 'ring', d: 0.55, x: wx, y: H, r: R2, c: '#ffffff', fat: 1 });
        fx({ k: 'flash', d: 0.18 });
        return true;
      }
      const times = st.echo && rnd() < st.echo ? 2 : 1;
      for (let k = 0; k < times; k++) {
        for (const e of list) hit(e, st.dmg, st);
        fx({ k: 'ring', d: 0.3 + k * 0.12, x: wx, y: H, r: R, c: st.color });
      }
      return true;
    }
    case 'mortar': {
      let t = null;
      for (const e of S.enemies) if (!e.dead && e.y + e.r > 0 && (!t || e.y > t.y)) t = e;
      if (!t) return false;
      w.n++;
      const nuke = st.nuke && w.n % 4 === 0;
      const targets = [t];
      if (st.barrage) {
        const rest = S.enemies.filter(e => !e.dead && e !== t && e.y + e.r > 0).sort((a, b) => b.y - a.y);
        for (let k = 0; k < st.barrage; k++) targets.push(rest[k * 2] || rest[k] || t);
      }
      targets.forEach((e, k) => {
        const dur = 0.55 + k * 0.14, off = k && e === t ? (rnd() - 0.5) * 120 : 0;
        S.shells.push({ x0: wx, y0: wy, tx: Math.max(10, Math.min(W - 10, e.x + off)), ty: Math.min(H - 6, e.y + e.speed * H * dur), p: 0, dur, st,
          dmg: st.dmg * (k ? 0.7 : nuke ? st.nuke : 1), nuke: !k && nuke });
      });
      return true;
    }
    case 'tesla': {
      const first = nearestPref(wx, st); if (!first) return false;
      w.n++;
      const starts = [first];
      if (st.multi) {
        const bq = baseReach(st);
        let rest = bq ? S.enemies.filter(e => e !== first && inReach(e, wx, bq)) : [];
        if (!rest.length) rest = S.enemies.filter(e => e !== first && inReach(e, wx, st));
        rest.sort((a, b) => b.y - a.y);
        for (let k = 0; k < st.multi && k < rest.length; k++) starts.push(rest[k]);
      }
      const done = starts.slice();
      for (const s0 of starts) {
        let cur = s0, dmg = s0 === first ? st.dmg : st.dmg * 0.6, px = wx, py = wy;
        const pts = [[px, py]];
        for (let j = 0; j <= st.chain && cur; j++) {
          pts.push([cur.x, cur.y]);
          hit(cur, dmg, st);
          dmg *= st.chainGrow ? 1 + st.chainGrow : 0.8;
          px = cur.x; py = cur.y;
          let nx = null, bd = st.jump;
          for (const e of S.enemies) {
            if (e.dead || e.y + e.r <= 0 || done.indexOf(e) >= 0) continue;
            const dd = Math.hypot(e.x - px, e.y - py) - e.r * 0.5;
            if (dd <= bd) { bd = dd; nx = e; }
          }
          cur = nx; if (cur) done.push(cur);
        }
        fx({ k: 'bolt', d: 0.14, pts, c: st.color });
      }
      if (st.storm && w.n % 3 === 0) {        // 번개 폭풍
        const pool = S.enemies.filter(e => !e.dead && e.y + e.r > 0);
        for (let k = 0; k < st.storm && pool.length; k++) {
          const e = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
          fx({ k: 'bolt', d: 0.22, pts: [[e.x + (rnd() - 0.5) * 60, 0], [e.x, e.y]], c: '#ffffff' });
          hit(e, st.dmg * 1.5, st);
        }
      }
      return true;
    }
    case 'rail': {                             // 저격포: 모든 레인에서 체력이 가장 많은 적을 즉시 저격
      const pool = S.enemies.filter(e => !e.dead && e.y + e.r > 0).sort((a, b) => b.hp - a.hp);
      if (!pool.length) return false;
      w.n++;
      const shots = [[pool[0], 1, true]];
      if (st.twin && pool.length > 1) shots.push([pool[1], st.twin / 100, false]);
      for (const [t, mul, carry] of shots) {
        if (t.dead) continue;
        const tx = t.x, ty = t.y, dx = tx - wx, dy = ty - wy, len = Math.hypot(dx, dy) || 1;
        let ex = tx, ey = ty;
        if (st.through) {                      // 관통 저격: 표적 뒤 일직선상의 적도 맞힌다
          const ux = dx / len, uy = dy / len;
          for (const o of S.enemies) {
            if (o === t || o.dead || o.y + o.r <= 0) continue;
            const ox = o.x - wx, oy = o.y - wy, pr = ox * ux + oy * uy;
            if (pr > len && Math.abs(ox * uy - oy * ux) <= o.r + 4) hit(o, st.dmg * mul * st.through / 100, st);
          }
          ex = wx + ux * 1200; ey = wy + uy * 1200;
        }
        fx({ k: 'rail', d: 0.12, x0: wx, y0: wy, x1: ex, y1: ey, c: st.color });
        hit(t, st.dmg * mul, st);
        if (carry && st.carry && t.dead) {     // 과잉 살상: 남은 피해가 다음으로 체력이 많은 적에게 넘어간다
          let over = -t.hp, px = tx, py = ty, k = 0;
          for (let i = 1; i < pool.length && k < st.carry && over > 0.5; i++) {
            const o = pool[i];
            if (o.dead || o === shots[1]?.[0]) continue;
            fx({ k: 'rail', d: 0.12, x0: px, y0: py, x1: o.x, y1: o.y, c: st.color });
            hit(o, over, st, true, true);
            over = o.dead ? -o.hp : 0; px = o.x; py = o.y; k++;
          }
        }
      }
      return true;
    }
    case 'acid': {                             // 산성 분사기: 정면 가까운 범위의 모든 적을 계속 타격
      const list = [];
      for (const e of S.enemies) if (inReach(e, wx, st)) list.push(e);
      if (!list.length) return false;
      w.n++;
      const ry = H - st.range * H;
      sparkCap = 1;                            // 한 번에 불꽃은 하나만
      try {
        for (const e of list) hit(e, st.dmg, st);
        if (st.sideBeam) {
          const wide = { lanes: st.lanes + 1, range: st.range };
          for (const e of S.enemies) if (inReach(e, wx, wide) && list.indexOf(e) < 0) hit(e, st.dmg * st.sideBeam, st);
        }
      } finally { sparkCap = Infinity; }
      fx({ k: 'spray', d: 0.24, x: wx, y: H - 12, len: st.range * H, a: 0, sd: rnd(), c: st.color });
      if (st.sideBeam) { fx({ k: 'spray', d: 0.24, x: wx, y: H - 12, len: st.range * H * 0.7, a: -1, sd: rnd(), c: st.color }); fx({ k: 'spray', d: 0.24, x: wx, y: H - 12, len: st.range * H * 0.7, a: 1, sd: rnd(), c: st.color }); }
      if (st.pool && S.t >= (w.pt || 0)) {    // 산성 웅덩이: 3초마다 분사 범위 끝에 생성
        w.pt = S.t + 3;
        S.pools.push({ x: wx, y: Math.max(20, ry), r: 55, dps: st.dmg * st.pool, t: 3, st, c: st.color });
      }
      return true;
    }
  }
  return false;
}

// 위성 구체의 위치 (화면 표시와 판정이 같은 식을 쓴다)
function orbPos(slot, st, i, t) {
  const a = Math.PI * (0.5 + 0.46 * Math.sin(t * 1.5 + i * 2 * Math.PI / st.orbs));
  const R = st.radius * 0.85;
  return [(slot + 0.5) * LW + R * Math.cos(a), H - R * Math.sin(a)];
}

/* ---------- 보스 능력 ---------- */
function note(text) { if (S.notes.length < 6) S.notes.push(text); }
function itemName(it) {
  if (it.kind === 'w') return WEAPONS[it.type].name + ' +' + it.lv;
  if (it.kind === 'p') return PARTS[it.id].name;
  return '강화 조각 ' + it.n + '개';
}
function bossStep(dt) {
  const alive = {};
  for (let i = 0, n = S.enemies.length; i < n; i++) {
    const e = S.enemies[i];
    if (!e.boss || e.dead) continue;
    alive[e.type] = e;
    if (e.y <= 0) continue;                  // 화면에 들어온 뒤에만 능력을 쓴다
    switch (e.type) {
      case 'summon':
        e.abT = (e.abT == null ? 4 : e.abT) - dt;
        if (e.abT <= 0) {
          e.abT += 4;
          if (S.enemies.length < 150) for (let k = 0; k < 3; k++) spawn('swarm', e.lane, e.x + (k - 1) * 26 + (rnd() - 0.5) * 10, e.y - e.r * 0.4 - k * 6);
          fx({ k: 'ring', d: 0.4, x: e.x, y: e.y, r: e.r * 1.5, c: '#ff5fd0', full: 1 });
        }
        break;
      case 'jammer': {
        e.abT = (e.abT == null ? 7 : e.abT) - dt;
        if (e.abT <= 0) {
          e.abT += 7;
          const c = []; for (let k = 0; k < LANES; k++) if (S.slots[k] && !S.locks[k]) c.push(k);
          if (c.length) { S.locks[pick(c)] = { w: 2, l: 0 }; S.slotDirty = true; snd('warn'); }
        }
        break;
      }
      case 'thief':
        e.abT = (e.abT == null ? 9 : e.abT) - dt;
        if (e.abT <= 0) {
          e.abT += 9;
          if (!S.steal) {
            const c = []; for (let k = 0; k < S.inv.length; k++) if (S.inv[k]) c.push(k);
            if (c.length) { S.steal = { i: pick(c), t: 2 }; S.invDirty = true; snd('warn'); }
          }
        }
        break;
      case 'corrode':
        e.abT = (e.abT == null ? 12 : e.abT) - dt;
        if (e.abT <= 0) {
          e.abT += 12;
          if (!S.corr) {
            let c = []; for (let k = 0; k < LANES; k++) if (S.slots[k] && S.slots[k].lv > 0) c.push(k);
            if (!c.length) for (let k = 0; k < LANES; k++) if (S.slots[k]) c.push(k);
            if (c.length) { S.corr = { k: pick(c), t: 2 }; S.slotDirty = true; snd('warn'); }
          }
        }
        break;
    }
  }
  // 봉쇄: 경고 2초, 잠금 5초. 봉쇄체가 없으면 모두 풀린다
  if (!alive.jammer) { if (Object.keys(S.locks).length) { S.locks = {}; S.slotDirty = true; } }
  else for (const k of Object.keys(S.locks)) {
    const lk = S.locks[k];
    if (lk.w > 0) { lk.w -= dt; if (lk.w <= 0) { lk.w = 0; lk.l = 5; S.slotDirty = true; } }
    else { lk.l -= dt; if (lk.l <= 0) { delete S.locks[k]; S.slotDirty = true; } }
  }
  // 약탈: 예고한 칸에 그때 있는 물건을 가져간다
  if (S.steal) {
    const th = alive.thief;
    if (!th) { S.steal = null; S.invDirty = true; }
    else {
      S.steal.t -= dt;
      if (S.steal.t <= 0) {
        const it = S.inv[S.steal.i];
        if (it) { S.inv[S.steal.i] = null; note('<b>약탈체</b>가 <b>' + itemName(it) + '</b>을(를) 훔쳐 갔습니다.'); snd('leak'); }
        S.steal = null; S.invDirty = true;
      }
    }
  }
  // 부식: 예고한 칸의 무기 강화 단계를 5 낮춘다. 0 아래로 내려가면 무기가 파괴된다
  if (S.corr) {
    if (!alive.corrode) { S.corr = null; S.slotDirty = true; }
    else {
      S.corr.t -= dt;
      if (S.corr.t <= 0) {
        const w = S.slots[S.corr.k];
        if (w) {
          if (w.lv - 5 < 0) {
            S.slots[S.corr.k] = null;
            note('부식: ' + WEAPONS[w.type].name + ' 파괴됨');
          } else {
            w.hi = Math.max(w.hi || 0, w.lv);   // 이미 받은 증강은 다시 받지 못하게 기록
            w.lv -= 5; dirty(w);
            note('<b>부식체</b>가 <b>' + WEAPONS[w.type].name + '</b>의 강화 단계를 낮췄습니다. (+' + w.lv + ')');
          }
          snd('leak');
        }
        S.corr = null; S.slotDirty = true;
      }
    }
  }
}

/* ---------- 한 프레임 진행 ---------- */
function step(dt) {
  if (!S || S.over || S.pendingAug) return;
  S.t += dt;
  if (S.hitFlash > 0) S.hitFlash -= dt;

  // 적 등장
  S.spawnAcc += BAL.spawnRate(S.t) * dt;
  while (S.spawnAcc >= 1) { S.spawnAcc -= 1; spawnWave(); }
  if (S.t >= S.nextBoss) { S.nextBoss += CFG.bossEvery; spawnBoss(); }

  bossStep(dt);

  // 무기
  for (let i = 0; i < LANES; i++) {
    const w = S.slots[i]; if (!w) continue;
    const lk = S.locks[i]; if (lk && lk.l > 0) continue;     // 봉쇄된 칸은 발사하지 않는다
    w.cd -= dt;
    if (w.ag > 0) {                          // 2연발의 두 번째 발사
      w.ag -= dt;
      if (w.ag <= 0) { w.ag = 0; const st = stats(w); if (fire(w, i, Object.assign({}, st, { dmg: st.dmg * st.again }))) snd(w.type); }
    }
    if (w.cd <= 0) {
      const st = stats(w);
      if (fire(w, i, st)) {
        snd(w.type);
        let cd = st.cd;
        if (st.ramp) { w.rp = Math.min(st.ramp, (w.rp || 0) + 0.03); cd /= 1 + w.rp; }
        if (st.again) w.ag = 0.13;
        w.cd = st.dbl && rnd() < st.dbl ? Math.min(0.1, cd) : cd;
      } else { w.cd = 0.05; if (w.rp) w.rp = Math.max(0, w.rp - 0.02); }
    }
    if (w.type === 'pulse') {                // 위성 구체
      const st = stats(w);
      for (let k = 0; k < st.orbs; k++) {
        const p = orbPos(i, st, k, S.t), dps = st.dmg / st.cd * 1.5;
        for (let j = 0, n = S.enemies.length; j < n; j++) {
          const e = S.enemies[j];
          if (!e.dead && Math.hypot(e.x - p[0], e.y - p[1]) <= 18 + e.r * 0.6) dot(e, dps * dt, st);
        }
      }
    }
  }

  // 지속 빔
  for (const b of S.beams) {
    b.t -= dt; b.tick -= dt;
    if (b.tick <= 0) {
      b.tick += 0.1;
      const wx = (b.k + 0.5) * LW;
      for (let j = 0, n = S.enemies.length; j < n; j++) { const e = S.enemies[j]; if (inReach(e, wx, b.st)) hit(e, b.st.dmg * b.st.hold, b.st); }
    }
  }

  // 탄환
  for (const b of S.bullets) {
    const mvx = b.vx * dt, mvy = b.vy * dt;
    b.x += mvx; b.y += mvy; b.left -= Math.hypot(mvx, mvy);
    if (b.left <= 0 || b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) { b.dead = true; continue; }
    for (let i = 0, n = S.enemies.length; i < n; i++) {
      const e = S.enemies[i];
      if (e.dead || b.hit.indexOf(e) >= 0) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) <= e.r + b.r) {
        b.hit.push(e);
        hit(e, b.dmg, b.st);
        if (b.kn && !e.boss && !e.dead) e.y = Math.max(-e.r, e.y - b.kn);
        if (b.split) {                       // 분열탄
          const base = Math.atan2(b.vx, -b.vy), m = b.split;
          for (let k = 0; k < m; k++) {
            const off = m === 2 ? (k ? 0.5 : -0.5) : (k - 1) * 0.55;
            bullet(b.x, b.y, base + off, b.dmg * 0.5, b.st, 240, { split: 0, rico: 0, pierce: 0, r: 3.5 }).hit.push(e);
          }
          b.split = 0;
        }
        if (b.rico > 0) {                    // 도탄: 가까운 다른 적에게 방향을 바꾼다
          let nx = null, bd = 280;
          for (let j = 0; j < n; j++) {
            const o = S.enemies[j];
            if (o.dead || o.y + o.r <= 0 || b.hit.indexOf(o) >= 0) continue;
            const dd = Math.hypot(o.x - b.x, o.y - b.y);
            if (dd < bd) { bd = dd; nx = o; }
          }
          if (nx) {
            const sp = Math.hypot(b.vx, b.vy), a = Math.atan2(nx.x - b.x, b.y - nx.y);
            b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp;
            b.rico--; b.dmg *= 0.65; b.left = Math.max(b.left, 320);
            break;
          }
        }
        if (b.pierce-- <= 0) { b.dead = true; break; }
        b.dmg *= b.big ? 0.85 : 0.55;        // 관통할수록 약해진다
      }
    }
  }

  // 포탄
  for (const s of S.shells) {
    s.p += dt / s.dur;
    if (s.p >= 1) {
      s.dead = true;
      const st = s.st, R = st.blast * (s.nuke ? 2.5 : 1);
      explode(s.tx, s.ty, R, s.dmg, st);
      if (s.nuke) { fx({ k: 'flash', d: 0.22 }); fx({ k: 'ring', d: 0.5, x: s.tx, y: s.ty, r: R * 1.15, c: '#ffffff', fat: 1, full: 1 }); }
      for (let k = 0; k < st.shrap; k++) {
        bullet(s.tx, s.ty, k * 2 * Math.PI / st.shrap + rnd() * 0.4, s.dmg * 0.3, st, 170, { sp: 520, pierce: 0, r: 3.5, rico: 0, split: 0 });
      }
      for (let k = 0; k < st.cluster; k++) {
        const a = rnd() * Math.PI * 2, rr = st.blast * (0.6 + rnd() * 0.7);
        explode(s.tx + Math.cos(a) * rr, s.ty + Math.sin(a) * rr, st.blast * 0.6, s.dmg * 0.4, st);
      }
      if (st.pool) S.pools.push({ x: s.tx, y: s.ty, r: R, dps: s.dmg * st.pool, t: 3, st });
    }
  }

  // 화염 지대
  for (const p of S.pools) {

function drawRange(w, rk) {

    ctx.moveTo(x, H - 13); ctx.lineTo(x + 9, H - 3); ctx.lineTo(x - 9, H - 3); ctx.closePath(); ctx.fill();

/* ---------- 상태 표시 ---------- */
const hudEl = { hp: $('#hpTxt'), fill: $('#hpFill'), t: $('#tTxt'), k: $('#kTxt'), g: $('#gTxt') };

    if (S.newDrop) { S.newDrop = false; legendScan(); say('보스 보상이 인벤토리에 들어왔습니다.'); }

function snapshot() {

  const copy = Object.assign({}, S, {
    bullets: [], shells: [], pools: [], beams: [], fx: [], snd: [], pendingAug: S.pendingAug,

}
